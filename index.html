</div>
`,

194: `
<div class="titulo">
<span class="numero">194</span>
<b>Los amó hasta el fin</b>
</div>

<div class="estrofa">
Antes de la fiesta de la Pascua, sabiendo<br>
Jesús que había llegado su hora<br>
para pasar de este mundo al Padre,<br>
<br>
Como había amado a los suyos que<br>
estaban en el mundo, los amó hasta el fin.<br>
<br>
Así que, después de haberles lavado los pies,<br>
tomó su manto, se volvió a sentar a la mesa<br>
y les dijo: — ¿Entendéis lo que os he hecho?<br>
<br>
—Un mandamiento nuevo os doy:<br>
que os améis los unos a los otros.<br>
Como os he amado, amaos también<br>
vosotros los unos a los otros.<br>
<br>
Entonces llegó Jesús con ellos a un lugar que<br>
se llama Getsemaní, y dijo a los discípulos:<br>
—Sentaos aquí, hasta que yo vaya allá y ore.<br>
<br>
Tomó consigo a Pedro, y a los dos<br>
hijos de Zebedeo, y comenzó a<br>
entristecerse y a angustiarse.<br>
<br>
Pasando un poco más adelante, se postró<br>
sobre su rostro, orando y diciendo:<br>
<br>
—Padre mío, de ser posible, pase de<br>
mí esta copa. Pero, no sea como yo<br>
quiero, sino como tú.
</div>
`,

195: `
<div class="titulo">

la luz resplandeció;<br>

</div>

`,

196: `
<div class="titulo">

`,

198: `

`,

199: `

200: `
<div class="titulo">
<span class="numero">200</span>
<b>Crucificado por nosotros</b>
</div>

<div class="estrofa">
Los principales sacerdotes y los ancianos persuadieron a la<br>
multitud que pidiese a Barrabás, y que Jesús fuese muerto.<br>
<br>
Pilato les dijo: —¿Qué, pues, haré de Jesús,<br>
llamado el Cristo?<br>
<br>
Todos le dijeron: —¡Sea crucificado!<br>
<br>
Y Pilato, queriendo satisfacer al pueblo,<br>
les soltó a Barrabás, y entregó a Jesús,<br>
después de azotarle, para que fuese crucificado.<br>
<br>
Y le llevaron a un lugar llamado Gólgota,<br>
que traducido es: Lugar de la Calavera.<br>
<br>
Era la hora tercera cuando le crucificaron.<br>
Crucificaron también con él a dos ladrones, uno a<br>
su derecha, y el otro a su izquierda.<br>
<br>
Y se cumplió la Escritura que dice:<br>
Y fue contado con los inicuos.<br>
<br>
Cuando vino la hora sexta, hubo tinieblas<br>
sobre toda la tierra hasta la hora novena.<br>
<br>
Mas Jesús, dando una gran voz, expiró.<br>
<br>
Entonces el velo del templo se rasgó en dos, de arriba abajo.<br>
<br>
Y el centurión que estaba frente a él, viendo<br>
que después de clamar había expirado así, dijo:<br>
—Verdaderamente este hombre era hijo de Dios.<br>
<br>
Cristo padeció por nosotros,<br>
<br>
Quien llevó el mismo nuestros pecados en su<br>
cuerpo sobre el madero, para que nosotros,<br>
estando muertos a los pecados, vivamos a la justicia.
</div>
`,
201: `
<div class="titulo">

`,

202: `

203: `

206: `

</div>

<div class="estrofa">
3. En su angustia, llama; "¡Sed yo tengo!" exclama.<br>
¿Y sabéis qué hicieron? vinagre le dieron.<br>
// A aquel penitente que buscarle quiso,<br>
Le ofreció la fuente de su paraíso. //
</div>

<div class="estrofa">
4. Con solemne calma encomienda su alma,<br>
A su Padre amado que ya le ha dejado<br>
// Por el vil pecado de un mundo errado,<br>
Y clama angustiado: "¡Ya es consumado!" //
</div>

<div class="estrofa">
5. ¡Cuán felices fuimos desde que creímos<br>
En el Cristo amado que fuera inmolado!<br>
// Fue a la tumba fría, y resucitado,<br>
Un hermoso día fue glorificado. //
</div>
`,

207: `
<div class="titulo">
<span class="numero">207</span>
<b>Junto a la cruz de Cristo</b>
</div>

<div class="versiculo">
Mediante la cruz reconciliar con Dios. Efesios 2:16
</div>

<div class="notas">Do — Con tranquilidad</div>

<div class="estrofa">
1. Junto a la cruz de Cristo yo quiero siempre estar,<br>
Pues mi alma albergue fuerte<br>
y fiel allí puede encontrar.<br>
<br>
En medio del desierto aquí, allí encuentro hogar<br>
Do del calor y del trajín yo pueda descansar.
</div>

<div class="estrofa">
2. Bendita cruz de Cristo, a veces veo en ti<br>
La misma forma en fiel visión del que sufrió por mí;<br>
<br>
Hoy mi contrito corazón confiesa la verdad<br>
De tu asombrosa redención y de mi indignidad.
</div>

<div class="estrofa">
3. Oh, Cristo, en ti he hallado completa y dulce paz;<br>
No busco bendición mayor que la de ver tu faz;<br>
<br>
Sin atractivo el mundo está, ya que ando por tu luz;<br>
Avergonzado de mi mal, mi gloria es ya la cruz.
</div>
`,

208: `
<div class="titulo">
<span class="numero">208</span>
<b>Un Día</b>
</div>

<div class="versiculo">
Cuando vino el cumplimiento del tiempo, Dios envió a su Hijo. Gálatas 4:4
</div>

<div class="notas">Do — Con vigor</div>

<div class="estrofa">
1. Un día que el cielo sus glorias cantaba,<br>
Un día que el mal imperaba más cruel,<br>
Jesús descendió, y al nacer de una virgen,<br>
Nos dio por su vida ejemplo tan fiel.
</div>

<div class="coro" style="font-style: italic;">
Vivo, me amaba; muerto, salvóme;<br>
Y en el sepulcro mi mal enterró;<br>
Resucitado, él es mi justicia;<br>
Un día él viene, pues lo prometió.
</div>

<div class="estrofa">
2. Un día lleváronle al monte Calvario,<br>
Un día claváronle sobre una cruz;<br>
Sufriendo dolores y pena de muerte,<br>
Expiando el pecado, salvóme Jesús.
</div>

<div class="coro" style="font-style: italic;">
Vivo, me amaba; muerto, salvóme;<br>
Y en el sepulcro mi mal enterró;<br>
Resucitado, él es mi justicia;<br>
Un día él viene, pues lo prometió.
</div>

<div class="estrofa">
3. Un día dejaron su cuerpo en el huerto,<br>
Un día Jesús de dolor reposó.<br>
Velaban los ángeles sobre el sepulcro<br>
De quien por nosotros su vida entregó.
</div>

<div class="coro" style="font-style: italic;">
Vivo, me amaba; muerto, salvóme;<br>
Y en el sepulcro mi mal enterró;<br>
Resucitado, él es mi justicia;<br>
Un día él viene, pues lo prometió.
</div>

<div class="estrofa">
4. Un día la tumba ocultarle no pudo,<br>
Un día el ángel la piedra quitó;<br>
Habiendo Jesús a la muerte vencido,<br>
A estar con su Padre en gloria ascendió.
</div>

<div class="coro" style="font-style: italic;">
Vivo, me amaba; muerto, salvóme;<br>
Y en el sepulcro mi mal enterró;<br>
Resucitado, él es mi justicia;<br>
Un día él viene, pues lo prometió.
</div>

<div class="estrofa">
5. Un día él viene con voz de arcángel,<br>
Un día en su gloria el Señor brillará;<br>
¡Oh día admirable, en que unido, su pueblo<br>
Loores a Cristo por siempre alzará!
</div>

<div class="coro" style="font-style: italic;">
Vivo, me amaba; muerto, salvóme;<br>
Y en el sepulcro mi mal enterró;<br>
Resucitado, él es mi justicia;<br>
Un día él viene, pues lo prometió.
</div>
`,

209: `
<div class="titulo">
<span class="numero">209</span>
<b>Manos Cariñosas</b>
</div>

<div class="versiculo">

</div>

<div class="notas">Re m — Con reverencia</div>

<div class="estrofa">
1. Manos cariñosas, manos de Jesús;<br>

Manos que supieron sólo hacer el bien,<br>
¡Gloria a esas manos! ¡Aleluya, amén!
</div>

<div class="estrofa">
2. Blancas azucenas, lirios de amor,<br>
Fueron esas manos de mi Redentor;<br>
Manos que a los ciegos dieron la visión<br>
Con el real consuelo de su gran perdón.
</div>

<div class="estrofa">
3. Manos que supieron calmar el dolor,<br>
¡Oh, manos divinas de mi Redentor!<br>
Que multiplicaron los peces y el pan,<br>
Manos milagrosas que la vida dan.
</div>

<div class="estrofa">
4. Manos que sufrieron el clavo y la cruz;<br>
Manos redentoras de mi buen Jesús;<br>
De esas manos bellas yo confiado estoy;<br>
Ellas van guiando, pues al cielo voy.
</div>

<div class="estrofa">
5. ¡Oh, Jesús! tus manos yo las vi en visión<br>
Y vertí mi llanto con el corazón;<br>
Vi sus dos heridas y la sangre vi<br>
Que tú derramaste por salvarme a mí.
</div>
`,

211: `
<div class="titulo">
<span class="numero">211</span>
<b>REFLEXION: Mi Señor Jesucristo</b>
</div>

<div class="estrofa">
<b>¡Jesucristo, mi Señor!</b> Me asombra el hecho<br>
de que tú, el Dios eterno, te hiciste hombre<br>
por mí. Dejaste el esplendor celestial por<br>
el establo de Belén. Anduviste por las<br>
polvorientas veredas de Palestina, enseñando<br>
y haciendo el bien. Calmaste el mar<br>
furioso; sanaste al enfermo y diste<br>
esperanza al desalentado.<br>
<br>
Tú, el perfecto Hijo de Dios, tomaste<br>
mi pecado y llevaste mi castigo.<br>
Sufriste el dolor, el rechazo, la soledad...<br>
y la muerte. Eres Jesús, mi Salvador.<br>
<br>
Resucitaste triunfante del sepulcro.<br>
Desde que te recibí por la fe, vives en<br>
mí y estás transformando mi pensar y mis<br>
anhelos. Has quebrantado el poder del<br>
pecado en mi vida. Eres Cristo, mi Libertador.<br>
<br>
Hoy ocupas el lugar de honor a la diestra<br>
de tu Padre, donde intercedes por mí.<br>
Y cuando regreses a este mundo en gloria,<br>
toda rodilla se doblará y toda lengua confesará<br>
que eres el Señor, Dios todopoderoso.<br>
<br>
<b>¡Jesucristo, tú eres mi Señor!</b> Te amo,<br>
te adoro y te alabo con el canto que<br>
surge de mi ser.
</div>
`,

213: `

214: `

</div>

<div class="estrofa">

mañana, fueron al sepulcro...<br>
<br>

del sepulcro; pero al entrar,<br>
no hallaron el cuerpo de Jesús,<br>
<br>

216: `

225: `
<div class="titulo">
<span class="numero">225</span>
<b>Cristo Resucitado</b>
</div>

<div class="lectura">
En la misma hora se levantaron y se volvieron a Jerusalén. Hallaron reunidos a los once y a los que estaban con ellos, quienes decían:

—¡Verdaderamente el Señor ha resucitado y ha aparecido a Simón!

Mientras hablaban estas cosas, Jesús se puso en medio de ellos y les dijo:

—Paz a vosotros.... Mirad mis manos y mis pies, que yo mismo soy. Palpad y ved, pues un espíritu no tiene carne ni huesos como veis que yo tengo.

Entonces les abrió el entendimiento para que comprendiesen las Escrituras, y les dijo:

—Así está escrito, y así fue necesario que el Cristo padeciese y resucitase de los muertos al tercer día.

Entonces él los llevó fuera hasta Betania, y alzando sus manos les bendijo.

Aconteció que al bendecirlos, se fue de ellos, y era llevado arriba al cielo.
</div>

<div class="versiculo">
Lucas 24:33-34, 36, 39, 45-46, 50-51 (RVA)
</div>

239: `
<div class="titulo">
<span class="numero">239</span>
<b>Por los siglos de los siglos</b>
</div>

<div class="lectura">
Yo Juan,... estaba en la isla llamada Patmos por causa de la palabra de Dios y del testimonio de Jesús.

Y..., vi siete candeleros de oro, y en medio de los candeleros vi a uno semejante al Hijo del Hombre,

Vestido con una vestidura que le llegaba hasta los pies y tenía el pecho ceñido con un cinto de oro.

Su cabeza y sus cabellos eran blancos como la lana blanca, como la nieve, y sus ojos eran como llama de fuego.

Sus pies eran semejantes al bronce bruñido, ardiente como en un horno. Su voz era como el estruendo de muchas aguas.

Tenía en su mano derecha siete estrellas, y de su boca salía una espada aguda de dos filos.

Su rostro era como el sol cuando resplandece en su fuerza.

Cuando le vi, caí como muerto a sus pies. Y puso sobre mí su mano derecha, y me dijo:

—No temas. Yo soy el primero y el último, el que vive. Estuve muerto, y he aquí que vivo por los siglos de los siglos.
</div>

<div class="versiculo">
Apocalipsis 1:9, 12b-18a (RVA)
</div>

248: `
<div class="titulo">
<span class="numero">248</span>
<b>REFLEXIÓN: El Espíritu Santo, mi Consolador</b>
</div>

<div class="estrofa">
Espíritu de Dios, ¡cuán maravilloso eres!<br>
Desde la eternidad existes con el Padre y el Hijo,<br>
con quienes creaste el mundo.<br>
<br>
Es por obra tuya también que yo soy una<br>
nueva creación. Tú me convenciste de mi pecado<br>
y me llevaste a la fe en Cristo. Me diste nueva<br>
vida e hiciste tu morada en mí. Eres el sello que<br>
garantiza mi redención final.<br>
<br>
Hoy eres mi Guía y Consolador. Me ayudas<br>
a entender la Biblia, la que tú mismo inspiraste.<br>
Te entristeces por mi desobediencia; señalas mis<br>
errores y me impulsas a confesarlos. Me das<br>
poder para vencer la tentación y el pecado.<br>
<br>
Cultivas en el huerto de mi vida el fruto<br>
que te agrada. Utilizas para beneficio de tu<br>
iglesia las habilidades con las cuales me has<br>
capacitado.<br>
<br>
¡Qué privilegio es tenerte como mi Ayudador!<br>
Cuando me someto a tu control, mi corazón<br>
rebosa con melodías de alabanza y gratitud a<br>
Dios.
</div>
`,

249: `

</div>

<div class="estrofa">
2. Santo Espíritu, fuego celeste,<br>

</div>

<div class="estrofa">
3. Santo Espíritu, aceite bendito,<br>

</div>

<div class="estrofa">

nuestros pies dirigiendo al andar;<br>

`,

250: `
<div class="titulo">
<span class="numero">250</span>
<b>El divino Consolador</b>
</div>

<div class="estrofa">
Yo rogaré al Padre, y os dará otro Consolador,<br>
para que esté con vosotros para siempre:<br>
<br>
El Espíritu de verdad, al cual el mundo no<br>
puede recibir, porque no le ve, ni le conoce;<br>
<br>
Pero vosotros le conocéis, porque mora con vosotros,<br>
y estará en vosotros.<br>
<br>
Mas el Consolador, el Espíritu Santo, a quien<br>
el Padre enviará en mi nombre, él os enseñará<br>
todas las cosas.<br>
<br>
Cuando venga el Consolador, a quien yo os enviaré<br>
del Padre, el Espíritu de verdad, el cual procede del<br>
Padre, él dará testimonio acerca de mí.<br>
<br>
Y si el Espíritu de aquel que levantó de los<br>
muertos a Jesús mora en vosotros,<br>
<br>
El que levantó de los muertos a Cristo Jesús<br>
vivificará también vuestros cuerpos mortales<br>
por su Espíritu que mora en vosotros.<br>
<br>
Porque el Señor es el Espíritu; y donde está el<br>
Espíritu del Señor, allí hay libertad.<br>
<br>
Por tanto, nosotros todos, mirando a cara descubierta<br>
como en un espejo la gloria del Señor,<br>
<br>
Somos transformados de gloria en gloria en la<br>
misma imagen, como por el Espíritu del Señor.
</div>
`,

256: `
<div class="titulo">
<span class="numero">256</span>
<b>Andad en el Espíritu</b>
</div>

<div class="estrofa">
Mirad, pues, con cuidado, cómo os<br>
comportáis; no como imprudentes<br>
sino como prudentes.<br>
<br>
Andad en el Espíritu, y así<br>
jamás satisfaréis los malos<br>
deseos de la carne.<br>
<br>
¿O no sabéis que vuestro cuerpo<br>
es templo del Espíritu Santo, que<br>
mora en vosotros, el cual tenéis de<br>
Dios, y que no sois vuestros?<br>
<br>
Pues habéis sido comprados<br>
por precio. Por tanto, glorificad<br>
a Dios en vuestro cuerpo.
</div>
`,

257: `
<div class="titulo">
<span class="numero">257</span>
<b>Espíritu de Cristo</b>
</div>

<div class="versiculo">
Orando...con toda oración y súplica en el Espíritu. Efesios 6:18
</div>

<div class="notas">Mi♭ (Capo 1 - Re) — Con devoción</div>

<div class="estrofa">
1. Espíritu de Cristo,<br>
Lléname de tu amor,<br>
Para que en mí se refleje<br>
La imagen del Salvador.
</div>

<div class="coro" style="font-style: italic;">
Llena, llena,<br>
lléname de tu amor;<br>
Entrego a ti mi vida<br>
para servirte, Señor.
</div>

<div class="estrofa">
2. Espíritu de Cristo,<br>
Lléname de tu poder,<br>
Para que anuncie valiente<br>
La salvación por doquier.
</div>

<div class="coro" style="font-style: italic;">
Llena, llena,<br>
lléname de tu amor;<br>
Entrego a ti mi vida<br>
para servirte, Señor.
</div>

<div class="estrofa">
3. Espíritu de Cristo,<br>
Lléname de santo ardor,<br>
Para que haga fielmente<br>
La obra de mi Señor.
</div>

<div class="coro" style="font-style: italic;">
Llena, llena,<br>
lléname de tu amor;<br>
Entrego a ti mi vida<br>
para servirte, Señor.
</div>
`,

258: `
<div class="titulo">
<span class="numero">258</span>
<b>Santo Consolador</b>
</div>

<div class="versiculo">
El ocuparse del Espíritu es vida y paz. Romanos 8:6
</div>

<div class="notas">Fa (Capo 1 - Mi) — Con reflexión</div>

<div class="estrofa">
1. Santo Consolador, aviva tú mi ser;<br>
Que lo que amas pueda amar,<br>
Y tu voluntad hacer.
</div>

<div class="estrofa">
2. Santo Consolador, puro quisiera ser,<br>
Servirte siempre con fervor,<br>
Y la tentación vencer.
</div>

<div class="estrofa">
3. Santo Consolador,<br>
dame tu santa unción;<br>
Mantén el fuego de tu amor<br>
Ardiendo en mi corazón.
</div>

<div class="estrofa">
4. Santo Consolador,<br>
lléname de virtud;<br>
Vida del cielo gozaré<br>
Andando en tu plenitud.
</div>
`,

259: `
<div class="titulo">
<span class="numero">259</span>
<b>Espíritu del Trino Dios</b>
</div>

<div class="versiculo">
Esto tocó tus labios, y es quitada tu culpa, y limpio tu pecado. Isaías 6:7
</div>

<div class="notas">Fa (Capo 1 - Mi) — Con solemnidad</div>

<div class="estrofa">
1. Espíritu del Trino Dios,<br>
llena mi ser;<br>
Espíritu del Trino Dios,<br>
llena mi ser.
</div>

<div class="estrofa">
Quebrántame, consúmeme,<br>
Transfórmame y úsame,<br>
Espíritu del Trino Dios,<br>
llena mi ser.
</div>
`,

260: `
<div class="titulo">
<span class="numero">260</span>
<b>Transfórmame, Espíritu</b>
</div>

<div class="versiculo">
Somos transformados... por el Espíritu del Señor. 2 Corintios 3:18
</div>

<div class="notas">Si♭ (Capo 1 - La) — Con reverencia</div>

<div class="estrofa">
1. Transfórmame, Espíritu de Dios;<br>
líbrame de la ambición carnal;<br>
Renueva tú mi débil corazón,<br>
y haz que te ame como debo amar.
</div>

<div class="estrofa">
2. No pido sueños, celestial visión,<br>
Ni roto el velo del misterio ver,<br>
ni querubines, ni eternal mansión;<br>
Sólo que limpies, oh Señor, mi ser.
</div>

<div class="estrofa">
3. Hazme sensible a tu dirección;<br>
quiero vencer el mal con decisión;<br>
Calla la duda, la murmuración;<br>
dame constancia en la oración.
</div>

<div class="estrofa">
4. Quiero amarte, oh Señor, mi Dios;<br>
mi mente, alma y corazón te doy;<br>
Veo la cruz do Cristo padeció,<br>
y me consagro a tu servicio hoy.
</div>
`,
261: `
<div class="titulo">
<span class="numero">261</span>
<b>Guiados por el Espíritu</b>
</div>

<div class="estrofa">
Pero cuando venga el Espíritu de verdad,<br>
él os guiará a toda la verdad;<br>
<br>
El me glorificará; porque tomará<br>
de lo mío, y os lo hará saber.<br>
<br>
Porque todos los que son guiados por el<br>
Espíritu de Dios, éstos son hijos de Dios.<br>
<br>
Pues no habéis recibido el espíritu de<br>
esclavitud para estar otra vez en temor,<br>
<br>
Sino que habéis recibido el espíritu de<br>
adopción, por el cual clamamos: ¡Abba, Padre!<br>
<br>
El Espíritu mismo da testimonio nuestro<br>
espíritu, de que somos hijos de Dios.<br>
<br>
Pero si sois guiados por el Espíritu, no estáis<br>
bajo la ley.<br>
<br>
Mas el fruto del Espíritu es amor, gozo,<br>
paz, paciencia, benignidad, bondad, fe,<br>
<br>
Mansedumbre, templanza; contra tales cosas no hay ley.<br>
<br>
Si vivimos por el Espíritu, andemos<br>
también por el Espíritu.
</div>
`,
262: `
<div class="titulo">
<span class="numero">262</span>
<b>Divino Espíritu de Dios</b>
</div>

<div class="versiculo">
Si vivimos por el Espíritu, andemos también por el Espíritu. Gálatas 5:25
</div>

<div class="notas">Fa (Capo 1 - Mi) — Con amplitud</div>

<div class="estrofa">
1. Divino Espíritu de Dios,<br>
enviado por Jesús,<br>
Del bien condúcenos en pos<br>
y alúmbrenos tu luz.
</div>

<div class="estrofa">
2. Haz comprender al corazón<br>
cuán grave es su maldad,<br>
Y danos el precioso don<br>
de andar en santidad.
</div>

<div class="estrofa">
3. Venza la fuerza de tu luz<br>
al fiero tentador<br>
Por Cristo, quien muriendo en cruz<br>
nuestro dolor sufrió.
</div>

<div class="estrofa">
4. Sé nuestro guía al transitar<br>
La senda que él trazó;<br>
Danos poder para triunfar,<br>
Siguiendo de él en pos.
</div>
`,
263: `
<div class="titulo">
<span class="numero">263</span>
<b>Santo Espíritu, controla</b>
</div>

<div class="versiculo">
Mirad... cómo andéis, no como necios sino como sabios. Efesios 5:15
</div>

<div class="notas">Fa (Capo 1 - Mi) — Con emoción</div>

<div class="estrofa">
1. Santo Espíritu, controla mi errante corazón;<br>
Llena hoy de tu presencia<br>
esta humilde habitación.
</div>

<div class="coro" style="font-style: italic;">
Llena hoy, llena hoy,<br>
lléname con tu poder;<br>
Tu amor y tu presencia<br>
llenen hoy mi humilde ser.
</div>

<div class="estrofa">
2. Débil soy, oh sí, muy débil;<br>
a tus pies postrado estoy,<br>
Esperando que tu gracia con poder me llene hoy.
</div>

<div class="coro" style="font-style: italic;">
Llena hoy, llena hoy,<br>
lléname con tu poder;<br>
Tu amor y tu presencia<br>
llenen hoy mi humilde ser.
</div>

<div class="estrofa">
3. Santo Espíritu, tú eres ese prometido don;<br>
Quiero siempre obedecerte y gozar tu bendición.
</div>

<div class="coro" style="font-style: italic;">
Llena hoy, llena hoy,<br>
lléname con tu poder;<br>
Tu amor y tu presencia<br>
llenen hoy mi humilde ser.
</div>

<div class="estrofa">
4. Oh, ayúdame, te pido, a vivir en santidad;<br>
Guíame en tus caminos,<br>
haz en mí tu voluntad.
</div>

<div class="coro" style="font-style: italic;">
Llena hoy, llena hoy,<br>
lléname con tu poder;<br>
Tu amor y tu presencia<br>
llenen hoy mi humilde ser.
</div>
`,
264: `
<div class="titulo">
<span class="numero">264</span>
<b>Oh, divino Espíritu</b>
</div>

<div class="versiculo">
Mi Espíritu estará en medio de vosotros, no temáis. Hageo 2:5
</div>

<div class="notas">Mi♭ (Capo 1 - Re) — Con sinceridad</div>

<div class="estrofa">
1. Oh, divino Espíritu,<br>
templo puro quiero ser;<br>
Guía todo mi andar,<br>
para no caer.
</div>

<div class="estrofa">
2. Oh, divino Espíritu,<br>
comprensión tú me darás;<br>
Los mandatos de mi Dios<br>
clarificarás.
</div>

<div class="estrofa">
3. Oh, divino Espíritu,<br>
don de ti yo recibí;<br>
Usame con tu poder,<br>
¡Gloria sea a ti!
</div>
`,
265: `
<div class="titulo">
<span class="numero">265</span>
<b>El fruto del Espíritu</b>
</div>

<div class="versiculo">
El fruto... es amor, gozo, paz,... contra tales cosas no hay ley. Gálatas 5:22-23
</div>

<div class="notas">Sol — Con certidumbre</div>

<div class="estrofa">
1. El fruto del Espíritu<br>
es amor, gozo y paz;<br>
El fruto es paciencia,<br>
benignidad, bondad y fe;<br>
El fruto del Espíritu<br>
es mansedumbre y templanza;<br>
Vivamos por el Espíritu,<br>
y andemos siempre en él.
</div>

<div class="estrofa">
Vivamos por el Espíritu,<br>
y andemos siempre en él.
</div>
`,
266: `
<div class="titulo">
<span class="numero">266</span>
<b>Satúrame, Señor</b>
</div>

<div class="versiculo">
Andad en el Espíritu. Gálatas 5:16
</div>

<div class="notas">Mi m — Con intensidad</div>

<div class="estrofa">
1. Satúrame, Señor, con tu Espíritu;<br>
Satúrame, Señor, con tu Espíritu,<br>
// Y déjame sentir el fuego de tu amor<br>
Aquí en mi corazón, oh Dios. //
</div>

<div class="estrofa">
2. Bendíceme, Señor, con tu Espíritu;<br>
Bendíceme, Señor, con tu Espíritu,<br>
// Y déjame sentir el gozo de tu amor<br>
Momento tras momento, oh Dios. //
</div>

<div class="estrofa">
3. Envíame, Señor, con tu Espíritu;<br>
Envíame, Señor, con tu Espíritu,<br>

`,
267: `
<div class="titulo">
<span class="numero">267</span>
<b>Abre mis ojos</b>
</div>

<div class="versiculo">
El espíritu de verdad, él os guiará a toda la verdad. Juan 16:13
</div>

<div class="notas">Sol — Con entrega</div>

<div class="estrofa">
1. Abre mis ojos a la luz; tu rostro quiero ver, Jesús;<br>
Pon en mi corazón tu bondad y dame paz y santidad.<br>
Humildemente acudo a ti, porque tu tierna voz oí;<br>
Mi guía sé, Espíritu Consolador.
</div>

<div class="estrofa">
2. Abre mi oído a tu verdad; Yo quiero oír con claridad<br>
Bellas palabras de dulce amor,<br>
¡Oh mi bendito Salvador! Consagro a ti mi frágil ser;<br>
Tu voluntad yo quiero hacer.<br>
Llena mi ser, Espíritu Consolador.
</div>

<div class="estrofa">
3. Abre mis labios para hablar,<br>
Y a todo el mundo proclamar<br>
Que tú viniste a rescatar al más perdido pecador.<br>
La mies es mucha, ¡Oh, Señor! Obreros faltan de valor;<br>
Heme aquí, Espíritu Consolador.
</div>

<div class="estrofa">
4. Abre mi mente para ver<br>
Más de tu amor y gran poder;<br>
Dame tu gracia para triunfar,<br>
y hazme en la lucha vencedor.<br>
Sé tú mi escondedero fiel, y aumenta mi valor y fe;<br>
Mi mano ten, Espíritu Consolador.
</div>
`,
268: `
<div class="titulo">
<span class="numero">268</span>
<b>Lámpara es tu Palabra</b>
</div>

<div class="versiculo">
Lámpara es a mis pies tu palabra y lumbrera a mi camino. Salmo 119:105
</div>

<div class="notas">Do — Con sencillez</div>

<div class="estrofa">
1. Lámpara es a mis pies tu palabra,<br>
Lámpara es a mis pies tu palabra,<br>
Lámpara es a mis pies tu palabra,<br>
Y lumbrera a mi camino.
</div>

<div class="estrofa">
2. La exposición de tus dichos alumbra,<br>
La exposición de tus dichos alumbra,<br>
La exposición de tus dichos alumbra,<br>
Y hace entender a los simples.
</div>

<div class="estrofa">
3. Y para siempre, oh *Señor, permanece,<br>
Y para siempre, oh *Señor, permanece,<br>
Y para siempre, oh *Señor, permanece<br>
Tu palabra en los cielos.
</div>

<div class="nota-extra">
*opt. Jehová
</div>
`,
269: `
<div class="titulo">
<span class="numero">269</span>
<b>Tu Palabra me habla</b>
</div>

<div class="estrofa">
Bendito tú, oh SEÑOR; enséñame tus estatutos.
</div>

<div class="estrofa">
Me he gozado en el camino de tus testimonios,<br>
más que en todas las riquezas.
</div>

<div class="estrofa">
Me deleitaré en tus estatutos,<br>
y no olvidaré tu palabra.
</div>

<div class="estrofa">
Abre mis ojos, para que vea las maravillas de tu ley.
</div>

<div class="estrofa">
Hazme entender el camino de tus preceptos,<br>
y meditaré en tus maravillas.
</div>

<div class="estrofa">
¡Cuánto amo tu ley! Todo el día es ella mi meditación.
</div>

<div class="estrofa">
Escrito está: “No sólo de pan vivirá el hombre,<br>
sino de toda palabra que sale de la boca de Dios”.
</div>

<div class="estrofa">
Toda Escritura es inspirada por Dios y útil para enseñar,<br>
para reprender, para corregir, para instruir en justicia,
</div>

<div class="estrofa">
a fin de que el hombre de Dios sea perfecto,<br>
equipado para toda buena obra.
</div>

<div class="cita">
Salmo 119:12,14,16,18,27,97; Mateo 4:4; 2 Timoteo 3:16-17 (BLA)
</div>
`,270: `
<div class="titulo">
<span class="numero">270</span>
<b>Santa Biblia</b>
</div>

<div class="versiculo">
En mi corazón he guardado tus dichos para no pecar. Salmo 119:11
</div>

<div class="notas">Sol — Con firmeza</div>

<div class="estrofa">
1. Santa Biblia, para mí<br>
eres un tesoro aquí;<br>
Tú contienes con verdad la divina voluntad;<br>
Tú me dices lo que soy,<br>
de quién vine y a quién voy.
</div>

<div class="estrofa">
2. Tú reprendes mi dudar;<br>
tú me exhortas sin cesar;<br>
Eres faro que a mi pie va guiando por la fe<br>
A las fuentes del amor del bendito Salvador.
</div>

<div class="estrofa">
3. Eres infalible voz del Espíritu de Dios,<br>
Que vigor al alma da cuando en aflicción está;<br>
Tú me enseñas a triunfar<br>
de la muerte y el pecar.
</div>

<div class="estrofa">
4. Por tu santa letra sé que con Cristo reinaré;<br>
Yo que tan indigno soy, por tu luz al cielo voy;<br>
¡Santa Biblia! para mí eres un tesoro aquí.
</div>
`,
271: `
<div class="titulo">
<span class="numero">271</span>
<b>Los cielos anuncian tus obras</b>
</div>

<div class="versiculo">
Su eterno poder y deidad se hacen claramente visibles. Romanos 1:20
</div>

<div class="notas">Sol — Con júbilo</div>

<div class="estrofa">
1. Los cielos anuncian tus obras, Señor,<br>
La gloria y potencia de su Creador;<br>
El día y la noche levantan su voz,<br>
Y en toda la tierra alaban a Dios.
</div>

<div class="estrofa">
2. Oh Dios, tu palabra es fiel y veraz;<br>
A los que la guardan da gozo y paz.<br>
Tus leyes perfectas y límpidas son;<br>
Tu sabiduría dan al corazón.
</div>

<div class="estrofa">
3. Tus juicios excelsos son mucho mejor<br>
Que oro o joyas de grande valor;<br>
Aun miel que destila del rico panal<br>
No tiene dulzura que sea igual.
</div>

<div class="estrofa">
4. Que cada palabra que expresa mi voz,<br>
Las meditaciones de mi corazón,<br>
A ti sean gratas, te imploro, Señor,<br>
Mi Roca eterna y mi Redentor. Amén.
</div>
`,
272: `
<div class="titulo">
<span class="numero">272</span>
<b>Cuán firme cimiento</b>
</div>

<div class="versiculo">
El fundamento de Dios está firme. 2 Timoteo 2:19
</div>

<div class="notas">Sol — Con firmeza</div>

<div class="estrofa">
1. ¡Cuán firme cimiento se ha dado a la fe,<br>
De Dios en su eterna palabra de amor!<br>
¿Qué más él pudiera en su libro añadir,<br>
Si todo a sus hijos lo ha dicho el Señor?
</div>

<div class="estrofa">
2. “No temas por nada, contigo yo soy;<br>
Tu Dios yo soy solo, tu ayuda seré;<br>
Tu fuerza y firmeza en mi diestra estarán,<br>
Y en ella sostén y poder te daré.
</div>

<div class="estrofa">
3. “La llama no puede dañarte jamás,<br>
Si en medio del fuego te ordeno pasar;<br>
El oro de tu alma más puro será,<br>
Pues sólo la escoria se habrá de quemar.
</div>

<div class="estrofa">
4. “No habrán de anegarte las ondas del mar,<br>
Si en aguas profundas te ordeno salir;<br>
Pues siempre contigo en angustia estaré,<br>
Y todas tus penas podré reducir.
</div>

<div class="estrofa">
5. “Al alma que anhele la paz que hay en mí,<br>
Jamás en sus luchas la habré de dejar;<br>
Si todo el infierno la quiere perder,<br>
¡Yo nunca, no nunca, la puedo olvidar!”
</div>
`,
273: `

grandes, grandes, fieles son,)<br>

grandes, grandes, fieles son,)<br>

Paz eterna mi alma gozará.

<div class="coro">
Grandes, fieles,<br>
(Grandes, grandes, fieles son,<br>
grandes, grandes, fieles son,)<br>
Las promesas que el Señor Jesús ha dado;<br><br>

Grandes, fieles,<br>
(Grandes, grandes, fieles son,<br>
grandes, grandes, fieles son,)<br>
En ellas para siempre confiaré.
</div>

<div class="estrofa">
3. Todas las promesas del Señor serán<br>
Gozo y fuerza en nuestra vida terrenal;<br>
Ellas en la dura lid nos sostendrán,<br>
Y triunfar podremos sobre el mal.
</div>

<div class="coro">
Grandes, fieles,<br>
(Grandes, grandes, fieles son,<br>
grandes, grandes, fieles son,)<br>
Las promesas que el Señor Jesús ha dado;<br><br>

Grandes, fieles,<br>
(Grandes, grandes, fieles son,<br>
grandes, grandes, fieles son,)<br>
En ellas para siempre confiaré.
</div>
`,
274: `
<div class="titulo">
<span class="numero">274</span>
<b>Dame de vida el pan</b>
</div>

<div class="versiculo">
La palabra de Dios... vive y permanece para siempre. 1 Pedro 1:23
</div>

<div class="notas">Mi♭ (Capo 1 - Re) — Con reflexión</div>

<div class="estrofa">
1. Dame, mi buen Señor, de vida el pan,<br>
Como lo hiciste un día junto al mar;<br>
Mi alma te busca a ti, Verbo de Dios,<br>
Y en tu Palabra espero oír tu voz.
</div>

<div class="estrofa">
2. “El pan de vida soy”, dice el Señor;<br>
Ven, alma hambrienta hoy al Salvador.<br>
“Hambre jamás tendrá quien viene a mí;<br>
Sed nunca más tendrá quien cree en mí”.
</div>

<div class="estrofa">
3. Bendice, oh Salvador, hoy tu verdad,<br>
Cual bendijiste ayer el fresco pan;<br>

276: `

277: `

278: `
<div class="titulo">
<span class="numero">278</span>
<b>Gracias damos por la Biblia</b>
</div>

<div class="estrofa">
1. Gracias damos por la Biblia,<br>
Tu Palabra es, Señor; inspiraste al salmista,<br>
Y al santo historiador. El profeta y el apóstol,<br>
Desde la antigüedad, por tu Espíritu guiados,<br>
Nos legaron tu verdad.
</div>

<div class="estrofa">
2. Gracias damos por la Biblia,<br>
Y por esa multitud de escribas abnegados,<br>
Que con gran exactitud a través de muchos siglos,<br>
Aun en gran persecución, cada letra preservaron,<br>
Para nuestra bendición.
</div>

<div class="estrofa">
3. Gracias damos por la Biblia,<br>
Y por cada traductor que la ha hecho entendible<br>
Al oyente y lector. Y por los que la publican,<br>
Y el ejército mundial que trabaja esparciendo<br>
Tu Palabra eternal.
</div>

<div class="estrofa">
4. Gracias damos por la Biblia,<br>
Tu Palabra es, Señor; la tenemos al alcance,<br>
Tu mensaje de amor. Oh ayúdanos, pedimos,<br>
A leerla con afán, y a cumplirla diariamente;<br>
Sus preceptos vida dan.
</div>
`,
279: `
<div class="titulo">
<span class="numero">279</span>
<b>Proclamemos la Palabra</b>
</div>

<div class="estrofa">
Si alguien habla, hable conforme a las palabras de Dios.
</div>

<div class="estrofa">
Predica la palabra; mantente dispuesto<br>
a tiempo y fuera de tiempo; convence,<br>
reprende y exhorta con toda paciencia<br>
y enseñanza.
</div>

<div class="estrofa">
Porque la Palabra de Dios es viva y eficaz,<br>
y más penetrante que toda espada de dos filos.
</div>

<div class="estrofa">
Penetra hasta partir el alma y el espíritu,<br>
las coyunturas y los tuétanos,<br>
y discierne los pensamientos<br>
y las intenciones del corazón.
</div>

<div class="estrofa">
Por esto, la fe es por el oír,<br>
y el oír por la palabra de Cristo.<br>
Pues lo que fue escrito anteriormente<br>
fue escrito para nuestra enseñanza,<br>
a fin de que por la perseverancia<br>
y la exhortación de las Escrituras<br>
tengamos esperanza.
</div>

<div class="estrofa">
¡Cuán hermosos son los pies<br>
de los que anuncian el evangelio<br>
de las cosas buenas!
</div>
`,

284: `
<div class="titulo">

285: `
<div class="titulo">
<span class="numero">285</span>
<b>REFLEXIÓN: Mi Biblia, la Palabra de Dios</b>
</div>

<div class="estrofa">
Te doy gracias, Señor, por tu Palabra, la Santa Biblia. Me deleita leerla, porque por medio de ella te has dado a conocer y me has mostrado el camino de la salvación.
</div>

<div class="estrofa">
Tu Palabra me es más preciosa que el oro. Es lámpara que ilumina mi senda y pan que alimenta mi alma; es agua que refresca y purifica mi espíritu. Es espejo que me muestra cómo soy y espada en mis luchas contra Satanás.
</div>

<div class="estrofa">
La Biblia proviene de ti y por lo tanto refleja lo que tú eres. Ella es absolutamente confiable, porque eres fiel y no puedes mentir. Permanece para siempre, porque tú existes eternamente.
</div>

<div class="estrofa">
Las Escrituras me instruyen en tu voluntad y me capacitan para servirte. En ellas escucho tu voz y al meditar en su mensaje encuentro consuelo y paz.
</div>

<div class="estrofa">
Con el salmista exclamo, "¡Oh, cuánto amo yo tu ley!". Tus enseñanzas son el tema de mi cántico. Impulsado por tu Palabra, elevo mi voz con notas de loor a ti.
</div>
`,
286: `

292: `

306: `
<div class="titulo">

</div>

</div>

<div class="estrofa">
1. Pero vuestras iniquidades han hecho división entre vosotros y vuestro Dios. Isaías 59:2.
</div>

<div class="estrofa">
2. La paga del pecado es muerte. Romanos 6:23.
</div>

<div class="estrofa">
3. Mas Dios muestra su amor para con nosotros, en que siendo aún pecadores, Cristo murió por nosotros. Romanos 5:8.
</div>

<div class="estrofa">
4. Cree en el Señor Jesucristo y serás salvo. Hechos 16:31.
</div>

<div class="estrofa">
5. Porque por gracia sois salvos por medio de la fe; y esto no de vosotros, pues es don de Dios; no por obras, para que nadie se gloríe. Efesios 2:8-9.
</div>

<div class="estrofa">
6. Porque cuando éramos enemigos, fuimos reconciliados con Dios por la muerte de su Hijo. Romanos 5:10.
</div>

<div class="estrofa">
7. El que cree en el Hijo tiene vida eterna. Juan 3:36.
</div>
`,

308: `

</div>

<div class="estrofa">
<span class="num-estrofa">2.</span> Tal como soy, buscando paz<br>

Cordero de Dios, heme aquí.
</div>

<div class="estrofa">
<span class="num-estrofa">3.</span> Tal como soy, me acogerás;<br>
Perdón, alivio me darás,<br>
Pues tu promesa ya creí;<br>
Cordero de Dios, heme aquí.
</div>

<div class="estrofa">
<span class="num-estrofa">4.</span> Tal como soy, tu compasión<br>

Cordero de Dios, heme aquí.
</div>
`,

309: `

<span class="num-estrofa">1.</span> Vagué sediento en el pecado abrumador,<br>

<div class="coro" style="font-style: italic;">

<span class="num-estrofa">2.</span> ¡Oh cuán dulce raudal de Dios brotando está!<br>

<div class="coro" style="font-style: italic;">
<span class="coro-label">Coro:</span> Toma de la fuente de agua viva,<br>

fuente de agua viva celestial.
</div>

`,

312: `

315: `
<div class="titulo">
<span class="numero">315</span>
<b>Visión Pastoral</b>
</div>

<div class="versiculo">
¿No deja las noventa y nueve y va por los montes a buscar? Mateo 18:12
</div>

<div class="notas">Mi b (Capo 1 - Re) — Con sentimiento</div>

<div class="estrofa">
<span class="num-estrofa">1.</span> Eran cien ovejas las de su rebaño;<br>
Eran cien ovejas que amante cuidó,<br>
Pero una tarde al contarlas todas,<br>
Le faltaba una, le faltaba una y triste lloró.<br>
Las noventa y nueve dejó en el aprisco,<br>
Y por la montaña a buscarla fue;<br>
La encontró llorando, temblando de frío;<br>
Ungió sus heridas, la cargó en sus hombros<br>
y al redil volvió.
</div>

<div class="estrofa">
<span class="num-estrofa">2.</span> Esta antigua historia vuelve a repetirse;<br>
Hay aún ovejas que errabundas van;<br>
Con el alma rota van por los collados,<br>
Temblando de frío, vagando en el mundo,<br>
sin Dios y sin luz. Pero todavía<br>
existen pastores que por la montaña<br>
a buscarlas van,<br>
Y cuando las hallan, las traen al camino,<br>
Al camino bueno, la verdad y vida<br>
que es Cristo el Señor.
</div>

<div class="estrofa">
<span class="num-estrofa">3.</span> Si tú eres un alma que sufre angustia<br>
De sentirse sola en cruel lobreguez,<br>
Hoy te traigo nuevas, nuevas de gran gozo;<br>
Es el evangelio que salva y redime<br>
y te da la luz.<br>
Sea en la montaña o en la cumbre agreste,<br>
Ya fuera en el valle o en abismo cruel,<br>
Cristo el buen Pastor quiere en pastos verdes<br>
Confortar tu alma, vendar tus heridas<br>
y darte la paz.
</div>
`,

316: `

317: `
<div class="titulo">
<span class="numero">317</span>

<span class="num-estrofa">1.</span> Oh Señor, recíbeme cual soy,<br>
ya no más, ya no quiero pecar.<br>

`,

318: `

`,

319: `
<div class="titulo">
<span class="numero">319</span>
<b>El agua viva</b>
</div>

<div class="versiculo">
Juan 4:7-10, 13-15, 41-42 (RVR)
</div>

<div class="estrofa">
Vino una mujer de Samaria a sacar agua;<br>
y Jesús le dijo: Dame de beber. Pues sus discípulos<br>
habían ido a la ciudad a comprar de comer.
</div>

<div class="estrofa">
La mujer samaritana le dijo: ¿Cómo tú,<br>
siendo judío, me pides a mí de beber,<br>
que soy mujer samaritana? Porque<br>
judíos y samaritanos no se tratan entre sí.
</div>

<div class="estrofa">
Respondió Jesús y le dijo: Si conocieras el don<br>
de Dios, y quién es el que te dice: Dame de<br>
beber, tú le pedirías, y él te daría agua viva.
</div>

<div class="estrofa">
Cualquiera que bebiere de esta agua,<br>
volverá a tener sed; mas el que bebiere<br>
del agua que yo le daré, no tendrá sed<br>
jamás; sino que el agua que yo le daré<br>
será en él una fuente de agua que salte<br>
para vida eterna.
</div>

<div class="estrofa">
La mujer le dijo: Señor, dame esa agua, para<br>
que no tenga yo sed, ni venga aquí a sacarla.
</div>

<div class="estrofa">
Y creyeron muchos más por la palabra de<br>
él, y decían a la mujer:
</div>

<div class="estrofa">
Ya no creemos solamente por tu dicho, porque<br>
nosotros mismos hemos oído, y sabemos que<br>
verdaderamente éste es el Salvador del mundo,<br>
el Cristo.
</div>
`,

320: `
<div class="titulo">
<span class="numero">320</span>
<b>Cual la mar hermosa</b>
</div>

<div class="estrofa">
<span class="num-estrofa">1.</span> Cual la mar hermosa es la paz de Dios,<br>
fuerte y gloriosa, es eterna paz,<br>
grande y perfecta, premio de la cruz,<br>
fruto del Calvario, obra de Jesús.
</div>

<div class="coro" style="font-style: italic;">
<span class="coro-label">Coro:</span> Descansando en Cristo<br>
siempre paz tendré;<br>
en Jehová confiando, nada temeré.
</div>

<div class="estrofa">
<span class="num-estrofa">2.</span> En el gran refugio de la paz de Dios,<br>
Nunca hay molestias, es perfecta paz;<br>
Nunca negra duda, pena ni pesar,<br>
Vejaciones crueles, pueden acosar.
</div>

<div class="coro" style="font-style: italic;">
<span class="coro-label">Coro:</span> Descansando en Cristo<br>
siempre paz tendré;<br>
en Jehová confiando, nada temeré.
</div>

<div class="estrofa">
<span class="num-estrofa">3.</span> Toda nuestra vida cuidará Jesús;<br>
Cristo nunca cambia, él es nuestra paz;<br>
Fuertes y seguros en el Salvador,<br>
siempre moraremos en su grande amor.
</div>

<div class="coro" style="font-style: italic;">
<span class="coro-label">Coro:</span> Descansando en Cristo<br>
siempre paz tendré;<br>
en Jehová confiando, nada temeré.
</div>

<div class="estrofa">
<span class="num-estrofa">4.</span> Oh Señor amado, tú nos das quietud,<br>
de ti recibimos celestial salud;<br>
haznos conocerte, te amaremos más;<br>
sé tú nuestro dueño, Príncipe de paz.
</div>

<div class="coro" style="font-style: italic;">
<span class="coro-label">Coro:</span> Descansando en Cristo<br>
siempre paz tendré;<br>
en Jehová confiando, nada temeré.
</div>
`,

321: `
<div class="titulo">
<span class="numero">321</span>
<b>Paz con Dios</b>
</div>

<div class="versiculo">
La paz os dejo, mi paz os doy... no se turbe vuestro corazón. Juan 14:27
</div>

<div class="notas">Do — Con serenidad</div>

<div class="estrofa">
<span class="num-estrofa">1.</span> Paz con Dios, busqué ganarla<br>
con febril solicitud,<br>
Mas mis obras meritorias no me dieron la salud.
</div>

<div class="coro" style="font-style: italic;">
<span class="coro-label">Coro:</span> ¡Oh, qué paz Jesús me da!<br>
Paz que antes ignoré;<br>
Todo nuevo se tornó, desde que su paz hallé.
</div>

<div class="estrofa">
<span class="num-estrofa">2.</span> Lleno estaba yo de dudas,<br>
temeroso de morir,<br>
Hoy en paz, mañana triste con temor del porvenir.
</div>

<div class="coro" style="font-style: italic;">
<span class="coro-label">Coro:</span> ¡Oh, qué paz Jesús me da!<br>
Paz que antes ignoré;<br>
Todo nuevo se tornó, desde que su paz hallé.
</div>

<div class="estrofa">
<span class="num-estrofa">3.</span> Al final en desespero,<br>
"Ya no puedo", dije yo;<br>
Y del cielo oí respuesta, "Todo hecho ya quedó".
</div>

<div class="coro" style="font-style: italic;">
<span class="coro-label">Coro:</span> ¡Oh, qué paz Jesús me da!<br>
Paz que antes ignoré;<br>
Todo nuevo se tornó, desde que su paz hallé.
</div>

<div class="estrofa">
<span class="num-estrofa">4.</span> De mis obras despojado, vi la obra de Jesús;<br>
Supe que la paz fue hecha<br>
por su sangre en la cruz.
</div>

<div class="coro" style="font-style: italic;">
<span class="coro-label">Coro:</span> ¡Oh, qué paz Jesús me da!<br>
Paz que antes ignoré;<br>
Todo nuevo se tornó, desde que su paz hallé.
</div>
`,

322: `
<div class="titulo">
<span class="numero">322</span>
<b>Años mi alma en vanidad vivió</b>
</div>

<div class="versiculo">
Anunciamos que de estas vanidades os convertiréis al Dios vivo. Hechos 14:15
</div>

<div class="notas">Do — Con ánimo</div>

<div class="estrofa">
<span class="num-estrofa">1.</span> Años mi alma en vanidad vivió,<br>
Ignorando a quien por mí sufrió<br>
Y que en el Calvario sucumbió el Salvador.
</div>

<div class="coro" style="font-style: italic;">
<span class="coro-label">Coro:</span> Mi alma allí divina gracia halló;<br>
Dios allí perdón y paz me dio;<br>
Del pecado allí me libertó el Salvador.
</div>

<div class="estrofa">
<span class="num-estrofa">2.</span> Por la Biblia miro que pequé,<br>
Y su ley divina quebranté;<br>
Mi alma entonces contempló con fe<br>
al Salvador.
</div>

<div class="coro" style="font-style: italic;">
<span class="coro-label">Coro:</span> Mi alma allí divina gracia halló;<br>
Dios allí perdón y paz me dio;<br>
Del pecado allí me libertó el Salvador.
</div>

<div class="estrofa">
<span class="num-estrofa">3.</span> Toda mi alma a Cristo ya entregué;<br>
Hoy le quiero y sirvo como a Rey;<br>
Por los siglos siempre cantaré al Salvador.
</div>

<div class="coro" style="font-style: italic;">
<span class="coro-label">Coro:</span> Mi alma allí divina gracia halló;<br>
Dios allí perdón y paz me dio;<br>
Del pecado allí me libertó el Salvador.
</div>

<div class="estrofa">
<span class="num-estrofa">4.</span> En la cruz su amor Dios demostró,<br>
Y de gracia al hombre revistió<br>
Cuando por nosotros se entregó el Salvador.
</div>

<div class="coro" style="font-style: italic;">
<span class="coro-label">Coro:</span> Mi alma allí divina gracia halló;<br>
Dios allí perdón y paz me dio;<br>
Del pecado allí me libertó el Salvador.
</div>

323: `

<b>Lejos de mi Padre Dios</b>
</div>

</div>

En Jesús, mi Señor,<br>

por su gracia tierna.

vivo cada día;<br>

halla el alma mía.

<div class="coro" style="font-style: italic;">
En Jesús, mi Señor,<br>

324: `
<div class="titulo">
<span class="numero">324</span>
<b>Jamás, Jamás</b>
</div>

<div class="versiculo">
Vuestros pecados os han sido perdonados. 1 Juan 2:12
</div>

<div class="notas">Si♭ (Capo 1 - La) — Con certidumbre</div>

<div class="estrofa">
Jamás, jamás<br>
mis pecados contará;<br>
Perdonados por siempre,<br>
y ante mi mente<br>
Nunca más los ha de mencionar.
</div>

<div class="estrofa">
Jamás oiré<br>
de los días de maldad;<br>
Cristo me ha redimido<br>
Y ha dado al olvido mi pecar.
</div>
`,
325: `
<div class="titulo">
<span class="numero">325</span>
<b>En el monte Calvario</b>
</div>

<div class="estrofa">
1 En el monte Calvario se vio una cruz,<br>
Emblema de afrenta y dolor.<br>
Y yo aprecio esa cruz, do murió mi Jesús<br>
Por salvar al más vil pecador.
</div>

<div class="coro" style="font-style: italic;">
¡Cuánto estimo la cruz de Jesús!<br>
En sus triunfos mi gloria será.<br>
Y algún día en vez de una cruz,<br>
mi corona Jesús me dará.
</div>

<div class="estrofa">
2 En la cruz do su sangre Jesús derramó,<br>
Hermosura contemplo en visión,<br>
Pues en ella el Cordero inmolado murió<br>
Para darme pureza y perdón.
</div>

<div class="coro" style="font-style: italic;">
¡Cuánto estimo la cruz de Jesús!<br>
En sus triunfos mi gloria será.<br>
Y algún día en vez de una cruz,<br>
mi corona Jesús me dará.
</div>

<div class="estrofa">
3 Seguiré a Jesús, tomaré hoy mi cruz,<br>
Los desprecios con él sufriré;<br>
Y algún día feliz, con los santos en luz,<br>
Para siempre su gloria tendré.
</div>

<div class="coro" style="font-style: italic;">
¡Cuánto estimo la cruz de Jesús!<br>
En sus triunfos mi gloria será.<br>
Y algún día en vez de una cruz,<br>
mi corona Jesús me dará.
</div>

326: `

Haciendo la paz mediante la sangre de su cruz. Colosenses 1:20
</div>

puso en mi alma la hiel del dolor.

327: `
<div class="titulo">
<span class="numero">327</span>
<b>Hallé un buen amigo</b>
</div>

<div class="versiculo">
En todo tiempo ama el amigo, y es como un hermano en tiempo de angustia. Proverbios 17:17
</div>

<div class="notas">Fa (Capo 1 - Mi) — Con ánimo</div>

<div class="estrofa">
1 Hallé un buen amigo, mi amado Salvador;<br>
Contaré lo que ha hecho él por mí;<br>
Hallándome perdido e indigno pecador,<br>
Me salvó y ya me guarda para sí.<br>
Me salva del pecado, me guarda de Satán,<br>
Promete estar conmigo hasta el fin. (¡Aleluya!)<br>
El consuela mi tristeza, me quita todo afán;<br>
<b>¡Grandes cosas Cristo ha hecho para mí!</b>
</div>

<div class="estrofa">
2 Jesús jamás me falta; jamás me dejará;<br>
Es mi fuerte y poderoso Protector.<br>
Del mundo yo me aparto y de la vanidad<br>
Para consagrar mi vida a mi Señor.<br>
Si el mundo me persigue, si sufro tentación,<br>
Confiado en Cristo puedo resistir. (¡Aleluya!)<br>
La victoria me es segura, y elevo mi canción:<br>
<b>¡Grandes cosas Cristo ha hecho para mí!</b>
</div>

<div class="estrofa">
3 Yo sé que Jesucristo muy pronto volverá,<br>
Y entre tanto me prepara un lugar<br>
En casa de su Padre, mansión de luz y paz,<br>
Do el creyente fiel con él ha de morar.<br>
Llegando a la gloria, con él yo estaré;<br>
Contemplaré su rostro siempre allí. (¡Aleluya!)<br>
Con los santos redimidos gozoso cantaré:<br>
<b>¡Grandes cosas Cristo ha hecho para mí!</b>
</div>
`,
328: `
<div class="titulo">
<span class="numero">328</span>
<b>Solamente en Cristo</b>
</div>

<div class="versiculo">
No hay otro nombre bajo el cielo...en que podamos ser salvos. Hechos 4:12
</div>

<div class="notas">Do — Con alegría</div>

<div class="estrofa">
1 Solamente en Cristo,<br>
solamente en él,<br>
La salvación<br>
se encuentra en él.<br>
No hay otro nombre<br>
dado a los hombres;<br>
Solamente en Cristo,<br>
solamente en él.
</div>

<div class="estrofa">
2 En San Juan catorce<br>
y el verso seis,<br>
Dice Jesús, "Soy la verdad,<br>
Soy el camino,<br>
también la vida;<br>
Nadie viene al Padre<br>
sino por mí".
</div>

329: `
<div class="titulo">
<span class="numero">329</span>
<b>Fuente de la vida eterna</b>
</div>

<div class="versiculo">
La bendición de Jehová es la que enriquece. Proverbios 10:22
</div>

<div class="notas">Re — Con confianza</div>

<div class="estrofa">
1 Fuente de la vida eterna<br>
y de toda bendición,<br>
Ensalzar tu gracia tierna debe cada corazón.<br>
Tu piedad inagotable, abundante en perdonar,<br>
Unico Ser adorable, gloria a ti debemos dar.
</div>

<div class="estrofa">
2 De los cánticos celestes<br>
te quisiéramos cantar,<br>
Entonados por las huestes que lograste rescatar.<br>
Almas que a buscar viniste,<br>
porque les tuviste amor;<br>
De ellas te compadeciste con tiernísimo favor.
</div>

<div class="estrofa">
3 Toma nuestros corazones,<br>
llénalos de tu verdad,<br>
De tu Espíritu los dones, y de toda santidad.<br>
Guíanos en obediencia,<br>
humildad y puro amor;<br>
Nos ampare tu presencia, oh bendito Salvador.
</div>
`,
330: `

</div>

</div>

Cristo es la senda que me puede salvar. //
</div>

<div class="estrofa">
2 Las amistades y todos mis parientes<br>
Fueron las gentes que yo relacioné;<br>
// Me aborrecieron por causa de su nombre<br>
Cuando supieron *que a Cristo me entregué. //
</div>

<div class="estrofa">
3 Y aquel camino de tantos sufrimientos,<br>
Aquel camino que el cielo me trazó,<br>

Cuando mi Cristo a mí me rescató;<br>
Fue transformado en aquel feliz momento<br>
Cuando mi Cristo al cielo me llamó.
</div>

335: `
<div class="titulo">
<span class="numero">335</span>
<b>Salvos por gracia</b>
</div>

<div class="estrofa">
Dios, que es rico en misericordia,<br>
por su gran amor con que nos amó,<br>
<br>
Aun estando nosotros muertos en<br>
pecados, nos dio vida juntamente<br>
con Cristo <b>(por gracia sois salvos)</b>,<br>
<br>
En quien tenemos redención por<br>
su sangre, el perdón de pecados<br>
según las riquezas de su gracia,...<br>
no por obras, para que nadie se<br>
gloríe.<br>
<br>
Y en ningún otro hay salvación;<br>
porque no hay otro nombre bajo<br>
el cielo, dado a los hombres, en<br>
que podamos ser salvos.
</div>

<div class="versiculo">
Efesios 2:4, 5; 1:7; 2:9; Hechos 4:12 (RVR)
</div>
`,

343: `

392: `
<div class="titulo">
<span class="numero">392</span>
<b>Comunión con Cristo</b>
</div>

<div class="estrofa">
Lo que hemos visto y oído lo anunciamos<br>
también a vosotros, para que vosotros<br>
también tengáis comunión con nosotros.<br>
<br>
Y nuestra comunión es con el Padre<br>
y con su Hijo Jesucristo.<br>
<br>
Si decimos que tenemos comunión con él<br>
y andamos en tinieblas, mentimos y no<br>
practicamos la verdad.<br>
<br>
Permaneced en él para que, cuando<br>
aparezca, tengamos confianza y no nos<br>
avergoncemos delante de él, en su venida.<br>
<br>
Amados, ahora somos hijos de Dios, y aún<br>
no se ha manifestado lo que seremos.<br>
<br>
Pero sabemos que cuando él sea<br>
manifestado, seremos semejantes a él,<br>
porque le veremos tal como él es.<br>
<br>
Y todo aquel que tiene esta esperanza en él, se<br>
purifica a sí mismo, como él también es puro.<br>
<br>
Ahora vemos oscuramente por medio de un<br>
espejo, pero entonces veremos cara a cara.<br>
<br>
Ahora conozco en parte, pero entonces conoceré<br>
plenamente, así como fui conocido.<br>
<br>
Y ahora permanecen la fe, la esperanza<br>
y el amor, estos tres;<br>
<br>
Pero el mayor de ellos es el amor.<br>
<br>
Fiel es Dios, por medio de quien<br>
fuisteis llamados a la comunión de<br>
su Hijo Jesucristo, nuestro Señor.
</div>

<div class="versiculo">
1 Juan 1:3, 6; 2:28; 3:2, 3; 1 Corintios 13:12, 13; 1:9 (RVA)
</div>

399: `
<div class="titulo">
<span class="numero">399</span>
<b>Un canto de alabanza</b>
</div>

<div class="estrofa">
Al SEÑOR esperé pacientemente, y él se<br>
inclinó a mí y oyó mi clamor.<br>
<br>
Me sacó del hoyo de la destrucción,<br>
del lodo cenagoso; asentó mis pies<br>
sobre roca, y afirmó mis pasos.<br>
<br>
Puso en mi boca un cántico nuevo, un<br>
canto de alabanza a nuestro Dios; muchos<br>
verán esto y temerán, y confiarán en el SEÑOR.<br>
<br>
Cuán bienaventurado es el hombre<br>
que ha puesto en el SEÑOR su confianza,<br>
y no se ha vuelto a los soberbios ni a los<br>
que caen en falsedad.<br>
<br>
Muchas son, SEÑOR, Dios mío, las maravillas<br>
que tú has hecho, y muchos tus designios para<br>
con nosotros;<br>
<br>
Nadie hay que se compare contigo;<br>
si los anunciara, y hablara de ellos, no<br>
podrían ser enumerados.<br>
<br>
Me deleito en hacer tu voluntad, Dios<br>
mío; tu ley está dentro de mi corazón.<br>
<br>
He proclamado buenas nuevas<br>
de justicia en la gran congregación;<br>
<br>
He aquí, no refrenaré mis labios, oh SEÑOR,<br>
tú lo sabes.<br>
<br>
No he escondido tu justicia dentro de mi<br>
corazón; he proclamado tu fidelidad y<br>
tu salvación;<br>
<br>
No he ocultado a la gran congregación tu<br>
misericordia y tu verdad.<br>
<br>
Regocíjense y alégrense en ti todos los<br>
que te buscan; que digan continuamente:<br>
<b>¡Engrandecido sea el SEÑOR! los que aman<br>
tu salvación.</b>
</div>

<div class="versiculo">
Salmo 40:1-5, 8-10, 16 (BLA)
</div>

439: `
<div class="titulo">
<span class="numero">439</span>
<b>En este mundo de misterio</b>
</div>

<div class="estrofa">
Señor, en este mundo de misterio<br>
Cuya causa no podemos conocer,<br>
Vemos la humildad de los pequeños<br>
Y los grandes su gloria enaltecer.<br>
<br>
La viuda que dio lo que tenía,<br>
El joven llevando pan y peces,<br>
El mozo que de cerca lo seguía,<br>
Sin llevar la gloria de sus creces.<br>
<br>
Oh Señor, ¿por qué tanto silencio?<br>
¿Por qué no llevan ninguna gloria?<br>
¿Por qué ni sus nombres aparecen<br>
En el gran escenario de la historia?<br>
<br>
No te afanes por la vida pasajera,<br>
Ni del cruel olvido tengas pena,<br>
Que las glorias de este mundo son ficticias<br>
Y las glorias venideras son eternas.
</div>

445: `
<div class="titulo">
<span class="numero">445</span>
<b>Triunfo en las pruebas</b>
</div>

<div class="versiculo">
Romanos 8:18, 28, 31, 37; 1 Pedro 1:6, 7 (RVR)
</div>

<div class="estrofa">
Pues tengo por cierto que las aflicciones<br>
del tiempo presente no son comparables<br>
con la gloria venidera que en nosotros ha<br>
de manifestarse.<br>
<br>
Y sabemos que a los que aman a Dios,<br>
todas las cosas les ayudan a bien, esto es,<br>
a los que conforme a su propósito son<br>
llamados.<br>
<br>
¿Qué, pues, diremos a esto? Si Dios es por<br>
nosotros, ¿quién contra nosotros?<br>
<br>
Antes, en todas estas cosas somos más<br>
que vencedores por medio de aquel que<br>
nos amó.<br>
<br>
Vosotros os alegráis, aunque ahora por un<br>
poco de tiempo, si es necesario, tengáis que<br>
ser afligidos en diversas pruebas,<br>
<br>
Para que sometida a prueba vuestra fe,<br>
mucho más preciosa que el oro, el cual<br>
aunque perecedero se prueba con fuego,<br>
sea hallada en alabanza, gloria y honra<br>
cuando sea manifestado Jesucristo.
</div>

450: `

</div>

2 De entre todas las naciones escogida en variedad,<br>

`,
451: `

`,
452: `

454: `

455: `

456: `

459: `
<div class="titulo">
<span class="numero">459</span>
<b>REFLEXION: Mi querida iglesia</b>
</div>

<div class="lectura">
Señor, tú me has puesto en una familia muy<br>
especial, donde encuentro el amor y el<br>
apoyo de hermanos. Me has colocado en un<br>
maravilloso cuerpo en el cual cada miembro<br>
contribuye para beneficio de los demás.<br>
<br>
Me has hecho parte de un nuevo pueblo que<br>
traspasa las barreras de raza, cultura y nivel<br>
social. Es tu Iglesia, y ¡cuánto te agradezco<br>
el inmenso privilegio de ser parte de ella!<br>
<br>
Te reconozco como Jefe y Cabeza de la Iglesia.<br>
Sé que te agradamos al reunirnos para<br>
estudiar tu Palabra y alabar tu nombre.<br>
Te honramos al participar de tu mesa.<br>
<br>
La comunión entre nosotros y la demostración<br>
de tu amor en nuestro servicio también<br>
te complacen. Te gozas cuando cumplimos<br>
tu mandato de proclamar el evangelio y<br>
hacer discípulos.<br>
<br>
Espero el día gozoso cuando presentarás a tu<br>
Iglesia perfecta, sin mancha ni arruga.<br>
Mientras tanto, ¡qué hermoso es unir mi voz a<br>
la de mis hermanos en salmos, himnos y<br>
cánticos espirituales!
</div>
`,

462: `
<div class="titulo">
<span class="numero">462</span>
<b>Unidos en Cristo</b>
</div>

<div class="lectura">
Porque de la manera que en un cuerpo<br>
tenemos muchos miembros, pero no todos<br>
los miembros tienen la misma función,<br>
<br>
Así nosotros, siendo muchos, somos un<br>
cuerpo en Cristo, y todos miembros los<br>
unos de los otros.<br>
<br>
De manera que, teniendo diferentes dones,<br>
según la gracia que nos es dada,<br>
<br>
Si el de profecía, úsese conforme a la<br>
medida de la fe;<br>
<br>
O si de servicio, en servir; o el que enseña,<br>
en la enseñanza;<br>
<br>
El que exhorta, en la exhortación; el que<br>
reparte, con liberalidad;<br>
<br>
El que preside, con solicitud; el que hace<br>
misericordia, con alegría.<br>
<br>
El amor sea sin fingimiento. Aborreced lo<br>
malo, seguid lo bueno.<br>
<br>
Amaos los unos a los otros con amor fraternal;<br>
en cuanto a honra, prefiriéndoos los unos a los<br>
otros.<br>
<br>
¡Mirad cuán bueno y cuán delicioso es<br>
habitar los hermanos juntos en armonía!
</div>

<div class="versiculo">
Romanos 12:4-10; Salmo 133:1 (RVR)
</div>
`,

464: `

496: `

`,
510: `
<div class="titulo">
<span class="numero">510</span>
<b>Fiel mayordomo seré</b>
</div>

<div class="versiculo">
Bien, buen siervo...sobre poco has sido fiel, sobre mucho te pondré. Mateo 25:23
</div>

<div class="notas">Re m — Con intensidad</div>

<div class="estrofa">
1 Vengo rendido a tus pies, Señor;<br>
quiero fielmente depositar<br>
Tiempo, dinero, mi don de amor;<br>
ofrenda grata hoy vengo a dar.
</div>

<div class="coro" style="font-style: italic;">
Todo buen don viene de Dios;<br>
¿Cómo negarlo podré?<br>
Fiel mayordomo de Cristo seré,<br>
y un día, "Fiel siervo", oiré.
</div>

2 "Probadme en esto", dice el Señor,<br>
"y bendiciones derramaré".<br>
Fiel a mis votos de fe seré,<br>
testigo digno de mi Señor.
</div>

<div class="coro" style="font-style: italic;">
Todo buen don viene de Dios;<br>
¿Cómo negarlo podré?<br>
Fiel mayordomo de Cristo seré,<br>
y un día, "Fiel siervo", oiré.
</div>

<div class="estrofa">
3 Tú vas conmigo, no dudaré;<br>
en tus promesas yo confiaré.<br>
De lo que es tuyo te daré,<br>
y almas preciosas cosecharé.
</div>

<div class="coro" style="font-style: italic;">
Todo buen don viene de Dios;<br>
¿Cómo negarlo podré?<br>
Fiel mayordomo de Cristo seré,<br>
y un día, "Fiel siervo", oiré.
</div>
`,
511: `

<div class="coro" style="font-style: italic;">
Gozo hay, sí, en servir a Cristo;<br>
gozo en el corazón.<br>
Cada día él da poder, me ayuda a vencer,<br>

`,
512: `
<div class="titulo">
<span class="numero">512</span>
<b>En las aguas de la muerte</b>
</div>

<div class="versiculo">
Bautizándolos en el nombre del Padre, y del Hijo, y del Espíritu Santo. Mateo 28:19
</div>

<div class="notas">Mi♭ (Capo 1 - Re) — Con devoción</div>

<div class="estrofa">
1 En las aguas de la muerte, sumergido<br>
fue Jesús, mas su amor no fue<br>
apagado por sus penas en la cruz.<br>
Levantóse de la tumba, sus cadenas<br>
quebrantó, y triunfante y victorioso<br>
a los cielos ascendió.
</div>

<div class="estrofa">
2 En las aguas del bautismo hoy confieso<br>
yo mi fe: Jesucristo me ha salvado<br>
y en su amor me gozaré;<br>
Me bautizo en testimonio que a Jesús<br>
siguiendo estoy, desde ahora para<br>
el mundo y el pecado muerto soy.
</div>

<div class="estrofa">
3 Yo que estoy crucificado, ¿Cómo más<br>
podré pecar? Ya que soy resucitado,<br>
santa vida he de llevar.<br>
Son las aguas del bautismo mi señal<br>
de salvación, y yo quiero consagrarme<br>
al que obró mi redención.
</div>
`,
513: `
<div class="titulo">
<span class="numero">513</span>
<b>Los que somos bautizados</b>
</div>

<div class="versiculo">
Aquí hay agua, ¿qué impide que yo sea bautizado? Hechos 8:36
</div>

<div class="notas">Mi♭ (Capo 1 - Re) — Con certidumbre</div>

<div class="estrofa">
1 Los que somos bautizados con el<br>
Salvador Jesús, al pecado somos muertos;<br>
hoy andemos en su luz; Sepultados<br>
juntamente somos con el Salvador<br>
En figura de la muerte<br>
que sufrió el buen Señor.
</div>

<div class="estrofa">
2 Si por fe con él morimos (el bautismo<br>
es la señal) Con él ya resucitamos<br>
por su vida espiritual; Y no andamos<br>
como antes en caminos de pecar,<br>
Sino en novedad de vida<br>
que el Señor aquí nos da.
</div>

<div class="estrofa">
3 ¡Cuán gloriosa vida ha dado<br>
Cristo a los que él redimió! El, de muerte<br>
a vida ahora, con poder los traspasó;<br>
Y el bendito amor de Cristo<br>
nos constriñe, pues murió<br>
Para que ya no vivamos<br>
para sí, mas para Dios.
</div>
`,
514: `
<div class="titulo">
<span class="numero">514</span>
<b>Yo vivía en el pecado</b>
</div>

<div class="versiculo">
Y descendieron ambos al agua, Felipe y el eunuco, y le bautizó. Hechos 8:38
</div>

<div class="notas">Sol — Con vigor</div>

<div class="estrofa">
1 Yo vivía en el pecado,<br>
y doctrinas del error<br>
Me guiaban, engañado, a una muerte de terror.<br>
Soy salvado del abismo, con Jesús al cielo voy,<br>
// Y confieso por bautismo<br>
que del mundo ya no soy. //
</div>

<div class="estrofa">
2 Tuve el corazón muy triste pues en vano,<br>
paz busqué, Pero a mí, Señor, dijiste:<br>
"Hoy descanso te daré". Es la sangre que me<br>
salva y en paz me guardará;<br>
// El Espíritu me sella y me santificará. //
</div>

<div class="estrofa">
3 Antes muerto en el pecado,<br>
ya he muerto con Jesús,<br>
Y del mundo separado, yo me juzgo por la cruz.<br>
En el agua sumergido, testimonio a todos doy<br>
//Que en Cristo he creído y por él ya salvo soy. //
</div>
`,
515: `
<div class="titulo">
<span class="numero">515</span>
<b>El testimonio del bautismo</b>
</div>

<div class="lectura">
Con Cristo estoy juntamente crucificado,<br>
y ya no vivo yo, más vive Cristo en mí;<br>
<br>
Y lo que ahora vivo en la carne, lo vivo<br>
en la fe del Hijo de Dios, el cual me amó<br>
y se entregó a sí mismo por mí.<br>
<br>
¿O no sabéis que todos los que hemos sido<br>
bautizados en Cristo Jesús, hemos sido<br>
bautizados en su muerte?<br>
<br>
Así también vosotros consideraos<br>
muertos al pecado, pero vivos para<br>
Dios en Cristo Jesús, Señor nuestro.
</div>

<div class="versiculo">
Gálatas 2:20; Romanos 6:3, 11 (RVR)
</div>
`,
516: `
<div class="titulo">
<span class="numero">516</span>
<b>La cruz excelsa</b>
</div>

<div class="versiculo">
Lejos esté de mí gloriarme, sino en la cruz de nuestro Señor. Gálatas 6:14
</div>

<div class="notas">Fa (Capo 1 - Mi) — Con amplitud</div>

<div class="estrofa">
1 La cruz excelsa al contemplar<br>
do Cristo allí por mí murió,<br>
De todo cuanto estimo aquí,<br>
lo más precioso es su amor.
</div>

<div class="estrofa">
2 No busco gloria ni honor<br>
sino en la cruz de mi Señor.<br>
Las cosas que me encantan más<br>
las sacrifico por su amor.
</div>

<div class="estrofa">
3 De su cabeza, manos, pies,<br>
preciosa sangre corrió allí.<br>
Corona de espinas fue<br>
la que Jesús llevó por mí.
</div>

<div class="estrofa">
4 El mundo entero no será<br>
dádiva digna de ofrecer.<br>
Amor tan grande y sin igual<br>
en cambio exige todo el ser.
</div>
`,
517: `
<div class="titulo">
<span class="numero">517</span>
<b>Obediente a tu mandato</b>
</div>

<div class="versiculo">
Tomad, comed; esto es mi cuerpo que por vosotros es partido. 1 Corintios 11:24
</div>

<div class="notas">Fa (Capo 1 - Mi) — Con seguridad</div>

<div class="estrofa">
1 Obediente a tu mandato participa hoy tu grey<br>
De la cena, y con gozo la recibe nuestra fe;<br>
Tu dolor en el Calvario y tu pena y gran amor<br>
Anunciamos en tu nombre, amantísimo Señor.
</div>

<div class="estrofa">
2 Recordamos la tristeza que afligió tu corazón,<br>
Y la copa de amargura que por todo pecador<br>
En el Gólgota tomaste, despreciando tu dolor;<br>
Te pedimos que fervientes, te sigamos con valor.
</div>

<div class="estrofa">
3 Gracias, oh Jesús,<br>
te damos por tu infinito amor;<br>
Gracias mil, pues disfrutamos<br>
tu clemencia y tu favor.<br>
Tuya fue la cruz, mas nuestra<br>
es la dicha y es la paz;<br>
Tuya sea pues la gloria,<br>
hoy y por la eternidad. Amén.
</div>
`,

`,
519: `
<div class="titulo">
<span class="numero">519</span>
<b>Aquí del pan partido tomaré</b>
</div>

<div class="versiculo">
Por tanto, pruébese cada uno a sí mismo, y coma así del pan. 1 Corintios 11:28
</div>

<div class="notas">Mi♭ (Capo 1 - Re) — Con reverencia</div>

<div class="estrofa">
1 Aquí del pan partido tomaré,<br>
y de la copa de tu comunión.<br>
El nombre de mi Dios invocaré,<br>
gozándome en la paz de salvación.
</div>

<div class="estrofa">
2 La culpa del pecado mía fue,<br>
mas tuya fue la sangre de la cruz.<br>
Por ella y tu justicia tengo, sé,<br>
perdón, consuelo y paz, Señor Jesús.
</div>

<div class="estrofa">
3 Nos levantamos de la cena aquí;<br>
la fiesta pasa, mas no así el amor.<br>
Todo se va, mas tú te quedas, sí,<br>
cerca, muy cerca, amado Salvador.
</div>
`,
520: `
<div class="titulo">
<span class="numero">520</span>
<b>Hoy venimos, cual hermanos</b>
</div>

<div class="versiculo">
Les dio, diciendo: Esto es mi cuerpo que por vosotros es dado. Lucas 22:19
</div>

<div class="notas">Mi♭ (Capo 1 - Re) — Con serenidad</div>

<div class="estrofa">
1 Hoy venimos, cual hermanos,<br>
a la cena del Señor.<br>
Acerquémonos, cristianos,<br>
respirando tierno amor.
</div>

<div class="estrofa">
2 En memoria de su muerte<br>
y la sangre que vertió,<br>
Celebremos el banquete<br>
que en su amor nos ordenó.
</div>

<div class="estrofa">
3 Recordando las angustias<br>
que sufriera el Redentor,<br>
Dividida está nuestra alma<br>
entre el gozo y el dolor.
</div>

<div class="estrofa">
4 Nos da vida por su muerte,<br>
gozo por su aflicción;<br>
Alabemos al Cordero<br>

</div>
`,
521: `
<div class="titulo">
<span class="numero">521</span>
<b>Llegamos a tu mesa</b>
</div>

<div class="versiculo">
Todas las veces que comiereis este pan y bebiereis esta copa. 1 Corintios 11:26
</div>

<div class="notas">Mi♭ (Capo 1 - Re) — Con ternura</div>

<div class="estrofa">
1 Llegamos a tu mesa, oh Señor,<br>
a celebrar de nuevo tu amor;<br>
Amor vertido en la terrible cruz,<br>
cuando por mí moriste, mi Jesús.
</div>

<div class="estrofa">
2 Oh, examina y lávame, Señor;<br>
yo dignamente quiero hoy tomar<br>
Tu cena con un limpio corazón,<br>
contigo y con tu pueblo en comunión.
</div>

<div class="estrofa">
3 Tu cuerpo fue herido por mi bien;<br>
corona de espinas en tu sien.<br>
Tu cuerpo como el pan partido fue,<br>
el pan que como aquí con gozo y fe.
</div>

<div class="estrofa">
4 En el madero de la maldición<br>
tu sangre me compró la redención.<br>
La sangre, caro precio de favor,<br>
recuerdo en esta copa de amor.
</div>

<div class="estrofa">
5 Oh Salvador, en tu memoria es<br>
que el vino y pan tomamos cada vez<br>
Hasta que vengas, y tu gran bondad<br>
celebraremos por la eternidad.
</div>
`,
522: `
<div class="titulo">
<span class="numero">522</span>
<b>Es la cena del Señor</b>
</div>

<div class="versiculo">
Estando sentado con ellos a la mesa, tomó el pan y lo bendijo. Lucas 24:30
</div>

<div class="notas">Sol — Con reverencia</div>

<div class="estrofa">
1 Es la cena del Señor memorial de su amor;<br>
Representa en verdad<br>
su perfecta y gran bondad;<br>
Me recuerda de la cruz y la muerte de Jesús.
</div>

<div class="estrofa">
2 Al partir el pan aquí, me acordaré de ti,<br>
De tu cuerpo en la cruz que entregaste, oh Jesús;<br>
¡Cuánto te amo, oh Salvador,<br>
por comprarme, con amor!
</div>

<div class="estrofa">
3 Al tomar la copa aquí, me acordaré de ti,<br>
De la sangre carmesí que vertiste tú por mí;<br>
Pues tu angustia y cruel dolor,<br>
nunca olvidaré, Señor.
</div>

<div class="estrofa">
4 Tuya, oh Cristo, la pasión;<br>
mío el cielo y redención;<br>
Quiero dedicarme a ti, pues te diste tú por mí;<br>
Con amor te serviré y tu nombre alabaré.
</div>
`,
523: `
<div class="titulo">
<span class="numero">523</span>
<b>La mesa del Señor</b>
</div>

<div class="lectura">
La copa de bendición que bendecimos, ¿no es la comunión<br>
de la sangre de Jesucristo? El pan que partimos, ¿no es la<br>
comunión del cuerpo de Cristo?<br>
<br>
Siendo uno solo el pan, nosotros, con ser muchos,<br>
somos un cuerpo; pues todos participamos de aquel<br>
mismo pan.<br>
<br>
No podéis beber la copa del Señor, y la copa<br>
de los demonios;<br>
<br>
No podéis participar de la mesa del Señor, y de la mesa<br>
de los demonios.<br>
<br>
De manera que cualquiera que comiere este<br>
pan o bebiere esta copa del Señor indignamente,<br>
será culpado del cuerpo y de la sangre del Señor.<br>
<br>
Por tanto, pruébese cada uno a sí mismo, y coma así del<br>
pan, y beba de la copa.<br>
<br>
Porque todas las veces que comáis este pan<br>
y bebáis esta copa,<br>
<br>
La muerte del Señor proclamáis hasta que él venga.
</div>

<div class="versiculo">
1 Corintios 10:16, 17, 21; 11:27, 28 (RVR) 11:26 (BLA)
</div>
`,
524: `
<div class="titulo">
<span class="numero">524</span>
<b>Hay un precioso manantial</b>
</div>

<div class="versiculo">
En aquel tiempo habrá un manantial abierto... para purificación. Zacarías 13:1
</div>

<div class="notas">Si♭ (Capo 1 - La) — Con reflexión</div>

<div class="estrofa">
1 Hay un precioso manantial de sangre<br>
de Emanuel, que purifica a cada cual<br>
/// que se sumerge en él. ///<br>
Que purifica a cada cual que se sumerge en él.
</div>

<div class="estrofa">
2 El malhechor se convirtió pendiente<br>
de una cruz; El vio la fuente y se lavó,<br>
/// creyendo en Jesús. ///<br>
El vio la fuente y se lavó, creyendo en Jesús.
</div>

<div class="estrofa">
3 Y yo también mi pobre ser allí logré lavar;<br>
La gloria de su gran poder<br>
/// me gozo en ensalzar. ///<br>
La gloria de su gran poder<br>
me gozo en ensalzar.
</div>

<div class="estrofa">
4 ¡Eterna fuente carmesí! ¡Raudal de puro<br>
amor! Se lavará por siempre en ti<br>
/// el pueblo del Señor. ///<br>
Se lavará por siempre en ti<br>
el pueblo del Señor.
</div>
`,
525: `
<div class="titulo">
<span class="numero">525</span>
<b>Vengan a la mesa</b>

vengan a celebrar.<br>

vengan a adorar.

<div class="coro" style="font-style: italic;">
Vengan a la mesa,<br>
vengan a celebrar.<br>

vengan a adorar.

2 Juntos tomemos la cena<br>

<div class="coro" style="font-style: italic;">
Vengan a la mesa,<br>
vengan a celebrar.<br>
Vengan con gran gozo,<br>
vengan a adorar.
</div>

<div class="estrofa">
3 Somos un Cuerpo en Cristo;<br>

</div>

<div class="coro" style="font-style: italic;">
Vengan a la mesa,<br>
vengan a celebrar.<br>
Vengan con gran gozo,<br>
vengan a adorar.
</div>
`,
526: `
<div class="titulo">
<span class="numero">526</span>
<b>Cristo su preciosa sangre</b>
</div>

<div class="versiculo">
Teniendo libertad... por la sangre de Jesucristo... acerquémonos. Hebreos 10:19, 22
</div>

<div class="notas">Re m — Con intensidad</div>

<div class="estrofa">
1 Cristo su preciosa sangre en la cruz vertió;<br>
Por nosotros pecadores él la dio.<br>
Con su sangre meritoria hizo redención,<br>
Y por eso Dios te brinda el perdón.
</div>

<div class="estrofa">
2 Es la sangre tan preciosa del buen Salvador<br>
La que quita los pecados y el temor.<br>
Sin la sangre es imposible que haya remisión;<br>
Por las obras no se alcanza salvación.
</div>

<div class="estrofa">
3 Cristo invita a los perdidos al celeste hogar;<br>
Al hambriento él ofrece pan sin par.<br>
Muy preciosa es la sangre, porque me compró<br>
Vida eterna en el cielo; ¡Gloria a Dios!
</div>
`,
527: `
<div class="titulo">
<span class="numero">527</span>
<b>Recordad al Señor</b>

531: `
<div class="titulo">
<span class="numero">531</span>
<b>Soldados de Dios</b>
</div>

<div class="lectura">
Por lo demás, fortaleceos en el Señor y en el poder<br>
de su fuerza. Vestíos de toda la armadura de Dios,<br>
para que podáis hacer frente a las intrigas del diablo;<br>
<br>
Porque nuestra lucha no es contra sangre<br>
ni carne, sino contra principados, contra<br>
autoridades, contra los gobernantes de estas<br>
tinieblas, contra espíritus de maldad en los<br>
lugares celestiales.<br>
<br>
Por esta causa, tomad toda la armadura de Dios,<br>
para que podáis resistir en el día malo, y después<br>
de haberlo logrado todo, quedar firmes.<br>
<br>
Permaneced, pues, firmes, ceñidos con el<br>
cinturón de la verdad, vestidos con la coraza<br>
de justicia y calzados vuestros pies con la<br>
preparación para proclamar el evangelio de paz.<br>
<br>
Tomad también el casco de la salvación y la espada del<br>
Espíritu, que es la palabra de Dios, orando en todo tiempo.<br>
<br>
La noche está muy avanzada, y el día está cerca.<br>
Despojémonos, pues, de las obras de las<br>
tinieblas y vistámonos con las armas de la luz.<br>
<br>
Andemos decentemente, como de día; no con<br>
glotonerías y borracheras, ni en pecados sexuales<br>
y desenfrenos, ni en peleas y envidia.<br>
<br>
Más bien, vestíos del Señor Jesucristo,<br>
y no hagáis provisión para satisfacer los<br>
malos deseos de la carne.
</div>

<div class="versiculo">
Efesios 6:10-15, 17-18a; Romanos 13:12-14 (RVA)
</div>

536: `
<div class="titulo">
<span class="numero">536</span>
<b>Resurrección</b>
</div>

<div class="lectura">
Tras la noche tenebrosa<br>
Y el rugir del vendaval,<br>
Tiende el alba majestuosa<br>
Cortinaje de cristal;<br>
<br>
Y aparece un claro día<br>
Sin las brumas del dolor,<br>
Donde el ama se extasía<br>
Y se goza el puro amor.<br>
<br>
Tras la nota vespertina<br>
Que oprimiera el corazón.<br>
Viene aquella matutina<br>
Que se alarga en fiel canción.<br>
<br>
Cual la ninfa misteriosa<br>
Que en su tumba se guardó,<br>
Y en brillante mariposa<br>
Con el tiempo se tornó,<br>
<br>
Tal aquel que duerme en Cristo,<br>
De su sueño al despertar,<br>
Con ropaje nunca visto,<br>
Lo veréis resucitar.<br>
<br>
Y la tienda que aprisiona<br>
Cual gusano en vil zurrón,<br>
Con poder se desmorona,<br>
¿Qué es, o muerte, tu aguijón?
</div>

<div class="autor">
Arturo Borja Anderson, 1966
</div>

537: `
<div class="titulo">
<span class="numero">537</span>
<b>La segunda venida de Cristo</b>
</div>

<div class="lectura">
Tampoco queremos, hermanos, que ignoréis acerca<br>
de los que duermen, para que no os entristezcáis<br>
como los otros que no tienen esperanza.<br>
<br>
Porque si creemos que Jesús murió<br>
y resucitó, así también traerá Dios con<br>
Jesús a los que durmieron en él.<br>
<br>
Por lo cual os decimos esto en palabra del Señor:<br>
que nosotros que vivimos, que habremos quedado<br>
hasta la venida del Señor, no precederemos a los<br>
que durmieron.<br>
<br>
Porque el Señor mismo con voz de mando,<br>
con voz de arcángel, y con trompeta de<br>
Dios, descenderá del cielo; y los muertos<br>
en Cristo resucitarán primero.<br>
<br>
Luego nosotros los que vivimos, los que hayamos<br>
quedado, seremos arrebatados juntamente con<br>
ellos en las nubes para recibir al Señor en el aire,<br>
<br>
Y así estaremos siempre con el Señor. Por<br>
tanto, alentaos los unos a los otros con estas<br>
palabras.<br>
<br>
He peleado la buena batalla, he acabado la carrera,<br>
he guardado la fe.<br>
<br>
Por lo demás, me está guardada la corona<br>
de justicia, la cual me dará el Señor, juez<br>
justo, en aquel día; y no sólo a mí, sino<br>
también a todos los que aman su venida.
</div>

<div class="versiculo">
1 Tesalonicenses 4:13-18; 2 Timoteo 4:7-8 (RVR)
</div>

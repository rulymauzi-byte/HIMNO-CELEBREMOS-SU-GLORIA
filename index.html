569: `
<div class="titulo">
<span class="numero">569</span>
<b>Victoria sobre la muerte</b>
</div>

<div class="versiculo">
Sabemos que si nuestra casa terrenal, esta tienda temporal, se deshace, tenemos un edificio de parte de Dios, una casa no hecha de manos, eternal en los cielos.
</div>

<div class="estrofa">
Así vivimos, confiando siempre y comprendiendo que durante nuestra estancia en el cuerpo peregrinamos ausentes del Señor.
</div>

<div class="estrofa">
Pues confiamos y consideramos mejor estar ausentes del cuerpo, y estar presentes delante del Señor.
</div>

<div class="estrofa">
Por lo tanto, estemos presentes o ausentes, nuestro anhelo es serle agradables.
</div>

<div class="estrofa">
El transformará nuestro cuerpo de humillación para que tenga la misma forma de su cuerpo de gloria, según la operación de su poder.
</div>

<div class="estrofa">
Amados, ahora somos hijos de Dios, y aún no se ha manifestado lo que seremos.
</div>

<div class="estrofa">
Pero sabemos que cuando él sea manifestado, seremos semejantes a él, porque le veremos tal como él es.
</div>

<div class="estrofa">
Pero ahora, Cristo sí ha resucitado de entre los muertos, como primicias de los que durmieron.
</div>

<div class="estrofa">
He aquí, os digo un misterio: No todos dormiremos, pero todos seremos transformados
</div>

<div class="estrofa">
En un instante, en un abrir y cerrar de ojos, a la trompeta final.
</div>

<div class="estrofa">
Porque sonará la trompeta, y los muertos serán resucitados sin corrupción; y nosotros seremos transformados.
</div>

<div class="estrofa">
Porque es necesario que esto corruptible sea vestido de incorrupción, y que esto mortal sea vestido de inmortalidad.
</div>

<div class="estrofa">
Y cuando esto corruptible se vista de incorrupción y esto mortal se vista de inmortalidad, entonces se cumplirá la palabra que está escrita: ¡Sorbida es la muerte en victoria!
</div>

<div class="estrofa">
Pero gracias a Dios, quien nos da la victoria por medio de nuestro Señor Jesucristo.
</div>

571: `
<div class="titulo">

</div>

<div class="estrofa">
¡Oh, Cristo, Rey de reyes! Eres el Señor de la historia. Por tu Palabra entiendo que todo lo que sucede forma parte de tu plan soberano, el cual culminará en tu triunfo, para alabanza de tu gloria.
</div>

<div class="estrofa">

</div>

<div class="estrofa">

586: `
<div class="titulo">
<span class="numero">586</span>
<b>Hacedores del bien</b>
</div>

<div class="estrofa">
Pero habla tú lo que está de acuerdo con la sana doctrina; que los hombres mayores sean sobrios, serios y prudentes, sanos en la fe, en el amor y en la perseverancia.
</div>

<div class="estrofa">
Asimismo, que las mujeres mayores sean reverentes en conducta, no calumniadoras ni esclavas del mucho vino, maestras de lo bueno,
</div>

<div class="estrofa">
De manera que encaminen en la prudencia a las mujeres jóvenes: a que amen a sus maridos y a sus hijos,
</div>

<div class="estrofa">
Para que la palabra de Dios no sea desacreditada.
</div>

<div class="estrofa">
Exhorta asimismo a los jóvenes a que sean prudentes, mostrándote en todo como ejemplo de buenas obras.
</div>

<div class="estrofa">
No os engañéis; Dios no puede ser burlado. Todo lo que el hombre siembre, eso mismo cosechará.
</div>

<div class="estrofa">
No nos cansemos, pues, de hacer el bien; porque a su tiempo cosecharemos, si no desmayamos.
</div>

<div class="estrofa">
Por lo tanto, mientras tengamos oportunidad, hagamos el bien a todos, y en especial a los de la familia de la fe.
</div>
`,

591: `
<div class="titulo">
<span class="numero">591</span>

</div>

Por ella, del Dios verdadero aprendió.
</div>

<div class="coro" style="font-style: italic;">
Dios nuestro Padre, te loamos por tu amor;<br>
Dios poderoso, pedimos protección;<br>

</div>

</div>

Dios poderoso, pedimos protección;<br>
Dios soberano, dirígenos, Señor,<br>
Hasta llegar a tu celestial mansión.
</div>

<div class="estrofa">
3 "Tu pueblo", Rut dijo, "mi pueblo será,<br>

Tu Dios seguiré, y me amparará;<br>

</div>

<div class="coro" style="font-style: italic;">
Dios nuestro Padre, te loamos por tu amor;<br>
Dios poderoso, pedimos protección;<br>

Hasta llegar a tu celestial mansión.
</div>

<div class="estrofa">
4 La joven humilde a Booz acudió,<br>

</div>

<div class="coro" style="font-style: italic;">
Dios nuestro Padre, te loamos por tu amor;<br>
Dios poderoso, pedimos protección;<br>

</div>

592: `
<div class="titulo">
<span class="numero">592</span>
<b>Perfecto Amor</b>
</div>

<div class="versiculo">
Por esto dejará...a su padre y a su madre, y se unirá a su mujer. Efesios 5:31
</div>

<div class="notas">Mi♭ (Capo 1 - Re) — Con dulzura</div>

<div class="estrofa">
1 Perfecto amor, que al hombre es transcendente,<br>
Concede a éstos, Dios, tu bendición,<br>
Que su amor perdure eternamente,<br>
No dos, sino uno en perfecta unión.
</div>

<div class="estrofa">
2 Vida perfecta, que de tu abundancia<br>
Demuestren caridad y gran valor,<br>
Dulce esperanza, fe y perseverancia;<br>
Que en tiempo adverso vivan sin temor.
</div>

<div class="estrofa">
3 Concédeles tu gozo en la tristeza,<br>
Y en el afán tu gracia eficaz;<br>

</div>
`,
593: `
<div class="titulo">
<span class="numero">593</span>
<b>Dios bendiga las almas unidas</b>
</div>

<div class="versiculo">
Y dijo...Dios: No es bueno que el hombre esté sólo; le haré ayuda idónea. Génesis 2:18
</div>

<div class="notas">Re — Con alegría</div>

<div class="estrofa">
1 Dios bendiga las almas unidas<br>
por los lazos de amor sacrosanto,<br>
Y las guarde de todo quebranto<br>
en un mundo de espinas y error.<br>
Que el hogar que a formarse comienza<br>
con la unión de estos dos corazones,<br>
Goce siempre de mil bendiciones<br>
al amparo del Dios de Israel.
</div>

<div class="estrofa">
2 Que el Señor, con su dulce presencia,<br>
cariñoso estas bodas presida,<br>
Y conduzca por sendas de vida<br>
a los que hoy se prometen lealtad.<br>
Les recuerde que nada en el mundo<br>
es eterno, que todo termina,<br>
Y por tanto con gracia divina,<br>
cifrar deben la dicha en su Dios.
</div>

<div class="estrofa">
3 Que los dos que aquí se aproximan<br>
a jurarse su fe mutuamente,<br>
Busquen siempre en Cristo la fuente<br>
de amor y de dicha inmortal.<br>
Y si acaso de duelo y tristeza<br>
se empañase su senda un día,<br>
En Jesús hallarán dulce guía<br>
que consuelo y paz les dará.
</div>
`,
594: `
<div class="titulo">
<span class="numero">594</span>
<b>Oración de matrimonio</b>
</div>

<div class="versiculo">
Si Dios nos ha amado así, debemos también amarnos unos a otros. 1 Juan 4:11
</div>

<div class="notas">Si♭ (Capo 1 - La) — Con ternura</div>

<div class="estrofa">
1 Padre eterno, hoy humildemente,<br>
Te dirigimos nuestra oración;<br>
Tú que trasciendes al entendimiento,<br>
Une a estas almas en tu bendición.
</div>

<div class="estrofa">
2 Tú, de la vida inspirador supremo,<br>
Sella este pacto con tu santo amor;<br>
Y en tus promesas y en tu compañía<br>
Vivan tus hijos sin ningún temor.
</div>

<div class="estrofa">
3 Ante las pruebas dales valentía,<br>
Y aquella fe que vence al vendaval;<br>
Sea la luz de cada nuevo día<br>
Aurora plena de felicidad.
</div>

<div class="estrofa">
4 Padre, que en este hogar, que hoy se forma,<br>
Arda inefable el fuego de tu amor;<br>
Esta unión, por ti santificada,<br>
Fiel se consagre siempre a ti, Señor. Amén.
</div>
`,
595: `

597: `
<div class="titulo">

598: `

600: `
<div class="titulo">

`,

602: `

603: `
<div class="titulo">
<span class="numero">603</span>
<b>Honor a las madres</b>
</div>

<div class="versiculo">

`,
604: `

`,
605: `

606: `

`,
607: `

que mis penas mitigó.

A mi madre tan querida,<br>
la honraré toda la vida;<br>
Su bondad fue sin medida;<br>
gracias, Dios, por su amor.
</div>

<div class="estrofa">
3 Su mirada de ternura,<br>
bello obsequio del Señor,<br>
Su cariño y dulzura,<br>
los recuerdo con amor.
</div>

<div class="coro" style="font-style: italic;">
A mi madre tan querida,<br>
la honraré toda la vida;<br>
Su bondad fue sin medida;<br>
gracias, Dios, por su amor.
</div>
`,
608: `

`,
609: `
<div class="titulo">
<span class="numero">609</span>
<b>Dad a Dios inmortal alabanza</b>
</div>

<div class="estrofa">
1 Dad a Dios inmortal alabanza, su merced,<br>
su verdad nos inunda; Es su gracia en prodigios fecunda,<br>
sus mercedes, humildes, cantad. ¡Al Señor de señores<br>
dad gloria, Rey de reyes, poder sin segundo!<br>
Morirán los señores del mundo,<br>
mas su reino no acaba jamás.
</div>

<div class="estrofa">
2 Vio los pueblos en vicios sumidos<br>
y sintió compasión en su seno; De prodigios de gracia<br>
está lleno, sus mercedes, humildes, cantad.<br>
A su pueblo llevó por la mano a la tierra por él prometida.<br>
Por los siglos sin fin le da vida;<br>
y el pecado y la muerte caerán.
</div>

<div class="estrofa">
3 A su Hijo envió por salvarnos del pecado y la muerte eterna;<br>
De prodigios de gracia es torrente, sus mercedes, humildes,<br>
cantad. Por el mundo su mano nos lleva<br>
y al celeste descanso nos guía; Su bondad vivirá eterno día,<br>
cuando el mundo no exista ya más.
</div>
`,
610: `
<div class="titulo">
<span class="numero">610</span>
<b>Principia un año nuevo</b>
</div>

<div class="versiculo">
Ninguna palabra de todas sus promesas...ha faltado. 1 Reyes 8:56
</div>

<div class="notas">Re — Con resolución</div>

<div class="estrofa">
1 Principia un año nuevo; que sea, oh Señor,<br>
Un año en que nos muestres de nuevo tu amor;<br>
Un año de progreso y de prosperidad,<br>
Un año en que gocemos tu gran fidelidad.
</div>

<div class="estrofa">
2 Principia un año nuevo; en ti hemos de confiar;<br>
Seguros en tu mano podemos descansar.<br>
Tu gran misericordia, tu gracia y bondad<br>
En este nuevo año queremos disfrutar.
</div>

<div class="estrofa">
3 Principia un año nuevo; ayúdanos, oh Dios,<br>
A ser más consagrados, más prestos a tu voz;<br>
Y sea allá contigo, o en la tierra aquí,<br>
Que todo lo que hagamos te glorifique a ti.<br>
Amén.
</div>
`,
611: `
<div class="titulo">
<span class="numero">611</span>
<b>Con alegres corazones</b>
</div>

<div class="versiculo">
El corazón alegre constituye buen remedio. Proverbios 17:22
</div>

<div class="notas">Mi♭ (Capo 1 - Re) — Con fervor</div>

<div class="estrofa">
1 Con alegres corazones alabamos al Señor;<br>
Celebrando tu cumpleaños, hoy cantamos con fervor;<br>
Te deseamos muchos años de completa bendición;<br>
Que tu vida sea en Cristo, tu delicia y tu porción.
</div>

<div class="coro" style="font-style: italic;">
Cantad, cantad, (sí, cantad,) felicidad (sí, cantad,)<br>
deseamos hoy de corazón; Su nombre alabad, (alabad,)<br>
Su nombre alabad, (alabad,) Que Dios te dé su protección.<br>
El buen Pastor (el Pastor) te guiará (te guiará)<br>
en sendas de paz y amor; Pues que contigo Cristo<br>
siempre está, ¡Cantad, cantad, cantad!
</div>

<div class="estrofa">
2 El Señor te dio la vida; con su imagen te dotó,<br>
Para gloria de su nombre, ricos dones te legó.<br>
Dios que vela tus pisadas y a tu lado siempre va,<br>
Por su gracia te sustenta con el célico maná.
</div>

<div class="coro" style="font-style: italic;">
A Dios loor (sí loor), porque en su amor (su amor)<br>
un año más te concedió; Dio bendición (bendición)<br>
y protección (protección) y con sus alas te cubrió<br>
Te cuidará (cuidará) y guiará (guiará)<br>
y en todo te prosperará,<br>
Pues a tu lado ha prometido estar;<br>
¡A Dios todo loor!
</div>
`,
612: `
<div class="titulo">
<span class="numero">612</span>

2 A Dios le damos gracias que con amor sin par,<br>

¡Feliz, feliz cumpleaños!<br>

`,
613: `
<div class="titulo">
<span class="numero">613</span>
<b>Nuestra Patria</b>
</div>

Y sucederá que todo aquel que invocare el nombre del Señor será salvo. Joel 2:32
</div>

<div class="estrofa">
Nuestra patria será para Cristo,<br>
si unidos luchamos por él;<br>

y que muestre de Dios el poder.<br>

prediquemos de Cristo doquier.

<div class="estrofa">
¡Oh Cristianos, luchad!<br>

que Jesús pronto vendrá.<br>

Vuestra patria salvad,<br>
que Jesús pronto vendrá.
</div>
`,
614: `
<div class="titulo">
<span class="numero">614</span>
<b>América será para Cristo</b>
</div>

<div class="versiculo">
He aquí una gran multitud... de todas naciones, y tribus... y lenguas. Apocalipsis 7:9
</div>

<div class="notas">Si♭ (Capo 1 - La) — Con ánimo</div>

<div class="estrofa">
1 América será para Cristo,<br>
el único camino hacia Dios;<br>
Verá lo que sus ojos no han visto,<br>
con sólo caminar de él en pos.
</div>

<div class="estrofa">
América será para el cielo,<br>
el cielo que Jesús preparó,<br>
El día que tras rápido vuelo,<br>
al lado de Jehová se sentó.
</div>

<div class="estrofa">
2 Despierta, pues, América amada;<br>
alístate en las filas de Dios;<br>
Escucha del Señor la llamada,<br>
pues es tan cariñosa su voz.
</div>

<div class="estrofa">
Llamando está a tu puerta el Cordero<br>
que derramó su sangre en la cruz;<br>
Que sea el Nuevo Mundo el primero,<br>
en ir a las mansiones de luz.
</div>

<div class="estrofa">
3 Colombia, Panamá y Venezuela,<br>
Bolivia, Paraguay, Ecuador,<br>
Tendrán la paz de Dios que consuela,<br>
la paz que nos dejó el Redentor.
</div>

<div class="estrofa">
Y Chile, el Perú, la Argentina,<br>
y Cuba, Uruguay y el Brasil,<br>
Y el grupo de las islas marinas,<br>
tendrán sus bendiciones a mil.
</div>

<div class="estrofa">
4 Los pueblos que han estado dormidos<br>
sabrán que Dios les ama en verdad:<br>
Jamaica, los Estados Unidos,<br>
y México y también Canadá.
</div>

<div class="estrofa">
Los pueblos que componen el Istmo,<br>
y todos los del sur lo sabrán;<br>
Sin Cristo nunca habrá cristianismo;<br>
sin Cristo sólo reina Satán.
</div>

<div class="estrofa">
5 La bella Guatemala y Honduras,<br>
la hermosa Nicaragua, también,<br>
Tendrán en las edades futuras<br>
la vida y la salud del Edén.<br>
Y Dios bendecirá a Costa Rica;<br>
y Dios bendecirá a El Salvador,<br>
Naciones que, aunque sean tan chicas,<br>
son grandes a la faz del Señor.
</div>
`,
615: `

`,
616: `

617: `
<div class="titulo">
<span class="numero">617</span>
<b>Supremo Dios</b>
</div>

Bienaventurada la nación cuyo Dios es el Señor. Salmo 33:12
</div>

<div class="estrofa">
1 Supremo Dios, te ruego por mi patria;<br>
Gobierna con tu mano de justicia.<br>
Seas honrado y glorificado<br>
En toda la nación.
</div>

<div class="estrofa">
2 Hincha los ríos, fecundiza el campo,<br>
Llena las huertas, el taller visita;<br>
Y a todo hombre dale de tus bienes<br>
Lo que es menester.
</div>

<div class="estrofa">
3 Para tu reino sea nuestra patria;<br>
Tu voluntad la ley que veneremos;<br>
La cruz de Cristo la gloriosa enseña<br>
Que tremolemos.
</div>

<div class="estrofa">
4 Sobre la tierra que por patria amada<br>
Te plugo darnos, libertades brillen.<br>
Y no consientas que se forjen nunca<br>
Yugos de esclavitud.
</div>

<div class="estrofa">
5 Caigan las aras de mentidos dioses<br>
Que al hombre vana salvación le brindan.<br>
Sé tú el Dios nuestro, y el debido culto<br>
Todos te rindan hoy.
</div>
`,
618: `
<div class="titulo">

</div>

Porque esto es bueno y agradable delante de Dios nuestro Salvador,
</div>

<div class="estrofa">

</div>
`,
619: `

sobre nosotros su misericordia,<br>

`,
620: `

a los pies de nuestro Salvador;<br>

un redil con nuestro buen Pastor.

<div class="estrofa">

`,
621: `

622: `

623: `

624: `

625: `

626: `

<b>Jóvenes:</b> Al que hizo las grandes lumbreras,<br>
<i>Todos:</i> <i>Porque para siempre es su misericordia.</i><br>
<b>Niños:</b> El sol para que señorease en el día,<br>
<i>Todos:</i> <i>Porque para siempre es su misericordia.</i><br>
<b>Varones:</b> El que da alimento a todo ser viviente,<br>
<i>Todos:</i> <i>Porque para siempre es su misericordia.</i><br>
<b>Todos:</b> Alabad al Dios de los cielos,<br>
<i>Todos:</i> <i>Porque para siempre es su misericordia.</i>
</div>
`,
628: `
<div class="titulo">
<span class="numero">628</span>
<b>Para siempre es</b>
</div>

<div class="versiculo">
Jehová es bueno; para siempre es su misericordia. Salmo 100:5
</div>

<div class="notas">Sol — Con entusiasmo</div>

<div class="estrofa">
Porque para siempre<br>
su misericordia,<br>

siempre es.
</div>
`,
629: `
<div class="titulo">
<span class="numero">629</span>
<b>Eterno Rey</b>
</div>

<div class="versiculo">
Cantad a nuestro Rey, cantad. Salmo 47:6
</div>

<div class="notas">Do — Con majestuosidad</div>

<div class="estrofa">
1 Eterno Rey, celebraremos tu gloria;<br>
Oh Padre Dios, recordaremos la historia<br>
De tu amor y bondad; nos salvaste en verdad.<br>
A ti alabaremos por siempre y siempre.<br>
Amén.
</div>

<div class="estrofa">
2 Gran Salvador, celebraremos tu gloria;<br>
Buen Redentor, ensalzaremos la victoria<br>
Que ganaste, Jesús, al morir en la cruz.<br>
A ti alabaremos por siempre y siempre.<br>
Amén.
</div>

<div class="estrofa">
3 Espíritu, celebraremos tu gloria;<br>
Consolador, loamos tu gran misericordia;<br>
Nos das gozo y solaz, nos cobija tu paz.<br>
A ti alabaremos por siempre y siempre.<br>
Amén.
</div>
`,
630: `
<div class="titulo">
<span class="numero">630</span>
<b>Tu pueblo calla ante ti, Señor</b>
</div>

<div class="versiculo">
¡Cuán amables son tus moradas, oh Señor de los ejércitos! Salmo 84:1
</div>

<div class="notas">Mi♭ (Capo 1 - Re) — Con reverencia</div>

<div class="estrofa">
Tu pueblo calla ante ti, Señor,<br>
Omnipotente y soberano Rey;<br>
Reunidos, te adoramos<br>
Al contemplar tu santidad y gloria.<br>
Te loamos, te amamos,<br>
oh eterno Dios.<br>
Amén.
</div>
`,
631: `
<div class="titulo">
<span class="numero">631</span>
<b>Te Alabamos</b>
</div>

<div class="estrofa">
Te alabamos ¡oh Señor!<br>
Tu poder y reino honramos:<br>
Te adoramos ¡oh Señor!<br>
Por tus obras te gloriamos:<br>
Dios de fuerza y de bondad,<br>
Desde la eternidad.
</div>

<div class="estrofa">
Por tu grande salvación,<br>
Te alabamos noche y día,<br>
Tuyo es nuestro corazón,<br>
Nuestra alma en ti confía:<br>
Cuerpo y mente ¡oh Señor!<br>
Te ofrendamos con amor.
</div>

<div class="estrofa">
Padre nuestro, escúchanos.<br>
Cólmanos de bendiciones:<br>
Muéstranos tu rostro ¡oh Dios!<br>
Presta, Espíritu, tus dones;<br>
¡Jesucristo, pronto ven!<br>
¡Gloria a ti, Señor! Amén.
</div>
`,
632: `
<div class="titulo">
<span class="numero">632</span>
<b>Engrandecido sea Dios</b>
</div>

<div class="versiculo">
Porque grande es el Señor, y digno de suprema alabanza. 1 Crónicas 16:25
</div>

<div class="notas">La♭ (Capo 1 - Sol) — Con amplitud</div>

<div class="estrofa">
1 Engrandecido sea Dios<br>
en esta reunión, en esta reunión;<br>
Alegres, juntos a una voz,
</div>

<div class="coro" style="font-style: italic;">
Dad gloria, gloria, gloria, gloria,<br>
Dad gloria a nuestro Dios,<br>
Amén.<br>
(Dad gloria, gloria, gloria, gloria,<br>
gloria, gloria, gloria,<br>
dad gloria a nuestro Dios. Amén.)
</div>

<div class="estrofa">
2 Durante el día que pasó<br>
la mano del Señor, la mano del Señor<br>
De muchos males nos salvó:
</div>

<div class="coro" style="font-style: italic;">
Dad gloria, gloria, gloria, gloria,<br>
Dad gloria a nuestro Dios,<br>
Amén.<br>
(Dad gloria, gloria, gloria, gloria,<br>
gloria, gloria, gloria,<br>
dad gloria a nuestro Dios. Amén.)
</div>

<div class="estrofa">
3 Pues hasta aquí nos ayudó,<br>
y siempre proveerá, y siempre proveerá;<br>
Con gratitud, placer y amor.
</div>

<div class="coro" style="font-style: italic;">
Dad gloria, gloria, gloria, gloria,<br>
Dad gloria a nuestro Dios,<br>
Amén.<br>
(Dad gloria, gloria, gloria, gloria,<br>
gloria, gloria, gloria,<br>
dad gloria a nuestro Dios. Amén.)
</div>
`,
633: `
<div class="titulo">
<span class="numero">633</span>
<b>Ven te invito</b>
</div>

<div class="versiculo">
Alabadle conforme a la muchedumbre de su grandeza. Salmo 150:2
</div>

<div class="notas">Re m — Con vigor</div>

<div class="estrofa">
// Ven, te invito a cantar al Señor,<br>
ven, te invito a deleitarte en él;<br>

con toda tu voz, con todo tu amor.//
</div>

<div class="estrofa">
(Mujeres) Suenen violines,<br>
(Hombres) Toquen trompetas;
</div>

<div class="estrofa">
(Todos) *Alzad las voces, ¡Alabad a Dios!<br>
Hombres y mujeres, niños y ancianos,<br>
sanos y enfermos ¡Alabad a Dios! ¡Ey!
</div>

<div class="estrofa">
Ven, te invito a cantar al Señor,<br>
ven, te invito a deleitarte en él;<br>
Ven, te invito a cantar al Señor<br>
con toda tu voz, con todo tu amor.
</div>
`,
634: `
<div class="titulo">
<span class="numero">634</span>
<b>Cantad alegres, cantad a Dios</b>

</div>

habitantes de toda la tierra.<br>
Servid a Dios con alegría;<br>
servid a Dios con regocijo.

//// Aleluya, gloria aleluya //// (Amén.)

Pueblo suyo, suyo somos<br>
y ovejas de su prado.

//// Aleluya, gloria aleluya //// (Amén.)
</div>

3 Entrad por sus puertas con acción de gracias,<br>

Alabadle con canciones, bendecid su santo<br>
nombre.

//// Aleluya, gloria aleluya //// (Amén.)
</div>

para siempre es su misericordia,<br>

<div class="coro" style="font-style: italic;">

`,
635: `
<div class="titulo">
<span class="numero">635</span>
<b>¡Bienvenido!</b>
</div>

<div class="versiculo">
Donde están dos o tres congregados en mi nombre, allí estoy yo. Mateo 18:20
</div>

<div class="notas">Mi♭ (Capo 1 - Re) — Con alegría</div>

<div class="estrofa">
1 Con gran gozo y placer nos volvemos hoy a ver;<br>
Nuestras manos otra vez estrechamos.<br>
Se contenta el corazón ensanchándose de amor;<br>
Todos a una voz a Dios gracias damos.
</div>

<div class="coro" style="font-style: italic;">
¡Bienvenido! ¡Bienvenido!<br>
Los hermanos hoy aquí nos gozamos en decir:<br>
¡Bienvenido! ¡Bienvenido!<br>
Al volvernos a reunir, ¡Bienvenido!
</div>

<div class="estrofa">
2 Hasta aquí Dios te ayudó,<br>
ni un momento te dejó,<br>
Y a nosotros te volvió, ¡Bienvenido!<br>
El Señor te acompañó,<br>
su presencia te amparó,<br>
Del peligro te guardó, ¡Bienvenido!
</div>

<div class="coro" style="font-style: italic;">
¡Bienvenido! ¡Bienvenido!<br>
Los hermanos hoy aquí nos gozamos en decir:<br>
¡Bienvenido! ¡Bienvenido!<br>
Al volvernos a reunir, ¡Bienvenido!
</div>

<div class="estrofa">
3 Dios nos guarde en este amor,<br>
para que de corazón,<br>
Consagrados al Señor, le alabemos.<br>
En la eterna reunión do no habrá separación,<br>
Ni tristeza ni aflicción: ¡Bienvenido!
</div>

<div class="coro" style="font-style: italic;">
¡Bienvenido! ¡Bienvenido!<br>
Los hermanos hoy aquí nos gozamos en decir:<br>
¡Bienvenido! ¡Bienvenido!<br>
Al volvernos a reunir, ¡Bienvenido!
</div>
`,
636: `
<div class="titulo">
<span class="numero">636</span>

y así compartir<br>
el amor del Señor.

`,
637: `
<div class="titulo">
<span class="numero">637</span>

la Biblia me habla hoy.

`,
638: `
<div class="titulo">
<span class="numero">638</span>
<b>Por siempre, amén</b>
</div>

<div class="versiculo">
A él sea gloria... por todas las edades, por los siglos de los siglos. Amén. Efesios 3:21
</div>

<div class="notas">Fa (Capo 1 - Mi) — Con júbilo</div>

<div class="estrofa">
Engrandecido seas, Jehová nuestro Dios,<br>
Por todas las edades, por siempre. Amén.
</div>
`,
639: `
<div class="titulo">
<span class="numero">639</span>
<b>Tu pueblo jubiloso</b>
</div>

<div class="versiculo">
Venid, aclamemos alegremente al Señor. Salmo 95:1
</div>

<div class="notas">Mi♭ (Capo 1 - Re) — Con amplitud</div>

<div class="estrofa">
1 Tu pueblo jubiloso se acerca a ti, Señor,<br>
Y con triunfantes voces hoy canta tu loor;<br>
Por todas tus bondades, que das en plenitud,<br>
Tu pueblo humildemente te expresa gratitud.
</div>

<div class="estrofa">
2 Acceso a ti, oh Padre tenemos por Jesús;<br>
Sin verte en tu gloria gozamos santa luz.<br>
Aunque eres infinito, excelso Creador,<br>
Habita en nosotros tu Espíritu, Señor.
</div>

<div class="estrofa">
3 Oh Cristo, te alabamos de todo corazón;<br>
en ti tenemos vida y eterna salvación.<br>
Tu gracia nos derrama constante bendición;<br>
Te damos honra, gloria y fiel adoración.
</div>
`,
640: `
<div class="titulo">
<span class="numero">640</span>
<b>Oh Padre en los cielos</b>
</div>

<div class="versiculo">
Vosotros pues, oraréis así. Mateo 6:9
</div>

<div class="notas">Fa (Capo 1 - Mi) — Con ánimo</div>

<div class="estrofa">
1 Oh, Padre en los cielos, venimos a ti,<br>
<i>Pedimos que tu reino ya venga;</i><br>
Que tu voluntad sea hecha aquí.<br>
<i>Santificado sea tu nombre.</i>
</div>

<div class="estrofa">
2 El pan cotidiano hoy danos, Señor,<br>
<i>Pedimos que tu reino ya venga;</i><br>
Provee al hambriento por tu gran amor,<br>
<i>Santificado sea tu nombre.</i>
</div>

<div class="estrofa">
3 Perdón te pedimos por nuestro pecar,<br>
<i>Pedimos que tu reino ya venga;</i><br>
Debemos a otros así perdonar,<br>
<i>Santificado sea tu nombre.</i>
</div>

<div class="estrofa">
4 Del mal y el maligno protege también,<br>
<i>Pedimos que tu reino ya venga;</i><br>
A ti sea gloria por siempre. Amén.<br>
<i>Santificado sea tu nombre.</i>
</div>
`,
641: `
<div class="titulo">
<span class="numero">641</span>
<b>La oración del Señor</b>
</div>

<div class="estrofa">
Padre nuestro que estás en los cielos,<br>
santificado sea tu nombre.<br>
Venga tu reino. Hágase tu voluntad,<br>
como en el cielo, así también en la tierra.<br>
El pan nuestro de cada día, dánoslo hoy.<br>
Y perdónanos nuestras deudas,<br>
como también nosotros perdonamos<br>
a nuestros deudores.<br>
Y no nos metas en tentación, mas líbranos<br>
del mal; porque tuyo es el reino,<br>
y el poder, y la gloria,<br>
por todos los siglos. Amén.
</div>
`,
642: `
<div class="titulo">
<span class="numero">642</span>
<b>Apertura del culto</b>
</div>

<div class="estrofa">
Del SEÑOR es la tierra y todo lo que hay en ella; el mundo y los que en él habitan. ¿Quién es este Rey de la gloria? El SEÑOR de los ejércitos, él es el Rey de la gloria.
</div>

<div class="estrofa">
¡Venid, cantemos con gozo al Señor! Aclamemos con júbilo a la roca de nuestra salvación. Acerquémonos ante su presencia con acción de gracias; aclamémosle con salmos.
</div>

<div class="estrofa">
Venid, adoremos y postrémonos; doblemos la rodilla ante el SEÑOR nuestro Hacedor. Porque él es nuestro Dios, y nosotros el pueblo de su prado, y las ovejas de su mano.
</div>

<div class="estrofa">
Cantad alegres a Dios, habitantes de toda la tierra. Servid a Jehová con alegría; venid ante su presencia con regocijo.
</div>

<div class="estrofa">
Entrad por sus puertas con acción de gracias, y a sus atrios con alabanza. Dadle gracias, bendecid su nombre. Porque el SEÑOR es bueno; para siempre es su misericordia, y su fidelidad por todas las generaciones.
</div>

<div class="estrofa">
¡Aleluya! Alabad a Dios en su santuario; alabadle en su majestuoso firmamento. Alabadle por sus hechos poderosos; alabadle según la excelencia de su grandeza. Todo lo que respira alabe al SEÑOR. ¡Aleluya!
</div>

<div class="estrofa">
Venid a mí todos los que estáis trabajados y cansados, y yo os haré descansar. Llevad mi yugo sobre vosotros, y aprended de mí, que soy manso y humilde de corazón; y hallaréis descanso para vuestras almas, porque mi yugo es fácil, y ligera mi carga.
</div>

<div class="estrofa">
Perpetuamente cantaré las misericordias del Señor; con mi boca daré a conocer tu fidelidad de generación en generación. Diré: Para siempre será edificada la misericordia; en los mismos cielos establecerás tu fidelidad.
</div>

<div class="estrofa">
Bueno es alabar al Señor, cantar salmos a tu nombre, oh Altísimo. Bueno es anunciar por la mañana tu misericordia y tu verdad en las noches.
</div>
`,
643: `
<div class="titulo">
<span class="numero">643</span>
<b>El credo de los apóstoles</b>
</div>

<div class="estrofa">
Creo en Dios Padre Todopoderoso, Creador del cielo y la tierra;
</div>

<div class="estrofa">
Y en Jesucristo, su único Hijo, Señor nuestro; que fue concebido del Espíritu Santo, nació de la virgen María, padeció bajo el poder de Poncio Pilato; fue crucificado, muerto y sepultado; descendió a los infiernos; al tercer día resucitó de entre los muertos; subió al cielo, y está sentado a la diestra del Dios Padre Todopoderoso; y desde allí vendrá al fin del mundo a juzgar a los vivos y a los muertos.
</div>

<div class="estrofa">
Creo en el Espíritu Santo, la santa Iglesia universal, la comunión de los santos, el perdón de los pecados, la resurrección del cuerpo y la vida perdurable. Amén.
</div>
`,
644: `
<div class="titulo">
<span class="numero">644</span>
<b>Bendiciones Finales</b>
</div>

<div class="estrofa">
El SEÑOR te bendiga y te guarde; el SEÑOR haga resplandecer su rostro sobre ti, y tenga de ti misericordia; el SEÑOR alce sobre ti su rostro y te dé paz.
</div>

<div class="estrofa">
La gracia del Señor Jesucristo, el amor de Dios, y la comunión del Espíritu Santo sean con todos vosotros. Amén.
</div>

<div class="estrofa">
Y a Aquel que es poderoso para hacer todas las cosas mucho más abundantemente de lo que pedimos o entendemos, según el poder que actúa en nosotros, a él sea gloria en la iglesia en Cristo Jesús por todas las edades, por los siglos de los siglos. Amén.
</div>

<div class="estrofa">
La gracia de nuestro Señor Jesucristo sea con vosotros. Amén.
</div>

<div class="estrofa">
Y el mismo Jesucristo Señor nuestro, y Dios nuestro Padre, el cual nos amó y nos dio consolación eterna y buena esperanza por gracia, conforte vuestros corazones, y os confirme en toda buena palabra y obra.
</div>

<div class="estrofa">
Por tanto, al Rey de los siglos, inmortal, invisible, al único y sabio Dios, sea honor y gloria por los siglos de los siglos. Amén.
</div>

<div class="estrofa">
Y el Dios de paz que resucitó de los muertos a nuestro Señor Jesucristo, el gran pastor de las ovejas, por la sangre del pacto eterno, os haga aptos en toda obra buena para que hagáis su voluntad, haciendo él en vosotros lo que es agradable delante de él por Jesucristo, al cual sea la gloria por los siglos de los siglos. Amén.
</div>

<div class="estrofa">
Mas el Dios de toda gracia, que nos llamó a su gloria eterna en Jesucristo, después que hayáis padecido un poco de tiempo, él mismo os perfeccione, afirme, fortalezca y establezca. A él sea la gloria y el imperio por los siglos de los siglos. Amén.
</div>

<div class="estrofa">
Y a Aquel que es poderoso para guardaros sin caída, y presentaros sin mancha delante de su gloria con gran alegría, al único y sabio Dios, nuestro Salvador, sea gloria y majestad, imperio y potencia, ahora y por todos los siglos. Amén.
</div>
`,
645: `
<div class="titulo">
<span class="numero">645</span>
<b>Sagrado es el amor</b>
</div>

<div class="versiculo">
Porque todos vosotros sois uno en Cristo Jesús. Gálatas 3:28
</div>

<div class="notas">Fa (Capo 1 - Mi) — Con tranquilidad</div>

<div class="estrofa">
1 Sagrado es el amor que ha unido aquí,<br>
A los que un Dios y Salvador<br>
gozamos en servir.
</div>

<div class="estrofa">
2 A nuestro Padre Dios,<br>
rogamos con fervor,<br>
Alúmbrenos la misma luz,<br>
nos una el mismo amor.
</div>

<div class="estrofa">
3 Nos vamos a ausentar,<br>
mas nuestra firme unión<br>
Jamás podráse quebrantar<br>
por la separación.
</div>

<div class="estrofa">
4 Allá en la eternidad<br>
nos hemos de reunir,<br>
Y en dulce comunión y paz<br>
por siempre convivir.
</div>
`,
646: `
<div class="titulo">
<span class="numero">646</span>
<b>Después de haber tenido aquí</b>
</div>

<div class="versiculo">
Sed hacedores de la palabra, y no tan solamente oidores. Santiago 1:22
</div>

<div class="notas">Sol — Con calma</div>

<div class="estrofa">
1 Después, Señor, de haber tenido aquí<br>
De tu Palabra la bendita luz,<br>
A nuestro hogar condúcenos y allí<br>
De todos cuida, ¡buen Pastor Jesús!
</div>

<div class="estrofa">
2 En nuestras almas graba con poder<br>
Tu fiel Palabra, cada exhortación;<br>
Y que tu ley pudiendo comprender,<br>
Contigo estemos en mayor unión.
</div>

<div class="estrofa">
3 Danos tu paz, la senda al transitar<br>
De alegrías, pruebas o dolor,<br>
Y cuando al fin podamos descansar,<br>
Nos cubra el manto de tu inmenso amor.<br>
Amén
</div>
`,
647: `
<div class="titulo">
<span class="numero">647</span>
<b>El Señor te bendiga</b>
</div>

<div class="versiculo">
El SEÑOR te bendiga y te guarde. Números 6:24 (BLA)
</div>

<div class="notas">Do — Con resolución</div>

<div class="estrofa">
El Señor te bendiga y te guarde;<br>

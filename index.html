<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Celebremos SG Mauzi</title>
<meta name="description" content="Celebremos su Gloria: himnario digital Mauzi con letras y audios sincronizados.">

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Georgia", serif;
    background: linear-gradient(135deg, #0f2027, #1c3a4a);
    color: white;
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
}

/* ========== TÍTULO PRINCIPAL ========== */
.titulo-principal {
    text-align: center;
    padding: 15px 0 5px 0;
    font-size: 22px;
    font-style: italic;
    font-family: "Georgia", "Times New Roman", serif;
    color: #d4af37;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    letter-spacing: 1px;
    width: 100%;
}

.container {
    max-width: 100%;
    margin: auto;
    padding: 10px 0 80px 0;
    width: 100%;
}

/* ========== BOTÓN TEMA CLARO/OSCURO ========== */
.tema-btn {
    display: block;
    margin: 8px auto 12px auto;
    padding: 10px 24px;
    background: linear-gradient(145deg, #8B6914, #A67C00);
    color: white;
    border: none;
    border-radius: 25px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
    font-family: "Georgia", serif;
}

.tema-btn:hover {
    background: linear-gradient(145deg, #A67C00, #B8860B);
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
}

.tema-btn:active {
    transform: scale(0.95);
}

.display {
    background: black;
    padding: 18px;
    font-size: 28px;
    text-align: center;
    border-radius: 12px;
    margin: 0 0 12px 0;
    font-weight: bold;
    width: 100%;
}

.keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    padding: 0 12px;
    width: 100%;
}

.key {
    background: linear-gradient(145deg, #8B6914, #A67C00);
    padding: 22px;
    border-radius: 14px;
    font-size: 24px;
    text-align: center;
    cursor: pointer;
    color: white;
    user-select: none;
    transition: transform 0.1s, box-shadow 0.2s;
    font-weight: bold;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}

.key:hover {
    background: linear-gradient(145deg, #A67C00, #B8860B);
    box-shadow: 0 5px 12px rgba(0,0,0,0.4);
}

.key:active {
    transform: scale(0.95);
}

.key.eliminar {
    background: linear-gradient(145deg, #8B0000, #B22222);
    font-size: 16px;
}

.key.eliminar:hover {
    background: linear-gradient(145deg, #B22222, #DC143C);
}

/* ========== BOTÓN REGRESAR FLOTANTE ========== */
.back-btn {
    display: none;
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 1000;
    padding: 12px 20px;
    background: rgba(34, 34, 34, 0.9);
    backdrop-filter: blur(4px);
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    color: white;
    font-size: 16px;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

/* ========== BOTONES DE ZOOM FLOTANTES ========== */
.zoom-controls {
    display: none;
    position: fixed;
    bottom: 20px;
    right: 15px;
    z-index: 1000;
    flex-direction: column;
    gap: 10px;
}

.zoom-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(4px);
    color: white;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
    border: 1px solid rgba(255,255,255,0.1);
}

.zoom-btn.azul {
    background: transparent;
    backdrop-filter: none;
    border: none;
    box-shadow: none;
    color: #4da6ff;
    font-size: 32px;
    text-shadow: 0 0 8px rgba(77, 166, 255, 0.5);
}

.zoom-btn.azul:hover {
    background: transparent;
    color: #80c5ff;
    text-shadow: 0 0 12px rgba(77, 166, 255, 0.8);
}

.zoom-btn:active {
    transform: scale(0.9);
}

.zoom-controls.active .zoom-btn {
    background: rgba(255, 255, 255, 0.4);
    border-color: rgba(255,255,255,0.3);
}

.zoom-controls.active .zoom-btn.azul {
    background: transparent;
    border: none;
}

/* ========== REPRODUCTOR DE AUDIO PRO (SOLO BOTÓN FLOTANTE) ========== */
.player-container {
    display: none;
    position: fixed;
    top: 15px;
    right: 15px; /* Se queda fijo arriba a la derecha */
    z-index: 1000;
}

.play-btn {
    background: linear-gradient(145deg, #d4af37, #A67C00);
    border: none;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    color: white;
    font-size: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(212, 175, 55, 0.4);
    transition: transform 0.1s ease;
}

.play-btn:active {
    transform: scale(0.92);
}

.tema-claro-player .play-btn {
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

/* ========== ÁREA DEL HIMNO ========== */
.himno {
    margin-top: 20px;
    background: white;
    color: black;
    padding: 18px;
    text-align: center;
    line-height: 1.6;
    display: none;
    width: 100%;
    border-radius: 0;
    margin-left: 0;
    margin-right: 0;
}

/* TEMA OSCURO DEL HIMNO */
.himno.tema-oscuro {
    background: #1a1a2e;
    color: #f0f0f0;
}

.himno.tema-oscuro .titulo {
    background: #0f0f23;
    color: #d4af37;
}

.himno.tema-oscuro .notas {
    color: #aaa;
}

.himno.tema-oscuro .coro {
    border-top: 1px solid #444;
    border-bottom: 1px solid #444;
    color: #d4af37;
}

.titulo {
    background: black;
    color: white;
    padding: 12px;
    font-size: 24px;
    border-radius: 8px;
    position: relative;
    margin-bottom: 8px;
}

.numero {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
}

.notas {
    text-align: right;
    font-size: 14px;
    margin: 6px 0 10px 0;
    color: #444;
}

.estrofa {
    margin: 10px 0;
    font-size: 18px;
    transition: font-size 0.2s ease;
}

.coro {
    margin: 14px 0;
    padding: 6px;
    font-style: italic;
    font-weight: 600;
    border-top: 1px solid #ccc;
    border-bottom: 1px solid #ccc;
    font-size: 18px;
    transition: font-size 0.2s ease;
}

.versiculo {
    font-size: 14px;
    margin: 10px 0;
    transition: font-size 0.2s ease;
}

/* ========== INSTALACIÓN DE LA APLICACIÓN ========== */
.install-area {
    display: flex;
    justify-content: center;
    padding: 8px 12px 4px;
}

.install-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 150px;
    padding: 11px 22px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 25px;
    background: linear-gradient(145deg, #d4af37, #9b7207);
    color: #fff;
    font-family: "Georgia", serif;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    transition: transform .15s ease, box-shadow .2s ease;
}

.install-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
}

.install-btn:active { transform: scale(.96); }

.install-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 5000;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(5px);
}

.install-modal.visible { display: flex; }

.install-card {
    width: min(430px, 100%);
    max-height: 88vh;
    overflow-y: auto;
    padding: 25px 22px 20px;
    border: 1px solid rgba(212,175,55,.6);
    border-radius: 18px;
    background: linear-gradient(155deg, #173746, #0d2029);
    color: white;
    box-shadow: 0 18px 50px rgba(0,0,0,.55);
}

.install-card h2 {
    margin-bottom: 12px;
    color: #f1cc55;
    font-size: 22px;
    text-align: center;
}

.install-card p, .install-card li {
    font-family: Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
}

.install-card ol { margin: 14px 0 18px 24px; }
.install-card li { margin-bottom: 9px; padding-left: 3px; }

.install-close {
    display: block;
    width: 100%;
    padding: 11px 16px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(145deg, #d4af37, #9b7207);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.install-toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    z-index: 6000;
    width: max-content;
    max-width: calc(100% - 32px);
    padding: 12px 18px;
    border-radius: 12px;
    background: rgba(12,31,40,.96);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.45);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 20px);
    transition: opacity .25s ease, transform .25s ease;
}

.install-toast.visible {
    opacity: 1;
    transform: translate(-50%, 0);
}

/* ========== BUSCADOR POR NOMBRE ========== */
.search-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: min(520px, calc(100% - 24px));
    margin: 2px auto 14px;
}

.search-option-btn {
    min-height: 46px;
    padding: 10px 12px;
    border: 1px solid rgba(212,175,55,.5);
    border-radius: 13px;
    background: rgba(255,255,255,.09);
    color: #fff;
    font-family: "Georgia", serif;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,.22);
    transition: transform .15s ease, background .2s ease;
}

.search-option-btn.active,
.search-option-btn:hover {
    background: linear-gradient(145deg, #d4af37, #9b7207);
}

.search-option-btn:active { transform: scale(.97); }

.hymn-search-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 5200;
    align-items: center;
    justify-content: center;
    padding: 14px;
    background: rgba(0,0,0,.78);
    backdrop-filter: blur(5px);
}

.hymn-search-modal.visible { display: flex; }

.hymn-search-card {
    display: flex;
    flex-direction: column;
    width: min(620px, 100%);
    max-height: 92vh;
    overflow: hidden;
    border: 1px solid rgba(212,175,55,.65);
    border-radius: 19px;
    background: linear-gradient(155deg, #173746, #0b1d26);
    box-shadow: 0 20px 55px rgba(0,0,0,.6);
}

.hymn-search-header {
    position: relative;
    padding: 20px 54px 12px 20px;
}

.hymn-search-header h2 {
    color: #f1cc55;
    font-size: 22px;
    line-height: 1.25;
}

.hymn-search-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 50%;
    background: rgba(255,255,255,.1);
    color: white;
    font-size: 25px;
    line-height: 1;
    cursor: pointer;
}

.hymn-search-tools { padding: 0 16px 12px; }

.hymn-search-input {
    width: 100%;
    height: 50px;
    padding: 0 15px;
    border: 2px solid rgba(212,175,55,.7);
    border-radius: 13px;
    outline: none;
    background: #fff;
    color: #17232a;
    font-family: Arial, sans-serif;
    font-size: 17px;
}

.hymn-search-input:focus {
    border-color: #ffd95b;
    box-shadow: 0 0 0 3px rgba(212,175,55,.2);
}

.hymn-search-count {
    margin-top: 8px;
    color: #d6e2e8;
    font-family: Arial, sans-serif;
    font-size: 13px;
}

.hymn-list {
    flex: 1;
    min-height: 170px;
    max-height: 62vh;
    overflow-y: auto;
    padding: 0 12px 16px;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
}

.hymn-list-item {
    display: grid;
    grid-template-columns: 52px 1fr;
    align-items: center;
    gap: 11px;
    width: 100%;
    margin: 7px 0;
    padding: 10px 12px 10px 8px;
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 12px;
    background: rgba(255,255,255,.075);
    color: white;
    text-align: left;
    cursor: pointer;
}

.hymn-list-item:hover,
.hymn-list-item:focus-visible {
    background: rgba(212,175,55,.2);
    border-color: rgba(212,175,55,.7);
    outline: none;
}

.hymn-number-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 38px;
    border-radius: 10px;
    background: linear-gradient(145deg, #d4af37, #9b7207);
    color: #fff;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
}

.hymn-list-title {
    font-family: "Georgia", serif;
    font-size: 16px;
    line-height: 1.28;
}

.hymn-no-results {
    padding: 32px 15px;
    color: #d6e2e8;
    font-family: Arial, sans-serif;
    font-size: 16px;
    text-align: center;
}

@media (max-width: 390px) {
    .search-option-btn { font-size: 14px; padding-inline: 7px; }
    .hymn-search-modal { padding: 8px; }
    .hymn-search-card { max-height: 95vh; }
}
</style>
<base target="_blank">

<body>

<div class="titulo-principal">Celebremos SG Mauzi</div>

<div class="install-area" id="installArea">
    <button class="install-btn" id="installBtn" type="button" onclick="instalarApp()" aria-label="Instalar Celebremos SG Mauzi">
        <span aria-hidden="true">⬇</span> Instalar
    </button>
</div>

<div class="container">

    <button class="tema-btn" id="temaBtn" onclick="cambiarTema()">🌙 Modo Oscuro</button>

    <div class="search-options" id="searchOptions" aria-label="Forma de buscar himnos">
        <button class="search-option-btn active" id="numberSearchBtn" type="button" onclick="activarBusquedaNumero()">🔢 Buscar por número</button>
        <button class="search-option-btn" id="nameSearchBtn" type="button" onclick="abrirBusquedaNombre()">🔎 Buscar por nombre</button>
    </div>

    <div class="display" id="display">Ingrese número</div>

    <div class="back-btn" id="backBtn" onclick="volver()">← Regresar</div>

    <div class="zoom-controls" id="zoomControls">
        <button class="zoom-btn azul" id="zoomIn" onclick="cambiarZoom(1)" title="Agrandar letra">+</button>
        <button class="zoom-btn azul" id="zoomOut" onclick="cambiarZoom(-1)" title="Achicar letra">−</button>
    </div>

    <div class="keypad" id="keypad">
        <div class="key" onclick="add(1)">1</div>
        <div class="key" onclick="add(2)">2</div>
        <div class="key" onclick="add(3)">3</div>
        <div class="key" onclick="add(4)">4</div>
        <div class="key" onclick="add(5)">5</div>
        <div class="key" onclick="add(6)">6</div>
        <div class="key" onclick="add(7)">7</div>
        <div class="key" onclick="add(8)">8</div>
        <div class="key" onclick="add(9)">9</div>
        <div class="key eliminar" onclick="clearDisplay()">Eliminar</div>
        <div class="key" onclick="add(0)">0</div>
        <div class="key" onclick="buscar()">OK</div>
    </div>

    <div class="player-container" id="playerContainer">
        <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
    </div>

    <div class="himno" id="himno"></div>

</div>

<div class="install-modal" id="installModal" role="dialog" aria-modal="true" aria-labelledby="installModalTitle" onclick="cerrarGuiaInstalacion(event)">
    <div class="install-card">
        <h2 id="installModalTitle">Instalar aplicación</h2>
        <div id="installModalContent"></div>
        <button class="install-close" type="button" onclick="cerrarGuiaInstalacion()">Entendido</button>
    </div>
</div>

<div class="install-toast" id="installToast" role="status" aria-live="polite"></div>

<div class="hymn-search-modal" id="hymnSearchModal" role="dialog" aria-modal="true" aria-labelledby="hymnSearchTitle" onclick="cerrarBusquedaNombre(event)">
    <div class="hymn-search-card">
        <div class="hymn-search-header">
            <h2 id="hymnSearchTitle">Buscar himno por nombre</h2>
            <button class="hymn-search-close" type="button" onclick="cerrarBusquedaNombre()" aria-label="Cerrar búsqueda">×</button>
        </div>
        <div class="hymn-search-tools">
            <input class="hymn-search-input" id="hymnSearchInput" type="search" inputmode="search" autocomplete="off" placeholder="Escriba el título del himno…" oninput="filtrarListaHimnos()">
            <div class="hymn-search-count" id="hymnSearchCount" aria-live="polite"></div>
        </div>
        <div class="hymn-list" id="hymnList"></div>
    </div>
</div>

<script>

// ========== INSTALACIÓN PWA (ANDROID, IPHONE Y COMPUTADORA) ==========
let eventoInstalacion = null;

function estaInstalada() {
    return window.matchMedia('(display-mode: standalone)').matches ||
           window.matchMedia('(display-mode: fullscreen)').matches ||
           window.navigator.standalone === true;
}

function esIOS() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
           (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function actualizarEstadoInstalacion() {
    const area = document.getElementById('installArea');
    if (!area) return;
    const himnoVisible = document.getElementById('himno') &&
                         document.getElementById('himno').style.display === 'block';
    area.style.display = (estaInstalada() || himnoVisible) ? 'none' : 'flex';
}

window.addEventListener('beforeinstallprompt', (event) => {
    event.preventDefault();
    eventoInstalacion = event;
    actualizarEstadoInstalacion();
});

window.addEventListener('appinstalled', () => {
    eventoInstalacion = null;
    actualizarEstadoInstalacion();
    mostrarAviso('Celebremos SG Mauzi se instaló correctamente.');
});

async function instalarApp() {
    if (estaInstalada()) {
        mostrarAviso('La aplicación ya está instalada.');
        actualizarEstadoInstalacion();
        return;
    }

    if (esIOS()) {
        abrirGuiaInstalacion(
            'Instalar en iPhone o iPad',
            '<p>Apple requiere estos pasos una sola vez:</p>' +
            '<ol><li>Abra esta página con <strong>Safari</strong>.</li>' +
            '<li>Toque el botón <strong>Compartir</strong> (cuadro con flecha hacia arriba).</li>' +
            '<li>Seleccione <strong>Añadir a pantalla de inicio</strong>.</li>' +
            '<li>Toque <strong>Añadir</strong>.</li></ol>' +
            '<p>Después podrá abrirla como una aplicación, sin la barra de direcciones.</p>'
        );
        return;
    }

    if (eventoInstalacion) {
        const promptGuardado = eventoInstalacion;
        eventoInstalacion = null;
        await promptGuardado.prompt();
        const resultado = await promptGuardado.userChoice;
        if (resultado.outcome === 'accepted') {
            mostrarAviso('Instalación aceptada.');
        } else {
            mostrarAviso('Puede instalarla más adelante con este mismo botón.');
        }
        return;
    }

    if (!window.isSecureContext) {
        abrirGuiaInstalacion(
            'Falta publicar la aplicación',
            '<p>La instalación se habilitará cuando esta carpeta esté publicada en un sitio con conexión segura <strong>HTTPS</strong>.</p>'
        );
        return;
    }

    abrirGuiaInstalacion(
        'Preparando instalación',
        '<p>Use <strong>Chrome</strong>, <strong>Edge</strong> o <strong>Samsung Internet</strong>. Espere unos segundos y vuelva a tocar el botón <strong>Instalar</strong>; aparecerá la ventana de instalación del teléfono.</p>'
    );
}

function abrirGuiaInstalacion(titulo, contenido) {
    document.getElementById('installModalTitle').textContent = titulo;
    document.getElementById('installModalContent').innerHTML = contenido;
    document.getElementById('installModal').classList.add('visible');
    document.body.style.overflow = 'hidden';
}

function cerrarGuiaInstalacion(event) {
    if (event && event.target !== document.getElementById('installModal')) return;
    document.getElementById('installModal').classList.remove('visible');
    document.body.style.overflow = '';
}

let temporizadorAviso;
function mostrarAviso(mensaje) {
    const aviso = document.getElementById('installToast');
    aviso.textContent = mensaje;
    aviso.classList.add('visible');
    clearTimeout(temporizadorAviso);
    temporizadorAviso = setTimeout(() => aviso.classList.remove('visible'), 3200);
}

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {
            console.warn('No se pudo registrar el modo instalable.');
        });
    });
}

window.addEventListener('DOMContentLoaded', actualizarEstadoInstalacion);
window.matchMedia('(display-mode: standalone)').addEventListener?.('change', actualizarEstadoInstalacion);

// ========== BÚSQUEDA POR NOMBRE Y LISTA COMPLETA ==========
let indiceHimnos = null;

function normalizarBusqueda(texto) {
    return String(texto || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .trim();
}

function obtenerTituloHimno(numero) {
    const plantilla = document.createElement('template');
    plantilla.innerHTML = himnos[numero];
    const tituloNegrita = plantilla.content.querySelector('.titulo b, .titulo strong');
    if (tituloNegrita && tituloNegrita.textContent.trim()) {
        return tituloNegrita.textContent.trim();
    }

    const tituloGeneral = plantilla.content.querySelector('.titulo');
    if (tituloGeneral) {
        const copia = tituloGeneral.cloneNode(true);
        copia.querySelectorAll('.numero').forEach(elemento => elemento.remove());
        const texto = copia.textContent.trim();
        if (texto) return texto;
    }

    return 'Himno ' + numero;
}

function prepararIndiceHimnos() {
    if (indiceHimnos) return;
    indiceHimnos = Object.keys(himnos)
        .map(Number)
        .filter(Number.isFinite)
        .sort((a, b) => a - b)
        .map(numero => {
            const titulo = obtenerTituloHimno(numero);
            return {
                numero,
                titulo,
                busqueda: normalizarBusqueda(numero + ' ' + titulo)
            };
        });
}

function activarBusquedaNumero() {
    document.getElementById('numberSearchBtn').classList.add('active');
    document.getElementById('nameSearchBtn').classList.remove('active');
    if (document.getElementById('hymnSearchModal').classList.contains('visible')) {
        cerrarBusquedaNombre();
    }
}

function abrirBusquedaNombre() {
    prepararIndiceHimnos();
    document.getElementById('numberSearchBtn').classList.remove('active');
    document.getElementById('nameSearchBtn').classList.add('active');
    const entrada = document.getElementById('hymnSearchInput');
    entrada.value = '';
    renderizarListaHimnos(indiceHimnos);
    document.getElementById('hymnSearchModal').classList.add('visible');
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(() => entrada.focus({ preventScroll: true }));
}

function cerrarBusquedaNombre(event) {
    const modal = document.getElementById('hymnSearchModal');
    if (event && event.target !== modal) return;
    modal.classList.remove('visible');
    document.body.style.overflow = '';
    document.getElementById('nameSearchBtn').classList.remove('active');
    document.getElementById('numberSearchBtn').classList.add('active');
}

function filtrarListaHimnos() {
    prepararIndiceHimnos();
    const consulta = normalizarBusqueda(document.getElementById('hymnSearchInput').value);
    const palabras = consulta.split(/\s+/).filter(Boolean);
    const resultados = palabras.length === 0
        ? indiceHimnos
        : indiceHimnos.filter(himno => palabras.every(palabra => himno.busqueda.includes(palabra)));
    renderizarListaHimnos(resultados);
}

function renderizarListaHimnos(resultados) {
    const lista = document.getElementById('hymnList');
    lista.replaceChildren();
    document.getElementById('hymnSearchCount').textContent =
        resultados.length + (resultados.length === 1 ? ' himno encontrado' : ' himnos encontrados');

    if (resultados.length === 0) {
        const vacio = document.createElement('div');
        vacio.className = 'hymn-no-results';
        vacio.textContent = 'No se encontró ningún himno con ese título.';
        lista.appendChild(vacio);
        return;
    }

    const fragmento = document.createDocumentFragment();
    resultados.forEach(himno => {
        const boton = document.createElement('button');
        boton.type = 'button';
        boton.className = 'hymn-list-item';
        boton.setAttribute('aria-label', 'Abrir himno ' + himno.numero + ': ' + himno.titulo);
        boton.addEventListener('click', () => seleccionarHimnoPorNombre(himno.numero));

        const numero = document.createElement('span');
        numero.className = 'hymn-number-badge';
        numero.textContent = himno.numero;

        const titulo = document.createElement('span');
        titulo.className = 'hymn-list-title';
        titulo.textContent = himno.titulo;

        boton.append(numero, titulo);
        fragmento.appendChild(boton);
    });
    lista.appendChild(fragmento);
    lista.scrollTop = 0;
}

function seleccionarHimnoPorNombre(numeroHimno) {
    num = String(numeroHimno);
    cerrarBusquedaNombre();
    buscar();
}

document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
        if (document.getElementById('hymnSearchModal').classList.contains('visible')) {
            cerrarBusquedaNombre();
        } else if (document.getElementById('installModal').classList.contains('visible')) {
            cerrarGuiaInstalacion();
        }
    }
});

let num = "";
let tamanoBase = 18;
let tamanoActual = 18;
let temaOscuro = false;
let backPressCount = 0;
let backPressTimer = null;

// Variables del reproductor
let audio = new Audio();

function add(n){
    num += n;
    document.getElementById("display").innerText = num;
}

function clearDisplay(){
    num = "";
    document.getElementById("display").innerText = "Ingrese número";
}

function buscar(){
    if(himnos[num]){
        document.getElementById("himno").innerHTML = himnos[num];
        document.getElementById("keypad").style.display = "none";
        document.getElementById("display").style.display = "none";
        document.getElementById("backBtn").style.display = "block";
        document.getElementById("himno").style.display = "block";
        document.getElementById("zoomControls").style.display = "flex";
        document.getElementById("temaBtn").style.display = "none";
        document.getElementById("installArea").style.display = "none";
        document.getElementById("searchOptions").style.display = "none";

        // Inicializar Audio si existe enlace
        const playerContainer = document.getElementById("playerContainer");
        if(enlacesAudio[num]) {
            playerContainer.style.display = "block";
            audio.src = enlacesAudio[num];
            audio.load();
            resetPlayerUI();
        } else {
            playerContainer.style.display = "none";
            audio.pause();
        }

        // Resetear zoom al buscar nuevo himno
        tamanoActual = tamanoBase;
        aplicarZoom();
        aplicarTemaHimno();
    }
}

function volver(){
    // Detener audio al regresar
    audio.pause();
    document.getElementById("playerContainer").style.display = "none";

    document.getElementById("keypad").style.display = "grid";
    document.getElementById("display").style.display = "block";
    document.getElementById("backBtn").style.display = "none";
    document.getElementById("himno").style.display = "none";
    document.getElementById("zoomControls").style.display = "none";
    document.getElementById("temaBtn").style.display = "block";
    document.getElementById("searchOptions").style.display = "grid";
    actualizarEstadoInstalacion();
    clearDisplay();
}

// ========== LÓGICA DEL REPRODUCTOR AUDIO ==========
function togglePlay() {
    const playBtn = document.getElementById("playBtn");
    if (audio.paused) {
        audio.play();
        playBtn.innerText = "⏸";
    } else {
        audio.pause();
        playBtn.innerText = "▶";
    }
}

function resetPlayerUI() {
    document.getElementById("playBtn").innerText = "▶";
}

audio.addEventListener('ended', () => {
    resetPlayerUI();
});

// ========== BOTÓN ATRÁS DEL CELULAR ==========
window.addEventListener("popstate", function(e) {
    const buscadorVisible = document.getElementById("hymnSearchModal").classList.contains("visible");
    const instalacionVisible = document.getElementById("installModal").classList.contains("visible");
    const himnoVisible = document.getElementById("himno").style.display === "block";

    if(buscadorVisible){
        cerrarBusquedaNombre();
        history.pushState(null, null, window.location.href);
    } else if(instalacionVisible){
        cerrarGuiaInstalacion();
        history.pushState(null, null, window.location.href);
    } else if(himnoVisible){
        volver();
        history.pushState(null, null, window.location.href);
    } else {
        backPressCount++;

        if(backPressCount === 1){
            backPressTimer = setTimeout(function(){
                backPressCount = 0;
            }, 2000);
            history.pushState(null, null, window.location.href);
        } else if(backPressCount >= 2){
            clearTimeout(backPressTimer);
            backPressCount = 0;
            history.back();
        }
    }
});

history.pushState(null, null, window.location.href);

// ========== FUNCIONES DE TEMA ==========
function cambiarTema(){
    temaOscuro = !temaOscuro;
    const btn = document.getElementById("temaBtn");

    if(temaOscuro){
        btn.innerText = "☀️ Modo Claro";
    } else {
        btn.innerText = "🌙 Modo Oscuro";
    }
    const himno = document.getElementById("himno");
    if(himno.style.display === "block"){
        aplicarTemaHimno();
    }
}

function aplicarTemaHimno(){
    const himno = document.getElementById("himno");
    const reproductor = document.getElementById("playerContainer");

    if(temaOscuro){
        himno.classList.add("tema-oscuro");
        reproductor.classList.remove("tema-claro-player");
    } else {
        himno.classList.remove("tema-oscuro");
        reproductor.classList.add("tema-claro-player");
    }
}

// ========== FUNCIONES DE ZOOM ==========
function cambiarZoom(direccion){
    tamanoActual += direccion * 2;
    if(tamanoActual < 12) tamanoActual = 12;
    if(tamanoActual > 40) tamanoActual = 40;
    aplicarZoom();

    document.getElementById("zoomControls").classList.add("active");
    setTimeout(() => {
        document.getElementById("zoomControls").classList.remove("active");
    }, 1500);
}

function aplicarZoom(){
    const estrofas = document.querySelectorAll(".estrofa, .lectura, .autor, .nota-autor, .nota");
    const coros = document.querySelectorAll(".coro");
    const versiculos = document.querySelectorAll(".versiculo, .referencia, .cita");

    estrofas.forEach(el => el.style.fontSize = tamanoActual + "px");
    coros.forEach(el => el.style.fontSize = tamanoActual + "px");
    versiculos.forEach(el => el.style.fontSize = (tamanoActual - 4) + "px");
}

28: `
<div class="titulo">
<span class="numero">28</span>
<b>Himno al Padre</b>
</div>

<div class="versiculo">
Bendito sea el Dios Altísimo. Génesis 14:20
</div>

<div class="notas">Mi m — Con ánimo</div>

<div class="estrofa">
1 Cantadle a una voz, Omnipotente Dios,<br>
Su nombre es Elohim, el trino Creador;<br>
Jehová es el gran “YO SOY”,<br>
y eterno es El Olam,<br>
Postraos todos a sus pies,<br>
es nuestro Redentor.
</div>

<div class="estrofa">
2 Cantadle con amor, altísimo Señor,<br>
Su nombre es Adonai, del mundo dueño y rey;<br>
El Dios de bendición, nos cuida El Shaddai;<br>
Oh, alabadle sin temor, ovejas de su grey.
</div>

<div class="estrofa">
3 Cantadle con fervor, supremo y fiel pastor,<br>
Su nombre es El Elyon, el gran gobernador;<br>
El sempiterno Ser, nos guía con amor,<br>
Load a Jehová Jireh, de Sion sustentador.
</div>

<div class="estrofa">
4 Dad cánticos a Dios el Padre, en alta voz,<br>
Y al Hijo el Salvador mil salmos entonad;<br>
Con himnos ensalzad al Santo Espíritu;<br>
Tres veces santo, el trino Dios,<br>
servidle con lealtad.
</div>
`,
29: `
<div class="titulo">
<span class="numero">29</span>
<b>Bendeciré al Señor</b>
</div>

<div class="estrofa">
Bendeciré al Señor con toda mi alma.<br><br>

<b>¡Cuán grande eres, Señor y Dios mío!</b><br>
Te has vestido de gloria y esplendor;<br>
Te has envuelto en un manto de luz.<br><br>

Tú extendiste el cielo como un velo.<br><br>

<b>Conviertes las nubes en tu carro;</b><br>
viajas sobre las alas del viento.<br>
Los vientos son tus mensajeros y<br>
las llamas de fuego tus servidores.<br><br>

<b>¡Cuántas cosas has hecho, Señor!</b><br>
Todas las hiciste con sabiduría;<br>
la tierra está llena de todo lo que has creado.<br><br>

<b>La gloria del Señor es eterna.</b> El Señor se alegra en su creación.<br><br>

Mientras yo exista y tenga vida<br>
cantaré himnos al Señor mi Dios.
</div>

<div class="versiculo">
Salmo 104: 1-3b, 4, 24, 31, 33 (DHH)
</div>
`,
30: `
<div class="titulo">
<span class="numero">30</span>
<b>Mi corazón te adora</b>
</div>

<div class="estrofa">
En la voz de los raudos huracanes,<br>
En el plácido arroyo, en el torrente,<br>
En el fuego, en la llama, en los volcanes:<br>
Allí, gran Dios, mi corazón te siente.
</div>

<div class="estrofa">
En los vergeles del florido mayo,<br>
En los dulces acordes de la lira,<br>
En la lluvia, en el trueno y en el rayo:<br>
Allí, gran Dios, mi corazón te admira.
</div>

<div class="estrofa">
En el aroma que a los cielos sube,<br>
En el árbol que erguido se levanta,<br>
En la sombra, en el astro y en la nube:<br>
Allí, gran Dios, mi corazón te canta.
</div>

<div class="estrofa">
En los trémulos rayos de la lumbre,<br>
En el ósculo suave de la aurora,<br>
En la hondura, en el llano y en la cumbre:<br>
Allí, gran Dios, mi corazón te adora.
</div>
`,
 31: `
<div class="titulo">
<span class="numero">31</span>
<b>La Creación</b>
</div>

<div class="versiculo">
En el principio creó Dios los cielos y la tierra. Génesis 1:1
</div>

<div class="notas">Mi m — Con admiración</div>

<div class="estrofa">
1 Dios ha hecho todo lo que el ojo ve,<br>
Cada cosa de este mundo terrenal.<br>
Todo árbol y las plantas son de él,<br>
Las estrellas y el manto celestial.
</div>

<div class="coro" style="font-style: italic;">
¡Sea ya la luz!” ordenó Jehová<br>
Con su fuerte voz, y la luz fue ya.<br>
Hoy el buen Jesús, nuestro Redentor,<br>
Brinda al mundo luz con excelso amor.
</div>

<div class="estrofa">
2 A su imagen Dios formó al hombre Adán;<br>
Luego hizo una mujer tomada de él;<br>
Y los colocó en el Jardín de Edén,<br>
Donde habían de seguirle siempre fiel.
</div>

<div class="coro" style="font-style: italic;">
¡Sea ya la luz!” ordenó Jehová<br>
Con su fuerte voz, y la luz fue ya.<br>
Hoy el buen Jesús, nuestro Redentor,<br>
Brinda al mundo luz con excelso amor.
</div>

<div class="estrofa">
3 El perfecto gozo había en el Edén;<br>
Ellos se gozaban al andar con Dios.<br>
Comunión completa había allá también<br>
Al oír de Jehová la tierna voz.
</div>

<div class="coro" style="font-style: italic;">
¡Sea ya la luz!” ordenó Jehová<br>
Con su fuerte voz, y la luz fue ya.<br>
Hoy el buen Jesús, nuestro Redentor,<br>
Brinda al mundo luz con excelso amor.
</div>
`,

41: `
<div class="titulo">
<span class="numero">41</span>
<b>Anunciemos su poder</b>
</div>

<div class="estrofa">
¿Quién midió las aguas con el hueco de su mano y los cielos con su palmo, con tres dedos juntó el polvo de la tierra, y pesó los montes con balanza y con pesas los collados?
</div>

<div class="estrofa">
He aquí que las naciones le son como la gota de agua que cae del cubo, y como menudo polvo en las balanzas le son estimadas; he aquí que hace desaparecer las islas como polvo.
</div>

<div class="estrofa">
Levantad en alto vuestros ojos, y mirad quién creó estas cosas; él saca y cuenta su ejército;
</div>

<div class="estrofa">
A todas llama por sus nombres; ninguna faltará; tal es la grandeza de su fuerza, y el poder de su dominio.
</div>

<div class="estrofa">
¿No has sabido, no has oído que el Dios eterno es Jehová, el cual creó los confines de la tierra?
</div>

<div class="estrofa">
No desfallece, ni se fatiga con cansancio, y su entendimiento no hay quien lo alcance.
</div>

<div class="estrofa">
Oh Jehová, Dios de los ejércitos, ¿quién como tú? Poderoso eres, Jehová, y tu fidelidad te rodea.
</div>

<div class="estrofa">
Tú tienes dominio sobre la braveza del mar; cuando se levantan sus ondas, tú las sosiegas.
</div>

<div class="estrofa">
Tuyos son los cielos, tuya también la tierra; el mundo y su plenitud, tú lo fundaste.
</div>

<div class="estrofa">
Tuyo es el brazo potente; fuerte es tu mano, exaltada tu diestra.
</div>

<div class="estrofa">
Justicia y juicio son el cimiento de tu trono; misericordia y verdad van delante de tu rostro.
</div>

<div class="estrofa">
Bienaventurado el pueblo que sabe aclamarte; andará, oh Jehová, a la luz de tu rostro.
</div>

<div class="referencia">
Isaías 40:12, 15, 26, 28; Salmo 89:8, 9, 11, 13–15 (RVR)
</div>
`,

45: `

</div>
`,

57: `

gran papel, y cada hombre un escritor,<br>
Y cada hoja un pincel,<br>
Nunca podrían describir el gran amor de Dios<br>
Que al hombre pudo redimir de su pecado atroz.
</div>

<div class="estrofa">
3. Y cuando el tiempo pasará con cada reino<br>
mundanal, y cada reino caerá con cada<br>
trama y plan carnal,<br>
El gran amor del Redentor por siempre durará;<br>
La gran canción de salvación su pueblo cantará.
</div>
`,
64: `
<div class="titulo">
<span class="numero">64</span>
<b>Dios es amor</b>
</div>

<div class="versiculo">
En su amor y en su clemencia los redimió. Isaías 63:9
</div>

<div class="notas">Sol — Con alegría</div>

<div class="estrofa">
¡Dios es amor! ¡Dios es amor!<br>
La Biblia nos dice el mensaje sublime<br>
que Dios es amor, ¡Oh sí!<br>
¡Dios es amor! ¡Dios es amor!<br>
Los ángeles cantan,<br>
los hombres proclaman<br>
Que ¡Dios es amor!
</div>
`,
65: `
<div class="titulo">
<span class="numero">65</span>
<b>Qué maravilla es</b>
</div>

<div class="versiculo">
No hay Dios semejante a ti en el cielo ni en la tierra. 2 Crónicas 6:14
</div>

<div class="notas">Si♭ (Capo 3 - Sol) — Con admiración</div>

<div class="estrofa">
1. Cuán hermosa es la luz del ocaso,<br>
Y precioso es el amanecer,<br>
Pero más glorioso es el gran amor<br>
Que el Señor derramó en mi ser.
</div>

<div class="coro" style="font-style: italic;">
¡Qué maravilla es,<br>
qué maravilla es<br>
Que el Señor me ama a mí!<br>
➤ ¡Qué maravilla es,<br>
qué maravilla es<br>
Que el Señor me ama a mí!
</div>

<div class="estrofa">
2. Admirable es la siega abundante,<br>
Las estrellas, la luna y el sol,<br>
Pero más glorioso es el gran amor<br>
Que me da nueva vida y perdón.
</div>
`,
66: `
<div class="titulo">
<span class="numero">66</span>
<b>REFLEXION:</b><br>
Mi Dios y Padre Celestial
</div>

<div class="estrofa">
Dios mío, estoy maravillado ante tu grandeza.<br>
Eres el Creador que esparciste en el espacio vacío<br>
los miles de millones de estrellas y que llamas<br>
a cada una por nombre.
</div>

<div class="estrofa">
Tú formaste nuestro bello mundo con sus<br>
majestuosas montañas y vastos mares.<br>
Diseñaste la fragante rosa y diste melodías<br>
al ruiseñor. Sostienes las galaxias inmensas,<br>
así como los átomos invisibles.
</div>

<div class="estrofa">
Tú encauzas la historia por tu soberano poder.<br>
Las grandes naciones te son como el polvo en<br>
la balanza y ni un solo pajarillo cae sin ti.<br>
Eres el principio y el fin; desde la eternidad<br>
hasta la eternidad, tú eres Dios.
</div>

<div class="estrofa">
Eres perfecto en santidad y justicia, pero<br>
también grande en amor y misericordia.<br>
Enviaste a tu Hijo a morir por mí, un pecador<br>
condenado, y me diste nueva vida por fe en él.<br>
Ahora soy tuyo para siempre.
</div>

<div class="estrofa">
¡Padre celestial, cuando contemplo la magnitud<br>
de tu persona y tus obras, un cántico de adoración<br>
y gratitud brota de mi corazón hacia ti!
</div>
`,
67: `
<div class="titulo">
<span class="numero">67</span>
<b>Padre Eterno</b>
</div>

<div class="versiculo">
Adoremos y postrémonos… delante del Señor. Salmo 95:6
</div>

<div class="notas">La♭ (Capo 1 - Sol) — Con intensidad</div>

<div class="estrofa">
1. Padre eterno, me postro ante ti,<br>
Padre eterno, me postro ante ti;<br>
Yo te amo, te adoro, te rindo loor;<br>
Padre eterno, me postro ante ti.
</div>

<div class="estrofa">
2. Jesucristo, te alabaré,<br>
Jesucristo, te alabaré;<br>
Yo te amo, te adoro,<br>
Te rindo loor; Jesucristo, te alabaré.
</div>

<div class="estrofa">
3. Santo Espíritu Consolador,<br>
Santo Espíritu Consolador;<br>
Tú me guías, me ayudas, y vives en mí,<br>
Santo Espíritu Consolador.
</div>

<div class="estrofa">
4. Tres personas en un solo Dios,<br>
Tres personas en un solo Dios;<br>
¡Maravilla sublime, te exaltaré!<br>
Tres personas en un solo Dios.
</div>
`,
68: `
<div class="titulo">
<span class="numero">68</span>
<b>A nuestro Padre Dios</b>
</div>

<div class="versiculo">
Se postraron sobre sus rostros y adoraron al que vive por los siglos de los siglos. Apocalipsis 5:14
</div>

<div class="notas">Fa (Capo 1 - Mi) — Con solemnidad</div>

<div class="estrofa">
1. A nuestro Padre Dios alcemos nuestra voz,<br>
¡Gloria a él! Tal fue su amor que dio<br>
al Hijo que murió,<br>
Y así nos redimió, ¡Gloria a él!
</div>

<div class="estrofa">
2. A nuestro Salvador demos con fe loor;<br>
¡Gloria a él! Su sangre derramó;<br>
con ella nos lavó,<br>
Y el cielo nos abrió, ¡Gloria a él!
</div>

<div class="estrofa">
3. Al fiel Consolador celebre nuestra voz;<br>
¡Gloria a él! Con celestial fulgor<br>
nos muestra el amor<br>
De Cristo, el Señor; ¡Gloria a él!
</div>

<div class="estrofa">
4. Con gozo y amor, cantemos con fervor<br>
Al Trino Dios. En la eternidad mora la Trinidad;<br>
➤ ¡Por siempre alabad al Trino Dios! ➤
</div>
`,
69: `
<div class="titulo">
<span class="numero">69</span>
<b>De boca y corazón</b>
</div>

<div class="versiculo">
Cantad a Jehová con alabanza, cantad con arpa a nuestro Dios. Salmo 147:7
</div>

<div class="notas">Fa (Capo 1 - Mi) — Con amplitud</div>

<div class="estrofa">
1. De boca y corazón load al Dios del cielo;<br>
Pues dionos bendición, salud, paz y consuelo.
</div>

<div class="estrofa">
Tan sólo a su bondad debemos nuestro ser;<br>
Su santa voluntad nos guía por doquier.
</div>

<div class="estrofa">
2. Oh, Padre celestial, ven, danos este día<br>
Un corazón filial y lleno de alegría.
</div>

<div class="estrofa">
Consérvenos la paz tu brazo protector;<br>
Deseamos ver tu faz en comunión, Señor.
</div>

<div class="estrofa">
3. Dios Padre, Creador, con gozo te adoramos.<br>
Dios Hijo, Redentor, tu salvación cantamos.
</div>

<div class="estrofa">
Dios Santificador, te honramos en verdad.<br>
➤ Te ensalza nuestra voz, bendita Trinidad. ➤
</div>
`,
70: `
<div class="titulo">
<span class="numero">70</span>
<b>Himno a la Trinidad</b>
</div>

<div class="estrofa">
1. ¡Gloria al Todopoderoso,<br>
el Autor de salvación!<br>
Padre Santo, te exaltamos con la voz y el corazón,<br>
Por tu gracia sempiterna, por tu amor y tu bondad,<br>
Por tu gran misericordia, tu justicia y santidad.
</div>

<div class="estrofa">
2. ¡Gloria al Verbo encarnado,<br>
Jesucristo el Mediador!<br>
Guíanos, Pastor bendito, en la senda de tu amor;<br>
Redentor y luz del mundo, muéstranos tu potestad;<br>
Soberano Rey del cielo, haz aquí tu voluntad.
</div>

<div class="estrofa">
3. ¡Gloria al Santo Paracleto,<br>
nuestro fiel Consolador!<br>
Llénanos de paz y gozo, danos fuerza y valor;<br>
Ilumina nuestras mentes, guíanos en tu verdad,<br>
Para que podamos siempre caminar en santidad.
</div>

<div class="estrofa">
4. ¡Gloria al Trino Dios cantamos,<br>
quien nos dio la redención!<br>
Nuestros labios toca ahora<br>
para hablar con compasión,<br>
Nuestro oído haz que escuche<br>
de las almas el clamor,<br>
Nuestros ojos abre para ver<br>
al mundo con tu amor.
</div>
`,
71: `
<div class="titulo">
<span class="numero">71</span>
<b>Padre, te adoro</b>
</div>

<div class="versiculo">
Adorarán al Padre en espíritu y en verdad. Juan 4:23
</div>

<div class="notas">Fa (Capo 1 - Mi) — Con solemnidad — Canon a 3 voces</div>

<div class="estrofa">
•1. ① Padre, te adoro;<br>
② Doy a ti mi vida;<br>
③ Cuánto te amo.
</div>

<div class="estrofa">
•2. Cristo, te adoro;<br>
Doy a ti mi vida;<br>
Cuánto te amo.
</div>

<div class="estrofa">
•3. Espíritu Santo,<br>
Doy a ti mi vida;<br>
Cuánto te amo.
</div>
`,
72: `
<div class="titulo">
<span class="numero">72</span>
<b>Oh Padre, eterno Dios</b>
</div>

<div class="versiculo">
En el nombre del Padre, y del Hijo y del Espíritu Santo. Mateo 28:19
</div>

<div class="notas">Fa (Capo 1 - Mi) — Con amplitud</div>

<div class="estrofa">
•1. ¡Oh Padre, eterno Dios!<br>
Alzamos nuestra voz en gratitud<br>
Por lo que tú nos das con sin igual amor,<br>
Hallando nuestra paz en ti, Señor.
</div>

<div class="estrofa">
•2. ¡Bendito Salvador!<br>
Te damos con amor el corazón;<br>
Y aquí nos puedes ver, que humildes a tu altar<br>
Venimos a ofrecer precioso don.
</div>

<div class="estrofa">
•3. ¡Espíritu de Dios!<br>
Escucha nuestra voz, y tu bondad<br>
Derrame en nuestro ser divina claridad,<br>
Para poder vivir en santidad.
</div>
`,
73: `
<div class="titulo">
<span class="numero">73</span>
<b>Te loamos, oh Dios</b>
</div>

<div class="versiculo">
Yo me alegraré en Jehová, y me gozaré en el Dios de mi salvación. Habacuc 3:18
</div>

<div class="notas">Fa (Capo 1 - Mi) — Con reverencia</div>

<div class="estrofa">
1. Te loamos ¡Oh Dios!<br>
con unánime voz,<br>
Porque en Cristo tu Hijo<br>
nos diste perdón.
</div>

<div class="coro">
Coro: ¡Aleluya! te alabamos,<br>
¡Cuán grande es tu amor!<br>
¡Aleluya! te adoramos, Bendito Señor.
</div>

<div class="estrofa">
2. Te loamos, Jesús,<br>
Quien tu trono de luz<br>
Has dejado por darnos<br>
salud en la cruz.
</div>

<div class="coro">
Coro: ¡Aleluya! te alabamos,<br>
¡Cuán grande es tu amor!<br>
¡Aleluya! te adoramos, Bendito Señor.
</div>

<div class="estrofa">
3. Te damos loor,<br>
Santo Consolador,<br>
Quien nos llenas<br>
de gozo y santo valor.
</div>

<div class="coro">
Coro: ¡Aleluya! te alabamos,<br>
¡Cuán grande es tu amor!<br>
¡Aleluya! te adoramos, Bendito Señor.
</div>

<div class="estrofa">
4. Unidos load a la gran Trinidad,<br>
Que es la fuente de gracia,<br>
virtud y verdad.
</div>

<div class="coro">
Coro: ¡Aleluya! te alabamos,<br>
¡Cuán grande es tu amor!<br>
¡Aleluya! te adoramos, Bendito Señor.
</div>
`,
74: `
<div class="titulo">
<span class="numero">74</span>
<b>Loor a tu nombre</b>
</div>

<div class="estrofa">
Oh Dios, como es tu nombre, así es tu<br>
alabanza hasta los confines de la tierra;
</div>

<div class="estrofa">
No a nosotros, SEÑOR, no a<br>
nosotros
</div>

<div class="estrofa">
Sino a tu nombre da gloria,
</div>

<div class="estrofa">
Por tu misericordia, por tu verdad.
</div>

<div class="notas">Salmo 48:10a; 115:1 (BLA)</div>
`,
75: `
<div class="titulo">
<span class="numero">75</span>
<b>Cantad al Señor</b>
</div>

<div class="versiculo">
Cantad al Señor cántico nuevo. Salmo 96:1
</div>

<div class="notas">Mi m — Con júbilo</div>

<div class="estrofa">
1. /// Cantad al Señor un cántico nuevo, ///<br>
Cantad al Señor, cantad al Señor.
</div>

<div class="estrofa">
2. /// El es Creador y dueño de todo, ///<br>
Cantad al Señor, cantad al Señor.
</div>

<div class="estrofa">
3. /// Cantad a Jesús, porque él es digno, ///<br>
Cantad al Señor, cantad al Señor.
</div>

<div class="estrofa">
4. /// Es él quien nos dio su Espíritu Santo, ///<br>
Cantad al Señor, cantad al Señor.
</div>

<div class="estrofa">
5. /// Cantad al Señor, “¡Amén, aleluya!” ///<br>
↬ Cantad al Señor, cantad al Señor. ↫
</div>
`,
76: `
<div class="titulo">
<span class="numero">76</span>
<b>Santo, Santo</b>
</div>

<div class="versiculo">
Y no cesaban día y noche de decir: Santo, santo, santo es el Señor. Apocalipsis 4:8
</div>

<div class="notas">Do — Con devoción</div>

<div class="estrofa">
1. Santo, santo; santo, santo;<br>
Santo, santo eres tú, Señor amado;<br>
Elevamos nuestra voz en alabanza ante ti;<br>
Santo, santo; santo, santo.
</div>

<div class="estrofa">
2. Padre eterno, Padre eterno;<br>
Somos hijos bendecidos, Padre eterno;<br>
Y con cánticos de gozo te rendimos gratitud;<br>
Padre eterno, Padre eterno.
</div>

<div class="estrofa">
3. Jesucristo, Jesucristo;<br>
Somos salvos por tu sangre, Jesucristo;<br>
Y con notas de alegría hoy cantamos tu loor;<br>
Jesucristo, Jesucristo.
</div>

<div class="estrofa">
4. Santo Espíritu, Santo Espíritu;<br>
Nos enseñas y nos guías, Santo Espíritu;<br>
Y con gracias te alabamos<br>
por tu obra en nuestro ser;<br>
Santo Espíritu, Santo Espíritu.
</div>

<div class="estrofa">
5. Aleluya, aleluya; Con amor te adoramos,<br>
Dios bendito; Y ofrecemos nuestra vida<br>
en señal de gratitud; Aleluya, aleluya.
</div>
`,
77: `
<div class="titulo">
<span class="numero">77</span>
<b>Honremos a la Trinidad</b>
</div>

<div class="estrofa">
Bendito sea el Dios y Padre de nuestro<br>
señor Jesucristo, Padre de misericordias<br>
y Dios de toda consolación,
</div>

<div class="estrofa">
<b>Es también quien nos ha sellado<br>
y ha puesto como garantía al Espíritu<br>
en nuestros corazones.</b>
</div>

<div class="estrofa">
Ahora bien, hay diversidad de dones;<br>
pero el Espíritu es el mismo.
</div>

<div class="estrofa">
<b>Hay también diversidad de ministerios,<br>
pero el Señor es el mismo.</b>
</div>

<div class="estrofa">
También hay diversidad de actividades,<br>
pero el mismo Dios es el que realiza<br>
todas las cosas en todos.
</div>

<div class="estrofa">
<b>Hay un solo cuerpo y un solo Espíritu,<br>
así como habéis sido llamados a una<br>
sola esperanza de vuestro llamamiento.</b>
</div>

<div class="estrofa">
Hay un solo Señor, una sola fe,<br>
un solo bautismo,
</div>

<div class="estrofa">
<b>Un solo Dios y Padre de todos,<br>
quien es sobre todos, a través<br>
de todos y en todos.</b>
</div>

<div class="notas">
2 Corintios 1:3, 22; 1 Corintios 12:4-6; Efesios 4:4-6 (RVA)
</div>
`,
78: `
<div class="titulo">
<span class="numero">78</span>
<b>Gloria a tu nombre por doquier</b>
</div>

<div class="versiculo">
El nombre de nuestro Señor...sea glorificado. 2 Tesalonicenses 1:12
</div>

<div class="notas">Do — Con reverencia</div>

<div class="estrofa">
•1. Padre, te amo, te alabo y te adoro;<br>
Gloria a tu nombre por doquier.<br>
Gloria a ti, Señor, Gloria a ti, Señor;<br>
Gloria a tu nombre por doquier.
</div>

<div class="estrofa">
•2. Cristo, te amo, te alabo y te adoro;<br>
Gloria a tu nombre por doquier.<br>
Gloria a ti, Señor, Gloria a ti, Señor;<br>
Gloria a tu nombre por doquier.
</div>

<div class="estrofa">
•3. Espíritu, te alabo y te adoro;<br>
Gloria a tu nombre por doquier.<br>
↬ Gloria a ti, Señor, Gloria a ti, Señor;<br>
Gloria a tu nombre por doquier. ↫
</div>
`,
79: `
<div class="titulo">
<span class="numero">79</span>
<b>Eterno Padre celestial</b>
</div>

<div class="versiculo">
Dios es luz, y no hay ningunas tinieblas en él. 1 Juan 1:5
</div>

<div class="notas">Do — Con majestuosidad</div>

<div class="estrofa">
•1. Eterno Padre celestial,<br>
Autor de toda la creación,<br>
Que en el espacio sideral<br>
Pusiste astros, luna y sol;<br>
Oh, guárdanos de todo mal,<br>
Concédenos tu protección.
</div>

<div class="estrofa">
•2. Oh, Luz que brota de su luz,<br>
Brillando siempre en sombra y sol,<br>
Con inefable magnitud,<br>
De Dios eterno resplandor;<br>
Radiante Sol de plenitud,<br>
Oh, llénanos de tu amor.
</div>

<div class="estrofa">
•3. Tu Santo Espíritu aquí<br>
Dirija siempre nuestra acción;<br>
Gozoso el día pase así,<br>
Por tu constante dirección;<br>
Al descansar repose en ti,<br>
Seguro, nuestro corazón.
</div>
`,
80: `
<div class="titulo">
<span class="numero">80</span>
<b>Adoradle</b>
</div>

<div class="versiculo">
Alabaré tu nombre por tu misericordia y tu fidelidad. Salmo 138:2
</div>

<div class="notas">Mi b (Capo 1 - Re) — Con reverencia</div>

<div class="estrofa">
1. Dad al Padre toda gloria,<br>
Dad al Hijo todo honor,<br>
Y al Espíritu Divino, Alabanzas de loor.
</div>

<div class="coro" style="font-style: italic;">
Coro: Adoradle, adoradle, Adorad al Salvador.<br>
(al Salvador.) Tributadle toda gloria,<br>
Pueblo suyo por su grande amor.
</div>

<div class="estrofa">
2. Entonadle un canto nuevo,<br>
Huestes libres del Señor;<br>
Tierra, cielo, mar y luna,<br>
Gloria dan al Trino Dios.
</div>

<div class="estrofa">
3. ¡Adoradle, oh Iglesia!<br>
Por Jesús tu Redentor, Rescatada por su gracia,<br>
Libre por su grande amor.
</div>

<div class="coro" style="font-style: italic;">
Ultimo coro: Yo te adoro, yo te adoro,<br>
Yo te adoro, buen Jesús. (mi buen Jesús.)<br>
↬ Yo te adoro reverente,<br>
¡Oh, Cordero santo de mi Dios! ↫
</div>
`,
81: `
<div class="titulo">
<span class="numero">81</span>
<b>Lo que respira</b>
</div>

<div class="versiculo">
Todo lo que respira alabe al SEÑOR. ¡Aleluya! Salmo 150:6 (BLA)
</div>

<div class="notas">Do — Con júbilo</div>

<div class="estrofa">
Alabad a nuestro Dios en su santuario,<br>
por la hermosura de su cielo,<br>
por sus proezas alabadle a él.
</div>

<div class="estrofa">
Alabadle por la grandeza de su nombre,<br>
con el sonido de bocina,<br>
salterio y arpa, a la vez cantad.
</div>

<div class="estrofa">
Alabadle con el alegre pandero,<br>
con el candor de la danza;<br>
cantad con gozo al Señor.
</div>

<div class="estrofa">
Alabadle con cuerdas,<br>
flautas y címbalos<br>
de júbilo resonantes.
</div>

<div class="estrofa">
En su lenguaje todo lo que respira<br>
alabe al Señor.<br>
Lo que respira alabe al Señor.<br>
¡Amén!
</div>
`,
82: `
<div class="titulo">
<span class="numero">82</span>
<b>Te alabaremos, Señor</b>
</div>

<div class="estrofa">
Cantad alegres a Dios,<br>
habitantes de toda la tierra.
</div>

<div class="estrofa">
Servid a Jehová con alegría;<br>
venid ante su presencia con regocijo.
</div>

<div class="estrofa">
Reconoced que Jehová es Dios;<br>
él nos hizo, y no nosotros<br>
a nosotros mismos; pueblo suyo somos,<br>
y ovejas de su prado.
</div>

<div class="estrofa">
Entrad por sus puertas con acción<br>
de gracias, por sus atrios con alabanza;<br>
alabadle, bendecid su nombre.
</div>

<div class="versiculo">
Salmo 100:1-4 (RVR)
</div>
`,
83: `
<div class="titulo">
<span class="numero">83</span>
<b>A Dios cantad</b>
</div>

<div class="versiculo">
Cantad a Dios, cantad al Señor. Salmo 68:32
</div>

<div class="notas">Re m — Con vigor — Canon a 3 voces</div>

<div class="estrofa">
① Al Padre alabad,<br>
② Al Hijo load,<br>
③ A Dios cantad;<br>
Al Santo Espíritu adorad, A Dios celebrad.
</div>

<div class="estrofa" style="font-style: italic;">
(Letra hebrea)<br>
① ¡Shalom javerim!<br>
② ¡Shalom javerim!<br>
③ ¡Shalom! ¡Shalom!<br>
La paz del Señor contigo esté,<br>
¡Shalom! ¡Shalom!
</div>
`,
84: `

94: `
<div class="titulo">
<span class="numero">94</span>

</div>

<div class="versiculo">
Dios mío eres tú; de madrugada te buscaré. Salmo 63:1
</div>

<div class="estrofa">
1. Por la mañana yo dirijo mi alabanza<br>

Por la mañana yo le invoco con el alma<br>
Y le suplico que me dé su dulce calma.<br><br>

Él nos escucha, pues nos ama tanto,<br>
Y nos alivia de cualquier quebranto.<br>
Nos da su mano poderosa y fuerte,<br>
Para librarnos de la misma muerte.
</div>

<div class="estrofa">
2. Cuando la noche se aproxima, tenebrosa,<br>
En elevarle mi oración mi alma goza;<br>
Siento su paz inagotable, dulce y grata<br>
Porque temores y ansiedad, Cristo los mata.<br><br>

También elevo mi cantar al cielo<br>
Cuando a la tierra baja negro velo.<br>
El sol se oculta, pero queda Cristo,<br>
A quien mis ojos en el sueño han visto.
</div>

<div class="estrofa">
3. Brilla su lumbre bienhechora mientras duermo;<br>
Pone su mano sobre mí si estoy enfermo.<br>
Me fortalece, me alienta con el sueño,<br>
Pues es mi Dios, mi Redentor y él es mi dueño.<br><br>

Y al despertar por la mañana siento<br>

Veo a Jesús, mi Redentor amado,<br>
Por mi pecado en una cruz clavado.
</div>

<div class="estrofa">
4. Veo la sangre de sus manos que ha brotado;<br>
Veo la sangre borbotando en un costado;<br>
Una corona con espinas en su frente,<br>
La multitud escarneciéndole insolente.<br><br>

Pero, ¡qué dicha cuando al cielo sube,<br>
Lleno de gloria en majestuosa nube!<br>
Pero, ¡qué dicha cuando al cielo sube,<br>
Lleno de gloria en majestuosa nube!

De gloria vestido, le damos loor.
</div>

<div class="estrofa">
2. Decid de su amor, su gracia cantad;<br>
Vestido de luz y de majestad.<br>
Su carro de fuego en las nubes mirad;<br>
Son negras sus huellas en la tempestad.
</div>

<div class="estrofa">
3. ¿Quién puede tu providencia contar?<br>
Pues tu aire me das para respirar.<br>
En valles y en montes alumbra tu luz,<br>
Y con gran dulzura me cuida Jesús.
</div>

<div class="estrofa">
4. Muy frágiles son los hombres aquí,<br>
Mas por tu bondad confiamos en ti.<br>
Tu misericordia ¡Cuán firme! ¡Cuán fiel!<br>
Creador, Salvador y Amigo es él.
</div>
`,
108: `
<div class="titulo">
<span class="numero">108</span>
<b>Jubilosos, te adoramos</b>
</div>

<div class="versiculo">
Aclamad a Dios con voz de júbilo. Salmo 47:1
</div>

<div class="notas">Sol — Con amplitud</div>

<div class="estrofa">
1. Jubilosos, te adoramos, Dios de gloria y Salvador;<br>
Nuestras vidas te entregamos Como se abre al sol la flor.<br>
Ahuyenta nuestros males y tristezas, oh Jesús;<br>
Danos bienes celestiales, llénanos de gozo y luz.
</div>

<div class="estrofa">
2. Tierra y cielo están gozosos, reflejando tu amor;<br>
Ángeles y estrellas todos cantan siempre tu loor.<br>
Monte, valle, río y fuente, campo, selva y ancho mar<br>
Nos recuerdan que constante te debemos alabar.
</div>

<div class="estrofa">
3. Dios, que libre proporcionas bienestar y bendición,<br>
Y en tu gracia nos perdonas, gozo da al corazón.<br>
Tú, de todo amor la fuente, haz que amemos en verdad;<br>
Ilumina nuestra mente con divina claridad.
</div>

<div class="estrofa">
4. Oh, mortales, hoy cantemos con el coro celestial;<br>
Como hermanos habitemos en amor santo y real.<br>
Alabando siempre vamos en la lucha a conquistar;<br>
Si confiando en ti andamos nos ayudas a triunfar.
</div>
`,
109: `
<div class="titulo">
<span class="numero">109</span>
<b>El nacimiento de Jesucristo</b>
</div>

<div class="versiculo">
[vea 108 +]
</div>

<div class="lectura">
José subió de Galilea,...a Belén, por cuanto era de la casa y familia de David;<br>
para ser empadronado con María su mujer, desposada con él, la cual estaba encinta.<br>
Y aconteció que estando ellos allí, se cumplieron los días de su alumbramiento.<br>
Y dio a luz a su hijo primogénito, y lo envolvió en pañales, y lo acostó en un pesebre, porque no había lugar para ellos en el mesón.
</div>

<div class="lectura">
Había pastores en la misma región, que velaban y guardaban las vigilias de la noche sobre su rebaño.<br>
Y he aquí, se les presentó un ángel del Señor, y la gloria del Señor los rodeó de resplandor; y tuvieron gran temor.<br>
Pero el ángel les dijo: No temáis; porque he aquí os doy nuevas de gran gozo, que será para todo el pueblo:<br>
Que os ha nacido hoy, en la ciudad de David, un Salvador, que es CRISTO el Señor.
</div>

<div class="versiculo">
Lucas 2:4-11 (RVR)
</div>
`,
110: `

`,
111: `
<div class="titulo">
<span class="numero">111</span>
<b>Oh ven, bendito Emanuel</b>
</div>
<div class="versiculo">

</div>

vendrá a ti muy pronto, Israel.
</div>
`,
112: `

113: `

114: `

`,
115: `

116: `
<div class="titulo">
<span class="numero">116</span>
<b>Oh, pueblecito de Belén</b>
</div>
<div class="versiculo">
La ciudad de David, que se llama Belén. Lucas 2:4
</div>
<div class="notas">Fa (Capo 1 - Mi) — Con calma</div>
<div class="estrofa">
1. ¡Oh, pueblecito de Belén, durmiendo en dulce paz!<br>

Y la promesa de Emanuel se cumple en Jesús.
</div>
<div class="estrofa">

</div>
<div class="estrofa">

</div>
<div class="estrofa">
4. El Santo Niño de Belén es nuestro Salvador,<br>
Quien por su sangre perdonó el mal con tanto amor;<br>

Y proclamamos por doquier su gloria celestial.
</div>
`,
117: `
<div class="titulo">

118: `
<div class="titulo">

`,
119: `
<div class="titulo">

<div class="estrofa">
1. ¡Gloria a Dios en las alturas! Que mostró<br>

<div class="estrofa">

¡En los cielos gloria a Dios!
</div>
<div class="estrofa">

y a la lucha se apercibe, mientras llega su solaz<br>
En la gloria y plena paz, donde exclame a una voz:<br>
¡En los cielos gloria a Dios!
</div>
`,

121: `

`,
122: `

Adoremos, adoremos<br>

`,
123: `
<div class="titulo">

124: `

125: `

`,
126: `
<div class="titulo">
<span class="numero">126</span>
<b>Oíd un son en alta esfera</b>
</div>

</div>

<div class="notas">Fa (Capo 1 - Mi) — Con vigor</div>

<div class="estrofa">
1. Oíd un son en alta esfera:<br>
"¡En los cielos gloria a Dios!<br>
¡Y al mortal paz en la tierra!" canta la celeste voz.<br>
Con los cielos alabemos al eterno Rey; cantemos<br>
A Jesús que es nuestro bien, con el coro de Belén;<br>
Canta la celeste voz: "¡En los cielos gloria a Dios!"
</div>

<div class="estrofa">
2. El Señor de los señores, el Ungido celestial,<br>
Por salvar a pecadores toma forma corporal.<br>
¡Gloria al Verbo encarnado, en humanidad velado!<br>
¡Gloria a nuestro Redentor, a Jesús, Rey y Señor!<br>
Canta la celeste voz: "¡En los cielos gloria a Dios!"
</div>

<div class="estrofa">
3. Príncipe de paz eterna, gloria a ti, Señor Jesús;<br>
Con tu vida y con tu muerte nos ofreces vida y luz.<br>
Has tu majestad dejado,<br>
a buscarnos te has dignado;<br>
Para darnos el vivir, en la cruz fuiste a morir.<br>
Canta la celeste voz: "¡En los cielos gloria a Dios!"
</div>
`,
127: `

Adorad al Niño, adorad al Niño,<br>

128: `
<div class="titulo">

</div>

los cielos dan loor;<br>

Es Cristo el Señor a quien<br>
los cielos dan loor;<br>

</div>
`,
129: `
<div class="titulo">
<span class="numero">129</span>
<b>Allá en el pesebre</b>
</div>

<div class="versiculo">
Dio a luz a su hijo primogénito... y lo acostó en un pesebre. Lucas 2:7
</div>

<div class="notas">Fa (Capo 1 - Mi) — Con dulzura</div>

<div class="estrofa">
1. Allá en el pesebre, do nace Jesús,<br>
La cuna de paja nos vierte gran luz;<br>
Estrellas lejanas del cielo al mirar<br>
Se inclinan gozosas su lumbre a prestar.
</div>

</div>
`,
130: `

131: `
<div class="titulo">
<span class="numero">131</span>
<b>Santa la noche</b>
</div>

<div class="versiculo">
El Santo Ser que nacerá, será llamado Hijo de Dios. Lucas 1:35
</div>

<div class="notas">Do — Con emoción</div>

<div class="estrofa">
1. Santa la noche, hermosas las estrellas,<br>
La noche cuando nació el Señor.<br>
El mundo envuelto estuvo en sus querellas<br>
Hasta que Dios nos mandó al Salvador.<br>
Una esperanza todo el mundo siente,<br>
La luz de un nuevo día sin igual;<br>
Con gratitud postrados adoradle;<br>
Oíd de lo alto la voz angelical;<br>
¡Oíd, cantad! Nació el Salvador.
</div>

<div class="estrofa">
2. Hoy por la fe llegamos al pesebre<br>
A contemplar al bendito Jesús,<br>
Como también los magos del oriente<br>
Llegaron guiados por célica luz.<br>
Fue por nacer así humildemente<br>
Que nuestras pruebas sabe comprender;<br>
Hoy Emanuel es "Dios ya con nosotros";<br>
Cantemos al Rey, a Jesús el Salvador;<br>
¡Regocijad! Nació el Redentor.
</div>

<div class="estrofa">
3. Nos enseñó a amarnos tiernamente,<br>
Nos dio su ley de amor y su paz.<br>
Libra al esclavo que en cadenas gime,<br>
Y a su nombre huirá Satanás.<br>
Con cánticos de gozo alabemos<br>
Al Rey de reyes, nuestro Salvador;<br>
Hoy con amor cantemos reverentes;<br>
Alcemos la voz proclamando su poder,<br>
¡Dad gloria a Dios! Amén, por siempre amén.
</div>
`,
132: `
<div class="titulo">
<span class="numero">132</span>
<b>Oh niños, venid</b>
</div>

<div class="versiculo">
El Padre ha enviado al Hijo, el Salvador del mundo. 1 Juan 4:14
</div>

<div class="notas">Mi♭ (Capo 1 - Re) — Con gozo</div>

<div class="estrofa">
1. Oh, niños de todos los pueblos venid;<br>
Los cantos de ángeles miles oíd.<br>
En un pueblecito, llamado Belén,<br>
El Hijo de Dios ha nacido recién.
</div>

<div class="estrofa">
2. Mirad sobre el heno al niño Jesús;<br>
Le adoran pastores que han visto gran luz;<br>
Brillando en el cielo con gran claridad,<br>
Señal fue que Dios ama al mundo en verdad.
</div>

<div class="estrofa">
3. Los magos de oriente le ofrecen loor;<br>
Proclaman los ángeles gloria al Señor.<br>
José y María le adoran también;<br>
Oh niños, cantad a Jesús de Belén.
</div>

<div class="estrofa">
4. Oh, niños de todos los pueblos venid;<br>
Con huestes celestes la nueva esparcid.<br>
Felices, unid vuestras voces de amor;<br>
Alegre anunciad que nació el Salvador.
</div>
`,
133: `
<div class="titulo">
<span class="numero">133</span>

Brilla la estrella de paz.

Astro de eterno fulgor,<br>
Astro de eterno fulgor.
</div>
`,
134: `
<div class="titulo">
<span class="numero">134</span>

</div>

Hoy gozosos celebremos<br>
a venida del Señor;<br>

</div>

que anuncian la gran Navidad;<br>

felicidad.

Hoy gozosos celebremos<br>
a venida del Señor;<br>

</div>
`,
135: `

136: `
<div class="titulo">

137: `
<div class="titulo">

<div class="coro" style="font-style: italic;">
Oh brillante estrella<br>
que anuncias la aurora,<br>

que anuncias la aurora,<br>

138: `
<div class="titulo">
<span class="numero">138</span>
<b>Tras hermoso lucero</b>
</div>

<div class="versiculo">
Su estrella hemos visto en el oriente, y venimos a adorarle. Mateo 2:2
</div>

<div class="notas">Si♭ (Capo 1 - La) — Con sentimiento</div>

<div class="estrofa">
1. Tras hermoso lucero, los magos viajaban<br>
pensando a palacio llegar.<br>
Y llevaban regalos preciosos al<br>
Rey que deseaban venir a adorar.<br>
Al llegar a Belén ¡ved qué bella!<br>
Al llegar a Belén ¡ved la estrella!<br>
Con su luz alumbraba un establo y allí,<br>
En el heno dormía el gran Rey.
</div>

<div class="estrofa">
2. En el campo pastores cuidaban ovejas<br>
y vieron un gran resplandor.<br>
Luego el ángel del cielo les dijo:<br>
"Os doy nuevas que hoy nació el Salvador".<br>
Muchos ángeles bellos cantaron<br>
Al Señor, al Eterno alabaron.<br>
Los pastores buscaron al Niño y allí,<br>
En el heno dormía el gran Rey.
</div>

<div class="estrofa">
3. Ofrecieron los magos al Niño Jesús<br>
ricos dones con gran devoción.<br>
Los pastores humildes le dieron<br>
cariño de tierno y de fiel corazón.<br>
Yo también, oh Jesús, hoy me acerco;<br>
Yo también, oh Jesús, hoy te adoro,<br>
Y te ofrezco mi vida, regalo de amor;<br>
¡Haz en ella tu trono, mi Rey!
</div>
`,
139: `
<div class="titulo">
<span class="numero">139</span>
<b>Tú dejaste tu trono</b>
</div>

<div class="versiculo">
No había lugar... en el mesón. Lucas 2:7
</div>

<div class="notas">Fa (Capo 1 - Mi) — Con admiración</div>

<div class="estrofa">
1. Tú dejaste tu trono y corona por mí,<br>
Al venir a Belén a nacer;<br>
Mas a ti no fue dado el entrar al mesón,<br>
Y en pesebre te hicieron nacer.
</div>

<div class="estrofa">
2. Alabanzas celestes los ángeles dan<br>
En que rinden al Verbo loor;<br>
Mas humilde viniste a la tierra, Señor,<br>
A dar vida al más vil pecador.
</div>

<div class="estrofa">
3. Siempre pueden las zorras sus cuevas tener,<br>
Y las aves sus nidos también;<br>
Mas el Hijo del Hombre no tuvo un lugar<br>
En el cual reclinara su sien.
</div>

<div class="estrofa">
4. Tú viniste, Señor, con tu gran bendición<br>
Para dar libertad y salud;<br>
Mas con odio y desprecio te hicieron morir,<br>
Aunque vieron tu amor y virtud.
</div>

<div class="estrofa">
5. Alabanzas sublimes los cielos darán,<br>
Cuando vengas glorioso de allí,<br>
Y tu voz en las nubes dirá: "Ven a mí,<br>
Que hay lugar junto a mí para ti".
</div>
`,
140: `
<div class="titulo">

Venid, adoremos, venid, adoremos.<br>
Venid, adoremos a Cristo el Señor.
</div>

<div class="estrofa">
3. En pobre pesebre yace reclinado,<br>
Al hombre ofreciendo eternal salvación,<br>

</div>

<div class="coro" style="font-style: italic;">
Venid, adoremos, venid, adoremos.<br>
Venid, adoremos a Cristo el Señor.
</div>

<div class="estrofa">
4. Cantad jubilosas, célicas criaturas;<br>

</div>

<div class="coro" style="font-style: italic;">
Venid, adoremos, venid, adoremos.<br>
Venid, adoremos a Cristo el Señor.
</div>

<div class="estrofa">
5. Jesús, celebremos tu bendito nombre<br>

</div>

<div class="coro" style="font-style: italic;">
Venid, adoremos, venid, adoremos.<br>
Venid, adoremos a Cristo el Señor.
</div>
`,
141: `
<div class="titulo">
<span class="numero">141</span>
<b>Oveja Perdida</b>
</div>

<div class="estrofa">
1. Oveja perdida, ven<br>
sobre mis hombros; que hoy,<br>
no sólo tu pastor soy,<br>
sino tu pasto también.
</div>

<div class="estrofa">
Por descubrirte mejor<br>
cuando balabas perdida,<br>
dejé en un árbol la vida,<br>
donde me subió tu amor;<br>
si prenda quieres mayor,<br>
mis obras hoy te la den.
</div>

<div class="estrofa">
Pasto al fin tuyo hecho,<br>
¿Cuál dará mayor asombro,<br>
el traerte yo en el hombro,<br>
o traerme tú en el pecho?<br>
Prendas son de amor estrecho,<br>
que aún los más ciegos las ven.
</div>

<div class="estrofa">
Oveja perdida, ven<br>

162: `
<div class="titulo">
<span class="numero">162</span>
<b>El amor de Cristo</b>
</div>

<div class="versiculo">
¿Quién nos separará del amor de Cristo?
</div>

<div class="estrofa">
¿Tribulación, o angustia, o persecución, o<br>
hambre, o desnudez, o peligro, o espada?<br>
<br>
Antes, en todas estas cosas somos más que<br>
vencedores por medio de aquel que nos amó.<br>
<br>
Por lo cual estoy seguro de que ni la<br>
muerte, ni la vida, ni ángeles, ni<br>
principados, ni potestades,<br>
ni lo presente, ni lo por venir,<br>
<br>
Ni lo alto, ni lo profundo, ni ninguna otra<br>
cosa creada nos podrá separar del amor de Dios,<br>
que es en Cristo Jesús Señor nuestro.<br>
<br>
Para que habite Cristo por la fe en<br>
vuestros corazones, a fin de que,<br>
arraigados y cimentados en amor,<br>
<br>
Seáis plenamente capaces de comprender<br>
con todos los santos cuál sea la anchura,<br>
la longitud, la profundidad y la altura,<br>
<br>
Y de conocer el amor de Cristo, que<br>
excede a todo conocimiento, para que<br>
seáis llenos de toda la plenitud de Dios.
</div>

177: `

178: `
<div class="titulo">
<span class="numero">178</span>
<b>Sea la paz</b>
</div>

<div class="versiculo">
Levantándose, reprendió al viento y dijo al mar: Calla, enmudece. Marcos 4:39
</div>

<div class="notas">Si♭ (Capo 1 - La) — Con emoción</div>

<div class="estrofa">
1. ¡Maestro, se encrespan las aguas<br>
y ruge la tempestad! Los grandes abismos<br>
del cielo se llenan de oscuridad.<br>
¿No ves que aquí perecemos?<br>
¿Puedes dormir así,<br>
Cuando el mar agitado nos abre<br>
profundo sepulcro aquí?
</div>

<div class="coro" style="font-style: italic;">
Los vientos, las ondas oirán tu voz,<br>
"¡Sea la paz!" ("¡Sea la paz, sea la paz!")<br>
Calmas las iras del negro mar,<br>
Las luchas del alma las haces cesar,<br>
Y así la barquilla do va el Señor,<br>
Hundirse no puede en el mar traidor.<br>
Doquier se cumple tu voluntad,<br>
"¡Sea la paz!" "¡Sea la paz!"<br>
Tu voz resuena en la inmensidad,<br>
"¡Sea la paz!"
</div>

<div class="estrofa">

De mi alma en los antros profundos<br>
se libra cruel tempestad.<br>

¡Y perezco, perezco, Maestro!<br>
¡Oh, quiéreme socorrer!
</div>

<div class="coro" style="font-style: italic;">
Los vientos, las ondas oirán tu voz,<br>
"¡Sea la paz!" ("¡Sea la paz, sea la paz!")<br>

Las luchas del alma las haces cesar,<br>
Y así la barquilla do va el Señor,<br>

</div>

180: `

182: `
<div class="titulo">
<span class="numero">182</span>
<b>El ministerio terrenal de Jesús</b>
</div>

<div class="estrofa">
Al comenzar su ministerio, Jesús tenía como treinta años.<br>
Fue a Nazaret, donde se había criado, y conforme a su<br>
costumbre, el día sábado entró en la sinagoga, y se levantó<br>
para leer.<br>
<br>
Se le entregó el rollo del profeta Isaías; y cuando<br>
abrió el rollo, encontró el lugar donde estaba<br>
escrito:<br>
<br>
El Espíritu del Señor está sobre mí, porque me ha ungido para<br>
anunciar buenas nuevas a los pobres;<br>
<br>
Me ha enviado para proclamar libertad a los<br>
cautivos y vista a los ciegos, para poner en<br>
libertad a los oprimidos y para<br>
proclamar el año agradable del Señor.<br>
<br>
Después de enrollar el libro y devolverlo al ayudante, se sentó. Y<br>
los ojos de todos en la sinagoga estaban fijos en él.<br>
<br>
Entonces comenzó a decirles: "Hoy se ha<br>
cumplido esta Escritura en vuestros oídos".<br>
<br>
Y se asombraban de su enseñanza, porque su<br>
palabra era con autoridad.<br>
<br>
Pero él les dijo: "Me es necesario anunciar el<br>
evangelio del reino de Dios a otras ciudades<br>
también, porque para esto he sido enviado".<br>
<br>
Su fama se extendía cada vez más, y se juntaban a él<br>
muchas multitudes para oírle y para ser sanadas de<br>
sus enfermedades.<br>
<br>
Pero él se apartaba a los lugares desiertos y oraba.
</div>
`,

Y contemplaba la ciudad santa.<br>
¡Oh, Jerusalén la hermosa! Tú que has matado<br>
Cuantos te ha enviado mi Padre Dios.
</div>

<div class="coro" style="font-style: italic;">
¡Oh Jerusalén, Jerusalén, ciudad de Sion!<br>
Llora por ti hoy mi corazón:<br>
Como el ave al hijo le da siempre protección,<br>
vine yo a traerte salvación.<br>
¡Oh, Jerusalén la hermosa!<br>
Tú que has matado<br>
Cuantos te ha enviado mi Padre Dios.
</div>

<div class="estrofa">
2. Y cuando Jesús moría en cruz clavado,<br>
Al vil malvado él bendecía. Si tú aceptas<br>
hoy la sangre que ha derramado,<br>
Serás llevado a Jerusalén.
</div>

<div class="coro" style="font-style: italic;">
¡Oh Jerusalén, Jerusalén, ciudad de Sion!<br>
Llora por ti hoy mi corazón:<br>
Como el ave al hijo le da siempre protección,<br>
vine yo a traerte salvación.<br>
¡Oh, Jerusalén la hermosa!<br>
Tú que has matado<br>
Cuantos te ha enviado mi Padre Dios.
</div>
`,

191: `
<div class="titulo">
<span class="numero">191</span>
<b>¿Qué quiero mi Jesús?</b>
</div>

<div class="estrofa">
¿Qué quiero, mi Jesús?...Quiero quererte,<br>
quiero cuanto hay en mí, del todo darte<br>
sin tener más placer que el agradarte,<br>
sin tener más temor que el ofenderte.<br>
<br>
Quiero olvidarlo todo y conocerte,<br>
quiero dejarlo todo por buscarte,<br>
quiero perderlo todo por hallarte,<br>
quiero ignorarlo todo por saberte.<br>
<br>
Quiero, amable Jesús, abismarme<br>
en ese dulce hueco de tu herida,<br>
y en tus divinas llamas abrasarme.<br>
<br>
Quiero, por fin, en ti transfigurarme,<br>
morir a mí, para vivir tu vida,<br>
perderme en ti, Jesús, y no encontrarme.
</div>
`,

193: `
<div class="titulo">
<span class="numero">193</span>
<b>Fue de Dios la santa voluntad</b>
</div>

<div class="versiculo">
Se despojó a sí mismo, tomando forma de siervo. Filipenses 2:7
</div>

<div class="notas">Do — Con intensidad</div>

<div class="estrofa">
1. A solas en Getsemaní el Salvador sufrió;<br>
La copa amarga de dolor mi buen Jesús bebió.<br>
A solas en el tribunal las burlas aguantó,<br>
Pues fue de Dios la santa voluntad.
</div>

<div class="coro" style="font-style: italic;">
Se despojó del trono y todo su esplendor;<br>
Fue despreciado y desechado el Salvador,<br>
Mas como oveja no abrió su boca mi Señor,<br>
Pues fue de Dios la santa voluntad.
</div>

<div class="estrofa">
2. A solas al Calvario, Cristo el Redentor subió;<br>
Sin murmurar, mis negras penas<br>
en la cruz sufrió.<br>
"Dios mío, ¿por qué me has dejado?"<br>
con dolor clamó,<br>
Mas fue de Dios la santa voluntad.
</div>

<div class="coro" style="font-style: italic;">
Se despojó del trono y todo su esplendor;<br>
Fue despreciado y desechado el Salvador,<br>
Mas como oveja no abrió su boca mi Señor,<br>
